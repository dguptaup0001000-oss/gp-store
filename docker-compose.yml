# Local laptop development. Publishes Postgres/Redis/API on the host.
# Production Hostinger Compose (no public 5432/6379/8081) is
# backend/docker-compose.yml — see backend/HOSTINGER_DEPLOYMENT.md.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - gpstore_pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backs the app's cache (spring.cache.type=redis) and the distributed
  # rate limiter (see config.RateLimitFilter) - both need a shared store the
  # moment more than one backend instance runs, which an in-memory
  # implementation can't provide.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - gpstore_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  gpstore_pg_data:
  gpstore_redis_data:

# --- One-time follow-up after your FIRST `docker compose up` ---
# The products table doesn't exist until the app has started once and
# Hibernate has created it. After the app is up and running for the first
# time, run this once to finish the search-indexing setup (see
# src/main/resources/db/migration/README-search.md for why this is needed):
#
#   docker compose exec postgres psql -U gpstore -d gpstore -c "
#     CREATE INDEX IF NOT EXISTS idx_products_name_trgm ON products USING GIN (name gin_trgm_ops);
#     CREATE INDEX IF NOT EXISTS idx_products_brand_trgm ON products USING GIN (brand gin_trgm_ops);
#   "
