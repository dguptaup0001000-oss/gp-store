plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after Android/Kotlin.
    id "dev.flutter.flutter-gradle-plugin"
}

// Delivery-worker APK/AAB builds (tool/with_worker_pubspec.sh) do not
// compile Firebase Dart and must not require google-services.json. The
// customer entrypoint still applies both plugins below.
def workerSlim = (System.getenv("GPSTORE_WORKER_SLIM") ?: "0") == "1"
def workerApplicationId = (project.findProperty("gpstore.applicationId") ?: "").toString()
def workerApk = workerSlim || workerApplicationId == "com.gpstore.worker"
if (!workerApk) {
    // Needs android/app/google-services.json to exist (see
    // FIREBASE_SETUP.md) - without it, this line makes the build fail
    // loudly with a clear "File google-services.json is missing" error
    // rather than silently shipping an app where push never works.
    apply plugin: "com.google.gms.google-services"
    apply plugin: "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0.0"

// Real release signing - see key.properties.example for the one-time setup.
// This file is deliberately gitignored (it holds a path + two passwords).
// Release builds FAIL if it is missing, unless ALLOW_DEBUG_RELEASE_SIGNING=1
// is set for a local/CI sideload APK. Play uploads must never be debug-signed.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasRealSigningConfig = keystorePropertiesFile.exists()
def allowDebugReleaseSigning = (System.getenv("ALLOW_DEBUG_RELEASE_SIGNING") ?: "0") == "1" || project.hasProperty("allowDebugReleaseSigning")
if (hasRealSigningConfig) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.gpstore.app"

    // Delegated to whatever the installed Flutter SDK recommends, rather
    // than a hardcoded number that goes stale - this is the modern,
    // future-proof pattern `flutter create` itself uses.
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        // flutter_local_notifications' Android implementation uses java.time
        // APIs for scheduled notifications that don't exist natively below
        // API 26 - desugaring backports them. Without this, the release
        // build fails outright at Gradle's AAR metadata check
        // (":app:checkReleaseAarMetadata" - "Dependency
        // ':flutter_local_notifications' requires core library desugaring
        // to be enabled for :app"), not just a runtime warning.
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    // Three Android applications from one Flutter project. Flavor, not
    // dart-define, is what sets applicationId. Customer and admin MUST
    // never share an id or installing one replaces the other.
    flavorDimensions += "app"
    productFlavors {
        customer {
            dimension "app"
            applicationId "in.gpstore.customer"
            resValue "string", "app_name", "GP-STORE"
        }
        admin {
            dimension "app"
            applicationId "in.gpstore.admin"
            resValue "string", "app_name", "GP-STORE Admin"
        }
        worker {
            dimension "app"
            applicationId "com.gpstore.worker"
            resValue "string", "app_name", "GP-STORE Worker"
        }
    }

    defaultConfig {
        applicationId "in.gpstore.customer"
        // geolocator, flutter_secure_storage, url_launcher, and
        // firebase_messaging all work at Flutter's own recommended minSdk -
        // no need to raise it further for anything this app uses. If a
        // future Gradle build complains about a minSdk mismatch (Firebase
        // libraries occasionally raise their own floor), bump this to
        // whatever version the error message specifies.
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    sourceSets {
        main {
            // Complete worker manifest lives outside src/worker/ so the
            // flavor overlay does not merge a second full <application>.
            if (workerApk) {
                manifest.srcFile "src/workerStandalone/AndroidManifest.xml"
            }
        }
    }

    signingConfigs {
        debug {
            // Naive APK unzip audits look for META-INF/*.RSA (v1 JAR signing).
            // AGP 8 defaults to v2-only, which is valid for Play but those
            // audits report "unsigned". Keep v1+v2+v3 on every signing config.
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
        release {
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            if (hasRealSigningConfig) {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            if (hasRealSigningConfig) {
                signingConfig signingConfigs.release
            } else if (allowDebugReleaseSigning) {
                logger.warn("Release is Android Debug signed (ALLOW_DEBUG_RELEASE_SIGNING=1). Do not upload this APK to Play.")
                signingConfig signingConfigs.debug
            }

            // R8: shrink and obfuscate the Java/Kotlin side of the app.
            //
            // Worth being honest about the size win: most of a Flutter app's
            // bulk is libapp.so, which is AOT-compiled Dart that R8 never
            // touches. What this shrinks is the plugin layer - Firebase,
            // secure storage, the Bluetooth printer, image picker - which is
            // real but measured in a few MB, not tens.
            //
            // The obfuscation is the more valuable half: without it, plugin
            // class and method names sit in the APK in plain text for anyone
            // who unzips it.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    androidResources {
        // packaging.resources.excludes does not strip Flutter package assets.
        // BLEServer.exe is Windows-only (win_ble via the thermal printer plugin).
        ignoreAssetsPattern "!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~:BLEServer.exe"
    }

    // Uncompressed native libs, page-aligned by AGP (zipalign is part of
    // assembleRelease — do not unzip/repack/sign by hand afterwards).
    packaging {
        jniLibs {
            useLegacyPackaging false
        }
        resources {
            excludes += ["**/BLEServer.exe", "**/win_ble/assets/**"]
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def assemblingRelease = graph.allTasks.any { t ->
        def n = t.name.toLowerCase()
        n.contains("release") && (n.contains("assemble") || n.contains("bundle") || n.contains("package"))
    }
    if (assemblingRelease && !hasRealSigningConfig && !allowDebugReleaseSigning) {
        throw new GradleException(
            "Release signing is not configured. Create android/key.properties from "
            + "key.properties.example, or set ALLOW_DEBUG_RELEASE_SIGNING=1 for a "
            + "sideload-only debug-signed APK. Play uploads must never use debug signing.")
    }
}

tasks.register("printApplicationId") {
    doLast {
        android.productFlavors.each { flavor ->
            println("${flavor.name}=${flavor.applicationId}")
        }
    }
}

dependencies {
    // Required by compileOptions.coreLibraryDesugaringEnabled above -
    // provides the actual backported java.time/java.util implementations,
    // the enable flag alone isn't enough on its own.
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"

    // mobile_scanner 5.2.3 pulls CameraX 1.3.3, whose
    // libimage_processing_util_jni.so is 4 KiB ELF-aligned. Android 15+
    // 16 KiB page devices reject that. CameraX 1.4.2+ ships 16 KiB LOAD
    // alignment. Force it for every configuration so the customer APK
    // (which still links mobile_scanner) and the worker APK both pass.
    def camerax = "1.4.2"
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
}

configurations.all {
    resolutionStrategy {
        def camerax = "1.4.2"
        force "androidx.camera:camera-core:$camerax"
        force "androidx.camera:camera-camera2:$camerax"
        force "androidx.camera:camera-lifecycle:$camerax"
        force "androidx.camera:camera-view:$camerax"
    }
}

flutter {
    source "../.."
}
