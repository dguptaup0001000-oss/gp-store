org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Customer APK never opens the camera scanner. Bundled ML Kit still packed
# libbarhopper_v3.so (~4 MB) plus tflite models because mobile_scanner is in
# pubspec.yaml. Unbundled uses Play Services for the model; worker builds
# already set this via tool/with_worker_pubspec.sh.
dev.steenbakker.mobile_scanner.useUnbundled=true
