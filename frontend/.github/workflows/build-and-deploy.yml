# NOTE: this file assumes the repo root IS the frontend/ folder (matching
# the structure of the zips this project has been shipped in). If your
# actual GitHub repo has frontend/ as a subfolder instead, move this
# .github/ folder to the true repo root and add `working-directory: frontend`
# to every run/step below that doesn't already have one.
#
# What this gives you, with ZERO extra accounts beyond GitHub itself:
# - An APK you can download directly from the Actions run's "Artifacts"
#   section after every push - install it on an Android phone to test.
# - A live, clickable web URL at https://<your-username>.github.io/<repo>/,
#   rebuilt automatically on every push to main.
#
# One-time setup after you push this to GitHub:
# 1. Go to your repo's Settings -> Pages -> Source -> select "GitHub Actions".
#    (Without this one click, the deploy step below has nothing to deploy to.)
# 2. Push to main - the first run creates the live site; every push after
#    that updates it automatically.

name: Build APK and Deploy Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you manually re-trigger a build from the Actions tab without
  # needing a new commit - handy the first time, or after just flipping on
  # the Pages setting above.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 'stable' rather than a pinned version number - this always
          # builds with whatever the current stable Flutter release is,
          # the same "delegate to what's actually current" reasoning used
          # for the Android SDK versions in android/app/build.gradle.
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate freezed/json_serializable code
        # Required - this project's models rely on generated .freezed.dart
        # and .g.dart part files (see every domain model importing them).
        # The build fails without this step running first.
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        # Same reasoning as the web build's API_BASE_URL handling below -
        # the app's coded default (10.0.2.2, the Android EMULATOR's
        # localhost alias) is just as unreachable from a real physical
        # phone as it is from a public website. Set the same repo variable
        # (Settings -> Secrets and variables -> Actions -> Variables,
        # name: API_BASE_URL) to your deployed backend's URL once it
        # exists, or this APK will install and open fine but fail on
        # every login/browse attempt.
        run: |
          if [ -n "${{ vars.API_BASE_URL }}" ]; then
            flutter build apk --release --dart-define=API_BASE_URL="${{ vars.API_BASE_URL }}"
          else
            flutter build apk --release
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gpstore-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-and-deploy-web:
    runs-on: ubuntu-latest
    # Only deploy the LIVE site from main - a PR branch's preview build
    # still gets built and tested above, it just doesn't overwrite the
    # real public site.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate freezed/json_serializable code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web
        # --base-href must match the GitHub Pages subpath
        # (https://<user>.github.io/<repo>/) or every asset/route request
        # 404s - GitHub Pages serves this repo under its own name, not at
        # the domain root, unless this repo IS named <user>.github.io.
        #
        # API_BASE_URL points the built app at your real, deployed backend.
        # If you haven't set the repo variable yet (see below), this step
        # deliberately falls back to the app's own coded default rather
        # than passing an empty string, which would be worse - an empty
        # --dart-define value still counts as "provided" and would override
        # that sensible fallback with nothing at all. The app's own
        # default (the Android emulator's localhost alias) is unreachable
        # from a public website either way - the site will load and show
        # its UI, but every API call (login, browsing, everything) will
        # fail until you set this. One-time setup: this repo's Settings ->
        # Secrets and variables -> Actions -> Variables tab, name:
        # API_BASE_URL, value: your deployed backend's HTTPS URL + /v1.
        run: |
          if [ -n "${{ vars.API_BASE_URL }}" ]; then
            flutter build web --release \
              --base-href "/${{ github.event.repository.name }}/" \
              --dart-define=API_BASE_URL="${{ vars.API_BASE_URL }}"
          else
            flutter build web --release \
              --base-href "/${{ github.event.repository.name }}/"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
