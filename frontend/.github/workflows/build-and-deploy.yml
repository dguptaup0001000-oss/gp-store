# This file is a leftover from when frontend/ was shipped as its own zip
# with the GitHub repo root inside frontend/. GitHub Actions only runs
# workflows from the MONOREPO root `.github/workflows/`.
#
# Do not build a release APK from here. A previous copy of this workflow
# ran `flutter build apk --release` without APP_ENV=production and could
# ship an APK pointed at staging/dev URLs.
#
# Authoritative production APK + worker APK workflow:
#   ../../.github/workflows/build-and-deploy.yml
#
# This stub exists so a copy-paste of frontend/ as its own repo cannot
# accidentally produce a production-looking APK with the wrong API host.

name: Stale frontend workflow (disabled)

on:
  workflow_dispatch:

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Point at the canonical workflow
        run: |
          echo "Do not build APKs from frontend/.github/workflows."
          echo "Use the repository-root .github/workflows/build-and-deploy.yml"
          echo "which always passes --dart-define=APP_ENV=production and a production API_BASE_URL."
          exit 1
