name: gpstore
description: GP-Store delivery worker app (slim Android plugin set)
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

# Used only by tool/with_worker_pubspec.sh when compiling lib/worker_main.dart.
# Flutter registers every plugin in pubspec.yaml into the Android Gradle
# module regardless of which Dart entrypoint is compiled. The customer
# pubspec therefore ships Firebase, Cashfree, WebView/model-viewer, TTS,
# BLE printing and speech into the worker APK. This file lists only the
# packages worker Dart actually imports.
dependencies:
  flutter:
    sdk: flutter

  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^5.2.3
  geolocator: ^13.0.1

  # Navigate. The rider taps one button and their maps app opens on the
  # order's confirmed coordinates - which is the entire point of capturing a
  # pin, and cannot be done from inside a slim APK without a way to hand a URL
  # to another application.
  #
  # A DELIBERATE ADDITION TO A LIST THAT EXISTS TO STAY SHORT. Same version as
  # the customer pubspec so one lockfile resolves both. It ships a small
  # platform channel, not a map SDK - no tiles, no key, no rendering.
  url_launcher: ^6.3.1

  # POST_NOTIFICATIONS, and only for that.
  #
  # The location foreground service must post an ongoing notification, and on
  # API 33+ that notification is HIDDEN unless the permission is granted - so a
  # rider would be tracked with nothing on screen saying so. The customer app
  # gets this prompt from FirebaseMessaging; this APK has no Firebase, so
  # without this package there is no way to ask at all.
  #
  # A SECOND DELIBERATE ADDITION TO A LIST THAT EXISTS TO STAY SHORT. Same pin
  # as the customer pubspec so one lockfile resolves both, and pinned rather
  # than floated for the reason recorded there: permission_handler_android
  # 14.0.0 fails to resolve its own Kotlin block against this project's Gradle
  # template. It ships a platform channel, not a framework.
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
