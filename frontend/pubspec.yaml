name: gpstore
description: GP-Store customer app
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management - Flutter-team-recommended, compile-safe providers,
  # pairs cleanly with async API calls (which is most of this app).
  flutter_riverpod: ^2.5.1

  # HTTP client with interceptor support - needed to auto-attach the JWT and
  # auto-refresh it on expiry (see core/api/api_client.dart).
  dio: ^5.4.3

  # Navigation - declarative, works well with Riverpod for auth-gated routes
  # (e.g. redirect to login if not authenticated).
  go_router: ^14.2.0

  # Stores the refresh token securely on-device (Keychain on iOS, Keystore on
  # Android) - NEVER store a refresh token in plain SharedPreferences.
  flutter_secure_storage: ^9.2.2

  # Immutable model classes with generated equality/copyWith - reduces a
  # whole category of "forgot to update a field" bugs when order/product
  # models change.
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  cupertino_icons: ^1.0.6

  # Real device GPS for "use my location" when adding an address, and for
  # delivery partners sharing their live position while on duty - the
  # backend's deliverability/distance calculation and live tracking both
  # need real coordinates.
  geolocator: ^13.0.1

  # Push notifications (order status updates, new delivery assignments) -
  # requires a real Firebase project; see FIREBASE_SETUP.md for the
  # one-time setup this can't do for you (creating the project, downloading
  # google-services.json). The app runs fine without it configured - push
  # just silently doesn't fire until it is.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Crash reporting. Deliberately the same Firebase project push already
  # uses rather than a second vendor: no new account, no new secret in the
  # app, and google-services.json is already wired up. See
  # core/monitoring/crash_reporter.dart for what is and is not sent.
  firebase_crashlytics: ^4.1.3
  # GLB/GLTF viewer for the product 3D view. Renders Google's <model-viewer>
  # inside a WebView, which is why it is reached only from its own route and
  # never from a list - see product_3d_view_screen.dart.
  model_viewer_plus: ^1.7.2
  # Cashfree checkout. Native SDK - see android/app/proguard-rules.pro for
  # the keep rules its reflective entry points need in a release build.
  flutter_cashfree_pg_sdk: ^2.2.0

  # Shows the notification banner + plays sound while the app is in the
  # foreground (Firebase alone stays silent in foreground on Android).
  flutter_local_notifications: ^18.0.1

  # Speaks new orders aloud on the shop counter phone, soundbox-style.
  # A plugin is unavoidable here - Flutter has no built-in text-to-speech,
  # and this wraps the TTS engine already present on every Android device
  # rather than shipping voice data of its own.
  flutter_tts: ^4.2.0

  # Opens the real UPI deep link (upi://pay?...) in whatever UPI app the
  # customer has installed (GPay, PhonePe, Paytm) - needed to actually act on
  # the link the backend generates, not just display it as text.
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2

  # Lets an admin pick a real photo from their gallery for a product
  # variant's image, instead of having to paste an already-hosted image URL
  # by hand. Paired with a direct upload to Cloudinary (see
  # admin_products_repository.dart's uploadVariantImage) - this app never
  # sends the image bytes through the backend.
  image_picker: ^1.1.2

  # Caches product/category images to disk instead of Image.network's
  # in-memory-only cache, which re-downloads on every screen revisit (cold
  # start, navigating back, pull-to-refresh). At this app's scale that's a
  # direct hit to perceived speed and mobile data usage for the exact images
  # customers see over and over: bestsellers, cart, product detail.
  cached_network_image: ^3.4.1

  # Bluetooth (Classic/SPP) connection to a cheap ESC/POS thermal receipt
  # printer, for auto-printing new-order receipts on the admin's device.
  # Chosen specifically because it does NOT require location permission on
  # Android (only BLUETOOTH_CONNECT on API 31+) - it only ever talks to a
  # device already paired in Android's own Bluetooth settings, it doesn't
  # scan for new ones itself.
  # Pinned to 1.2.1, not the newer 1.2.2 - 1.2.2 moved to a pure-Swift iOS
  # implementation that requires Flutter >=3.44.0, newer than the 3.35.7 CI
  # (and this project) currently builds against. The Android API this app
  # actually uses is unchanged between the two versions.
  print_bluetooth_thermal: ^1.2.1

  # Builds the raw ESC/POS command bytes (text, bold, alignment, cut) that
  # print_bluetooth_thermal sends over the connection above.
  esc_pos_utils_plus: ^2.0.4

  # print_bluetooth_thermal only CHECKS Bluetooth permission
  # (isPermissionBluetoothGranted) - it doesn't trigger the OS prompt
  # itself. This is what actually asks, once (see printer_service.dart).
  # Pinned to 12.0.3, not 13.x/14.x - permission_handler_android 14.0.0's
  # own build.gradle.kts assumes a newer Flutter Gradle template (Kotlin
  # version-catalog wiring) than this project has, and fails to even
  # resolve its own `kotlin { compilerOptions { ... } }` block
  # ("Unresolved reference: compilerOptions") - a real CI failure, not a
  # guess. 12.0.3 predates that Android module restructuring.
  permission_handler: ^12.0.3

  # Voice search. Wraps Android's OWN speech recogniser - the one already on
  # the device behind the keyboard's microphone key - rather than shipping a
  # model or calling a paid cloud API. That is what makes Hindi, Hinglish and
  # Indian-accented English work without this project owning any of it, and
  # what keeps the audio on the phone: the plugin returns text, and nothing
  # here records, stores or uploads a recording.
  #
  # Pinned below 7.5.0 deliberately, exactly like print_bluetooth_thermal
  # above. 7.5.0 raises its floor to Flutter >=3.44.0, newer than the 3.35.7
  # this project and CI build against, so a caret range would let a future
  # `pub upgrade` pick a version that cannot compile here. The Android API
  # this app uses is unchanged across the 7.x line.
  speech_to_text: ">=7.4.0 <7.5.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  # Generates every required Android/iOS launcher icon size from one source
  # image - run `dart run flutter_launcher_icons` after replacing
  # assets/icon/icon.png with a real logo. See PLAY_STORE_CHECKLIST.md item 3.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Config for the flutter_launcher_icons package above. image_path must point
# to a real square PNG (1024x1024 recommended) before running the generator -
# the placeholder path below doesn't exist yet on purpose, so running the
# generator before you've added a real icon fails loudly instead of silently
# baking in nothing.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  # Matches the placeholder vector's green - update if your real logo uses a
  # different brand color, this only affects the adaptive icon background.
  adaptive_icon_background: "#1F4ED8"
  adaptive_icon_foreground: "assets/icon/icon.png"
