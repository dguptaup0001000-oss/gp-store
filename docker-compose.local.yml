# Local laptop development. Not a Docker Compose default filename:
# `docker compose up` at the repo root must fail instead of starting this
# stack. Production is backend/docker-compose.yml — see
# backend/HOSTINGER_DEPLOYMENT.md.
#
# Do NOT use this file on the Hostinger VPS. Ports bind loopback only so a
# mistaken `up` cannot publish 5432/6379/8081 on 0.0.0.0 (UFW does not
# filter Docker publishes).
name: gpstore-local

services:
  postgres:
    # PostgreSQL 17 matches CI and Hostinger production.
    # An existing local volume created by postgres:16 cannot start 17.
    # Recreate it once (local/dev ONLY, never on the VPS):
    #   docker compose -f docker-compose.local.yml down
    #   docker volume rm gpstore-local_gpstore_pg_data
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gpstore_pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backs the app's cache (spring.cache.type=redis) and the distributed
  # rate limiter (see config.RateLimitFilter) - both need a shared store the
  # moment more than one backend instance runs, which an in-memory
  # implementation can't provide.
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - gpstore_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CASHFREE_ENVIRONMENT: ${CASHFREE_ENVIRONMENT:-sandbox}
      CASHFREE_APP_ID: ${CASHFREE_APP_ID:-}
      CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY:-}
      CASHFREE_WEBHOOK_SECRET: ${CASHFREE_WEBHOOK_SECRET:-}
      CASHFREE_NOTIFY_URL: ${CASHFREE_NOTIFY_URL:-}
      CASHFREE_RETURN_URL: ${CASHFREE_RETURN_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  gpstore_pg_data:
  gpstore_redis_data:
