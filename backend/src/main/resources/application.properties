spring.application.name=backend
# Build identity. Production Compose/Dockerfile sets GIT_COMMIT to the
# immutable git SHA. "unknown" is for local IDE runs only — VersionGuard
# refuses that value when app.production=true.
app.version=${APP_VERSION:0.0.1-SNAPSHOT}
app.git-commit=${GIT_COMMIT:unknown}

# API versioning: every endpoint is now under /v1/... (e.g. /v1/api/products).
# This is the cheapest possible way to version a Spring Boot API - context-path
# is stripped before routing/security matching, so every existing controller
# and every SecurityConfig rule needs ZERO changes. Doing this now, before
# Flutter integration starts, means nothing has to migrate later - once a
# real client depends on these paths, changing them becomes expensive.
server.servlet.context-path=/v1

# Same pattern as JWT secret below: real deployments MUST set these env vars.
# The hardcoded fallbacks here are for local dev only - they were never meant
# to be production values.
#
# Hostinger production Compose sets
# DB_URL=jdbc:postgresql://postgres:5432/${DB_NAME} (Docker network hostname,
# not localhost). Do not publish Postgres 5432 on the VPS.
#
# If you point DB_URL at a hosted Postgres that requires TLS (including a
# leftover Supabase instance during a data dump), append ?sslmode=require.
# The localhost fallback below does not use SSL.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gpstore}
spring.datasource.username=${DB_USERNAME:u0_a470}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Force UTC for every DB session, regardless of what timezone the host JVM
# (laptop, Termux/Android, Docker, whatever) happens to be running in. Without
# this, the Postgres JDBC driver sends the JVM's default timezone on connect,
# which silently becomes the session timezone Postgres uses for timestamp
# conversions - causing bugs that only show up depending on which machine
# deployed the app.
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
# Supabase's connection pooler closes idle connections on its own schedule,
# independent of anything this app controls. HikariCP's default max-lifetime
# (30 min) is far longer than that, so during any quiet period - between
# manual test runs, low-traffic hours, etc. - the pool ends up holding
# connections Supabase already closed server-side. The pool doesn't know,
# hands one out anyway, and the request fails with "This connection has
# been closed" (visible in the app logs as repeated HikariCP housekeeper
# warnings even with zero traffic). Keeping max-lifetime short and pairing
# it with a keepalive probe means the pool retires connections on ITS OWN
# terms, before Supabase ever gets the chance to sever them first.
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:270000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_MS:120000}

# Explicit pool sizing - previously left on HikariCP's default (max 10
# connections), which is a hard concurrency ceiling no app-level fix can work
# around. These defaults are conservative starting points for Supabase's
# Session Pooler on a free/small plan - tune maximum-pool-size up once you
# know your actual pooler connection budget (Supabase plan limit, divided
# across however many app instances share it). leak-detection-threshold logs
# a warning (not an error) if a connection is checked out longer than this
# without being returned - a real signal of a connection leak in code, not
# something that should fire in normal operation.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
# A FIXED-SIZE POOL: minimum-idle equals maximum-pool-size, and this is a
# CEILING-PRESERVING fix - the maximum is unchanged at 10.
#
# THE EVIDENCE, from the production log during the burst that produced the
# 502s. Three lines, eight seconds apart:
#
#     total=5, active=5, idle=0, waiting=27
#     total=7, active=7, idle=0, waiting=32
#     total=9, active=9, idle=0, waiting=27
#
# The pool was GROWING while thirty requests queued. minimum-idle was 2, so
# after any quiet period the pool shrinks to two connections, and a burst then
# has to build the other eight - each one a TCP connect, a TLS handshake and
# the connection-init-sql round trip, to a database in another data centre.
# For those eight seconds the application was serving a burst on half the
# connections it is allowed, and every one of those creations was competing
# with the very requests waiting on them.
#
# Holding all ten open costs ten idle Postgres backends and nothing else. The
# keepalive and max-lifetime settings above already retire them on this app's
# own terms, which is what makes a fixed pool safe against Supabase closing
# idle connections underneath it.
#
# This is HikariCP's own documented recommendation, and it is not a way of
# raising the limit: at saturation the pool still stops at ten. It only stops
# the app spending the first seconds of every burst below its own ceiling.
#
# THE COST, AND THE ONE THING THAT MUST BE CHECKED BEFORE SCALING OUT. A fixed
# pool means every instance holds its full pool open permanently, so total
# connections are maximum-pool-size x INSTANCES - not "x instances under
# load", but always. One VPS instance is ten connections and Supabase is
# comfortable. Four instances is forty, and that has to fit the plan's
# connection budget with room for migrations, psql sessions and anything else
# that connects.
#
# This is not hypothetical: making the pool fixed immediately broke the test
# suite with "FATAL: sorry, too many clients already", because Spring caches
# an application context per test configuration and never closes them, so a
# dozen live contexts each held ten connections against a local Postgres
# allowing a hundred. Tests now cap their own pool (see the surefire
# systemPropertyVariables in pom.xml). Production has one instance; if that
# ever changes, lower DB_POOL_MAX_SIZE to fit the budget rather than
# discovering the limit the same way.
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
# HOW LONG A REQUEST WAITS FOR A CONNECTION BEFORE GIVING UP.
#
# Was 30 seconds, and that number is why the load test saw p95 of 21.6s and
# single requests taking a minute. The arithmetic: 40 Tomcat worker threads
# share 10 database connections, so under load 30 of those threads are parked
# waiting - each one holding a request the server has accepted and cannot
# serve, for up to half a minute. The queue never drains, every arriving
# request makes it worse, and the client eventually times out on a request the
# server is still nominally working on.
#
# Five seconds turns that into load SHEDDING instead of load HOARDING. A
# request that cannot get a connection in five seconds was not going to
# finish acceptably anyway; failing it frees the worker thread immediately for
# the next request, which is what stops a queue from compounding. The caller
# gets a 503 with Retry-After - see GlobalExceptionHandler.handlePoolExhausted -
# which is honest, fast, and distinguishable from a bug.
#
# This does NOT hide failures and does not make the shop reject work it could
# have done: below saturation a connection is available in microseconds and
# this timeout is never approached.
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:60000}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Batches multi-row inserts/updates into fewer round-trips instead of one
# statement per row (e.g. OrderService.placeOrder saving every order item
# individually before this). order_inserts/order_updates=true is required
# alongside batch_size for Hibernate to actually group same-table statements
# together rather than interleaving them back into individual calls.
spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_BATCH_SIZE:50}
# Safety net for N+1 on lazy associations that are NOT covered by an explicit
# fetch join. The hot paths (cart, product listing, order/notification pages,
# reviews, wishlist, recommendations) all have their own fetch joins or entity
# graphs - this catches the rest, and any future code that adds a lazy access
# inside a loop without noticing. Instead of one SELECT per entity, Hibernate
# batches up to this many into a single `... where id in (?, ?, ...)`.
#
# Deliberately not a fix FOR those hot paths: batching turns N queries into
# N/16, which is a large improvement over N but still worse than the 1 query a
# fetch join gives. It is a floor on how bad an unnoticed N+1 can get, not a
# substitute for fixing the ones that matter.
spring.jpa.properties.hibernate.default_batch_fetch_size=${HIBERNATE_BATCH_FETCH_SIZE:16}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# ddl-auto is dev-only. Once you have a stable schema, generate a real Flyway
# baseline (see backend/src/main/resources/db/migration/README.md) and switch
# this to "validate" for anything beyond local development.
# OPEN SESSION IN VIEW - OFF, and this is a capacity fix.
#
# Spring Boot leaves this ON by default. What it does is hold the Hibernate
# session, and with it a pooled database connection, from the moment a request
# enters the filter chain until the response has been fully serialised - not
# just for the part of the request that touches the database. On a pool of ten
# connections that is the difference between a connection being borrowed for
# the few milliseconds a query takes and being borrowed for the entire request,
# including JSON writing and the socket write to a phone on a village 4G link.
#
# Under the load test that is precisely the shape of the failure: threads were
# not waiting on the database doing work, they were waiting on each other to
# give a connection back. Turning it off means a connection is held only inside
# @Transactional boundaries, which is where the queries actually are.
#
# THE RISK, stated plainly: an endpoint that returned an entity and relied on a
# lazy association being loaded during serialisation throws
# LazyInitializationException instead of silently issuing another query. That
# is a real behaviour change, which is why it ships with the whole integration
# suite run against it rather than on reasoning alone. The endpoints here
# already return DTOs and use JOIN FETCH - see ProductResponse and
# PaymentInitiationResponse, both written specifically to stop this - so there
# was nothing left relying on it.
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# Verbose SQL logging - useful for local dev, noisy and log-cost-inflating in
# production (every query, formatted across several lines, on every request -
# real overhead at real traffic, not just log clutter). Off by default now
# that migrations/queries are stable; set SHOW_SQL=true locally when you need
# to see them again.
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true

server.port=${PORT:8081}

# Tomcat's default worker pool (200 threads) is sized for a normal
# multi-core server - on a small VPS (this shop's Hostinger KVM 2 is
# 2 vCPU; earlier 0.5 CPU plans made the same point even sharper), 200
# threads fighting over too little CPU spend more
# time context-switching between each other than doing actual work, which
# makes tail latency WORSE under load, not better, even though it looks
# like more concurrency should help. Confirmed via load testing: the
# database itself answered in ~5ms (checked directly via EXPLAIN ANALYZE)
# while the app's end-to-end response time was 5-6+ seconds - the gap was
# thread contention, not query cost. Sizing the pool to what the available
# CPU can actually drive trades a lower hard concurrency ceiling for lower
# latency per request, which is the right trade on a CPU this constrained.
# Raise these once the instance has more CPU to back them (a bigger VPS)
# - a bigger pool only helps once there's more core
# available to actually run those threads on.
# GRACEFUL SHUTDOWN. systemd (and Docker) send SIGTERM to the old process.
# Without this, Tomcat stops the instant it arrives and every in-flight
# request dies mid-response - including a customer three seconds into
# checkout, whose order may be part-committed with its side-effects
# (notification, voice announcement, invoice) never dispatched. The customer
# sees a network error and cannot tell whether they have an order.
#
# With it, the connector stops accepting NEW requests and existing ones are
# given time to finish before the context closes.
#
# 25s by default, overridable with SHUTDOWN_TIMEOUT. systemd
# TimeoutStopSec on the VPS is 40s. A timeout longer than the supervisor's
# SIGKILL window is worse than none - the JVM would still be politely
# waiting when it is killed outright.
# Puts the request id (see RequestIdFilter) on every log line. The %X{} lookup
# renders as an empty string when there is no id - a scheduled job or a
# startup log - rather than failing, so nothing needs a special case.
#
# Console-only on purpose: systemd captures stdout (journalctl), and a
# second appender writing to a file inside an ephemeral container produces
# logs that vanish with the container.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{requestId:-}] %-40.40logger{39} : %m%n

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:25s}

server.tomcat.threads.max=${TOMCAT_MAX_THREADS:40}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:10}
# How many additional incoming connections queue (rather than getting
# immediately rejected) once every worker thread above is busy - a burst
# past this waits briefly for a free thread instead of failing outright,
# without letting unlimited requests queue indefinitely on a CPU this small.
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:50}

# HOW MANY SOCKETS TOMCAT WILL HOLD OPEN AT ONCE, connected or merely
# keep-alive idle. Tomcat's default is 8192, which on a 512 MB container is
# not a limit at all - it is a promise to accept eight thousand connections
# the application has forty threads and ten database connections to serve.
# Every accepted-but-unserved connection still costs a socket, poller state
# and read/write buffers, and the load test's own numbers show what that
# buys: connections were accepted, then waited, and the p95 was 21.6 s.
#
# 500 is deliberately far above threads+queue (90) and far below 8192. The
# gap is for keep-alive: the app's own clients reuse connections between
# requests, and cutting that to 90 would make every idle phone hold a slot
# another phone needs. Past 500 the server refuses the connection outright,
# which a client sees immediately and can retry - a visible, fast failure
# instead of a socket that is quietly accepted and then starved. That is the
# honest behaviour for a machine this size; it is not the failure being
# hidden, it is the failure being reported at the door instead of at the
# thirtieth second.
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:500}

# Idle keep-alive sockets do not get to sit there forever, and no single
# connection gets to monopolise a worker thread indefinitely. Both are
# Tomcat defaults that assume a machine with room to be generous.
server.tomcat.keep-alive-timeout=${TOMCAT_KEEP_ALIVE_TIMEOUT_MS:15000}
server.tomcat.max-keep-alive-requests=${TOMCAT_MAX_KEEP_ALIVE_REQUESTS:100}

# Slowloris and the merely-bad-network case: a request whose headers or body
# never finish arriving must not hold a worker thread for the default twenty
# seconds when there are only forty of them.
server.tomcat.connection-timeout=${TOMCAT_CONNECTION_TIMEOUT_MS:8000}

# Catalog JSON was leaving the instance uncompressed. A 5k-VU browse run
# received ~200 KB per request and ~200 GB in total; that saturates a small
# NIC and CPU before the database does. Gzip is the cheap cut.
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024
spring.devtools.restart.enabled=false

# THE SHOP. Every distance in the application is measured from this point:
# the delivery estimate, the per-km delivery fee, the serviceable-radius check
# that decides whether checkout is even allowed, and the first leg of every
# planned route. Getting it wrong is not a rounding error - it silently
# mis-prices and mis-promises every single order.
#
# Malhia, Kushinagar district, Uttar Pradesh - on NH727, near the Gandak.
# Confirmed two independent ways before being written here: the Plus Code
# 7MV55W6R+V55 (short form 5W6R+V55) decodes to 27.162141, 83.940462, and a
# reverse geocode of the same pin reports 27.162310, 83.940468. Those are
# 19 m apart, which is inside one building - the same place.
#
# These used to be 28.6139, 77.2090, which is Connaught Place in Delhi, about
# 700 km west. That was placeholder data shipped as a default, and until now
# every fee and ETA the shop quoted was computed from it.
store.latitude=${STORE_LATITUDE:27.162310}
store.longitude=${STORE_LONGITUDE:83.940468}

# How far the shop will actually deliver. Checkout refuses an address beyond
# this instead of silently promising delivery that cannot be made.
#
# 20 km, for a rural catchment: the villages around Malhia are spread along
# NH727 and the Gandak rather than packed into a town, so a radius sized for a
# city kirana would exclude most of the customers this shop actually serves.
#
# AND IT FITS THE ETA PROMISE EXACTLY, which is worth stating because it is
# easy to lose. estimateMinutes is 10 + 5 min/km, hard-capped at 120, so the
# cap starts binding at 22 km. At 20 km the furthest delivery is estimated at
# 110 minutes - under the cap - which means EVERY address inside this radius
# gets an honest, distance-based promise rather than a flat two hours the
# shop cannot keep. Raising this above 22 km breaks that property silently:
# nothing fails, the far addresses simply start being told two hours when the
# formula itself says more. If the radius grows, raise MAX_MINUTES in
# DeliveryEstimateService with it.
store.max-delivery-radius-km=${STORE_MAX_DELIVERY_RADIUS_KM:20}

# Delivery pricing rule: ₹15 covers the first 2 km, then ₹3/km beyond that.
#
# At the 20 km radius above that is ₹15 + 18×₹3 = ₹69 for the furthest
# delivery, and free delivery (profit >= 3× fee, below) would need ₹207 of
# gross profit on that order. A consequence of the radius rather than a
# separate decision, so it is written down where the radius can be seen.
delivery.base-charge=${DELIVERY_BASE_CHARGE:15}
delivery.base-distance-km=${DELIVERY_BASE_DISTANCE_KM:2}
delivery.per-km-charge=${DELIVERY_PER_KM_CHARGE:3}

# Free-delivery rule: only waive the delivery fee if this order's gross profit
# is at least K times the delivery fee (K = this factor). K=3 means at most
# ~1/3 of profit goes toward covering delivery, the rest stays with the
# business for rent/salaries/damage/taxes. Tune K without touching the code.
delivery.free-delivery-profit-factor=${DELIVERY_FREE_PROFIT_FACTOR:3}

# PERMANENT DELIVERY TERRITORIES: 8 main zones -> 26 subzones -> riders.
#
# The geography lives in the database (delivery_zones, delivery_subzones) and
# is edited only through /api/admin/territory. Nothing here can move a
# boundary; these settings tune how work is HANDED OUT across a map that does
# not change.
#
# Off means every assignment goes to whoever is least loaded, which is exactly
# what the app did before territories existed. Useful as a kill switch if
# dispatch ever misbehaves in production - the map stays, it is just ignored.
territory.enabled=${TERRITORY_ENABLED:true}

# The hard geographic gate on a backup rider, in km from their live position
# to the drop. A rider outside this is not a candidate NO MATTER HOW FEW
# ORDERS THEY HAVE - an idle rider across the river still cannot get there.
# Skipped for a rider whose position is unknown, since the ladder rung they
# came from already established they belong nearby.
#
# STILL PROVISIONAL. 4 km was chosen against an 8 km service area, where it
# meant "the next neighbourhood over"; across 20 km it is tighter than that
# and will sometimes reject a backup who is genuinely the right rider, so
# overflow and absence fall through to FALLBACK more often than they should.
# The honest value is roughly the width of one subzone, which nobody knows
# until the 26 territories are actually drawn - guessing a number before then
# is exactly how it came to be 4.
territory.max-backup-detour-km=${TERRITORY_MAX_BACKUP_DETOUR_KM:4.0}

# What one existing order is worth, expressed in kilometres of extra riding.
# At 0.8, a rider two orders busier must be more than 1.6 km closer to win.
# Stated in km rather than as an abstract weight so the trade-off is arguable
# rather than magic. Only ever ranks riders who ALREADY passed the gate above.
territory.load-weight-km-per-order=${TERRITORY_LOAD_WEIGHT_KM:0.8}

# How close to its promised time a drop must be before route planning pulls it
# forward out of geographic order. Nearest-neighbour alone produces a tidy loop
# that quietly delivers the last house 40 minutes late.
territory.route-urgency-window-minutes=${TERRITORY_ROUTE_URGENCY_WINDOW_MIN:20}

# Routing rule: orders with this many total items or more go to a "PICKUP"
# vehicle-type partner (more capacity per trip) instead of "BIKE". Tune this to
# your actual bike carrying capacity - this is a starting assumption, not a
# measured number.
delivery.bulk-order-item-threshold=${DELIVERY_BULK_ITEM_THRESHOLD:15}

# Marks this instance as a real production deployment. Set APP_PRODUCTION=true
# in production (see HOSTINGER_DEPLOYMENT.md). Defaults to false so local dev and CI are
# unaffected - a plain boolean env var rather than profile detection, because
# what matters here is answerable directly and cannot be broken by a
# mistyped profile name.
#
# Currently this gates one thing, and it is deliberately a hard startup
# failure: JwtService refuses to boot in production if JWT_SECRET is missing,
# too short for HS256, or still the published development value below. A
# production app signing tokens with a secret committed to this repository
# means anyone who can read the source can forge a token for any customer id
# and any role, including ADMIN, with nothing in the logs looking wrong.
app.production=${APP_PRODUCTION:false}

# JWT - override JWT_SECRET env var in every real environment. This default is for local dev only.
jwt.secret=${JWT_SECRET:dev-only-change-me-GPSTORESECRETKEY123456789012345678901234567890}
# Access token is now short-lived on purpose - refresh tokens (below) are what
# keep the customer logged in without re-entering credentials every 15 minutes.
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

refresh.token.expiration-ms=${REFRESH_TOKEN_EXPIRATION_MS:2592000000}

# Monitoring: /actuator/health is public (needed for load balancers/uptime
# checks to work without auth); everything else (metrics, env, etc.) is
# admin-only (see SecurityConfig) since it can leak internal details.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
# /actuator/health/liveness and /actuator/health/readiness. Nginx / uptime
# monitors can keep using /v1/api/health (cheap) or /v1/actuator/health;
# readiness additionally reflects datasource down.
management.endpoint.health.probes.enabled=true

# Percentile histograms for HTTP request timing, which Spring Boot already
# records as http.server.requests without any code. A mean is close to
# useless for a complaint like "sometimes checkout takes 8 seconds" - the
# mean stays fine while the tail is terrible, which is exactly the shape of
# a slow external call or lock contention. p95/p99 make that visible.
#
# Scoped to http.server.requests and the app's own @Timed metrics rather
# than enabled globally: histograms carry a real cardinality cost per metric,
# and turning them on for every JVM/Hikari/cache meter would inflate the
# scrape for no benefit.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

# Service-level timers (see MetricsConfig and the @Timed annotations on the
# checkout/cart/payment/order operations). These attribute a slow endpoint to
# the specific operation inside it instead of leaving it to guesswork.
management.metrics.distribution.percentiles-histogram.checkout.place_order=true
management.metrics.distribution.percentiles-histogram.checkout.preview=true

# Caching: Redis-backed, shared across every backend instance - a cache
# write on one instance is now actually visible to the others, unlike the
# previous in-memory (ConcurrentMapCacheManager) cache, which silently broke
# correctness the moment more than one instance ran (instance A evicting a
# stale product listing never reached instance B's copy of the cache).
# REDIS_HOST/PORT/PASSWORD must point at a real Redis instance in every real
# deployment (see DEPLOYMENT.md) - the localhost default below is for local
# dev only, matching docker-compose.yml's redis service.
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# Fail fast (2s) rather than hanging the request indefinitely if Redis is
# unreachable - a cache/rate-limit outage should degrade quickly, not stall
# every request behind a slow-timing-out connection attempt.
spring.data.redis.timeout=${REDIS_TIMEOUT_MS:2000}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT_MS:2000}
# Every @Cacheable entry expires on its own instead of only ever being
# evicted by an explicit @CacheEvict - bounds how stale a cached read can
# get even if some future code path forgets to evict on write.
spring.cache.redis.time-to-live=${CACHE_TTL_MS:600000}
# Process-local L1 in front of Redis. Seconds, not minutes: admin catalog
# edits still go through @CacheEvict on both layers.
cache.l1-ttl-seconds=${CACHE_L1_TTL_SECONDS:15}
cache.l1-max-entries=${CACHE_L1_MAX_ENTRIES:2000}
# Catalog GET 503 only when waiters exceed this AND every Hikari connection
# is already in use. Waiting alone is a brief GC/slow query, not saturation.
pool.saturation.waiting-threshold=${POOL_SATURATION_WAITING_THRESHOLD:4}

# Comma-separated list of origins allowed to call this API from a browser
# (Flutter web build, an admin dashboard, etc.). Native mobile apps aren't
# affected by CORS and don't need this. Update once you have real domains -
# the localhost default is for local frontend dev only.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Only set true once you've confirmed you're actually behind a real proxy/load
# balancer that overwrites X-Forwarded-For - otherwise a client can spoof it
# and bypass the login/register rate limit entirely.
rate-limit.trust-forwarded-for=${RATE_LIMIT_TRUST_FORWARDED_FOR:false}
rate-limit.auth-per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:20}
rate-limit.checkout-per-minute=${RATE_LIMIT_CHECKOUT_PER_MINUTE:20}
rate-limit.mutation-per-minute=${RATE_LIMIT_MUTATION_PER_MINUTE:60}
rate-limit.admin-per-minute=${RATE_LIMIT_ADMIN_PER_MINUTE:30}
# Public search (including instant). 60/min is one request a second averaged
# over a minute - enough for a shopper typing with debounce, not enough for
# a scrape. Override RATE_LIMIT_SEARCH_PER_MINUTE if a CGNAT IP is shared
# by many simultaneous shoppers. Redis-backed; fails open if Redis is down.
rate-limit.search-per-minute=${RATE_LIMIT_SEARCH_PER_MINUTE:60}

# Your shop's UPI ID (VPA) - customers pay directly to this via any UPI app
# (GPay, PhonePe, Paytm, etc). Direct UPI has NO transaction fee, unlike a
# payment gateway (Razorpay/Cashfree) which takes a cut of every order - the
# tradeoff is you (or staff) manually confirm each payment arrived, since
# there's no gateway webhook to auto-verify it. Replace with your real VPA.
store.upi-id=${STORE_UPI_ID:yourstorename@upi}
store.upi-payee-name=${STORE_UPI_PAYEE_NAME:GP Store}

# Real contact details shown on the app's "Contact Us" screen - replace
# these placeholders with your actual numbers before going live. Configured
# here (not hardcoded in the Flutter app) so changing your support number
# never requires an app rebuild/re-release.
store.support-phone=${STORE_SUPPORT_PHONE:+91XXXXXXXXXX}
store.support-whatsapp=${STORE_SUPPORT_WHATSAPP:+91XXXXXXXXXX}
store.support-email=${STORE_SUPPORT_EMAIL:support@example.com}

# A UPI payment sitting PENDING (never confirmed) past this many minutes is
# auto-expired to FAILED - stops a customer's cart/stock from being tied up
# indefinitely by an abandoned or never-actually-paid order.
payment.upi-timeout-minutes=${PAYMENT_UPI_TIMEOUT_MINUTES:30}

# OTP login via MSG91 (India's standard OTP/SMS provider - see cost discussion:
# ~Rs 0.15/OTP). Requires YOUR real MSG91 auth key and a DLT-registered
# template ID once you've completed that registration - neither can be
# fabricated here.
otp.msg91-auth-key=${MSG91_AUTH_KEY:}
otp.msg91-template-id=${MSG91_TEMPLATE_ID:}
otp.msg91-sender-id=${MSG91_SENDER_ID:GPSTOR}

# When false (the default), local/CI uses a mock OTP provider. Production
# never uses the mock: missing MSG91 credentials select UnconfiguredOtpProvider
# so the app can boot, and OTP send fails closed until a real provider is set.
otp.sms-sending-enabled=${OTP_SMS_SENDING_ENABLED:false}
msg91.enabled=${MSG91_ENABLED:${OTP_SMS_SENDING_ENABLED:false}}
msg91.base-url=${MSG91_BASE_URL:https://control.msg91.com}
msg91.auth-key=${MSG91_AUTH_KEY:}
msg91.otp-template-id=${MSG91_OTP_TEMPLATE_ID:${MSG91_TEMPLATE_ID:}}
msg91.sender-id=${MSG91_SENDER_ID:GPSTOR}

otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
otp.max-verify-attempts=${OTP_MAX_VERIFY_ATTEMPTS:5}
# Rate limit: at most this many OTP sends per phone number per window -
# stops one number being SMS-bombed (each send costs real money).
otp.max-sends-per-window=${OTP_MAX_SENDS_PER_WINDOW:3}
otp.send-window-minutes=${OTP_SEND_WINDOW_MINUTES:10}
otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:45}
otp.password-reset-token-minutes=${OTP_PASSWORD_RESET_TOKEN_MINUTES:10}

# Push notifications via Firebase Cloud Messaging (order status updates to
# customers, new-assignment alerts to delivery partners). Same pattern as
# otp.sms-sending-enabled above: OFF by default so the app runs fine with
# zero Firebase setup; only turn this on once you've created a Firebase
# project and set FIREBASE_CREDENTIALS_BASE64.
#
# To get that value: Firebase Console -> Project Settings -> Service
# Accounts -> Generate new private key (downloads a JSON file) -> base64
# encode the WHOLE file content and paste the result as this env var.
#   Termux/Linux/Mac: base64 -w0 serviceAccountKey.json
#   Windows PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("serviceAccountKey.json"))
# Never commit the raw JSON file itself to git.
firebase.credentials-base64=${FIREBASE_CREDENTIALS_BASE64:}
firebase.push-enabled=${FIREBASE_PUSH_ENABLED:false}

# Product/variant image upload (admin app) - direct-to-Cloudinary via a
# backend-signed upload, see CloudinaryUploadService's doc comment for why
# the app never sends the image through this backend at all. Same
# off-until-configured pattern as Firebase/MSG91 above: left blank, the
# /api/uploads/cloudinary-signature endpoint returns a clear "not
# configured" error instead of crashing, and the admin app's image field
# still works as a manually-pasted URL either way.
# Get these from your Cloudinary account: Dashboard -> Product Environment
# Credentials (cloud name, API key, API secret). Free tier is enough for a
# single kirana store's catalog.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.upload-folder=${CLOUDINARY_UPLOAD_FOLDER:gp-store/products}


# =====================================================================
# CASHFREE PAYMENT GATEWAY
# =====================================================================
# NO CREDENTIAL HAS A DEFAULT HERE, deliberately. An empty appId/secretKey
# disables online payment (see CashfreeProperties.enabled()) rather than
# starting up with a blank key and failing at a customer's checkout. A
# default that "works in dev" is how a shared sandbox credential ends up in
# git - these come from the environment or they do not exist.
#
# SANDBOX vs PRODUCTION is this ONE property. The base URL is derived from
# it rather than configured separately, so a production URL can never be
# paired with sandbox keys.
cashfree.environment=${CASHFREE_ENVIRONMENT:sandbox}
cashfree.app-id=${CASHFREE_APP_ID:}
cashfree.secret-key=${CASHFREE_SECRET_KEY:}
# Falls back to secret-key when unset, which is what Cashfree currently
# signs with - kept separate so the two can diverge without a code change.
cashfree.webhook-secret=${CASHFREE_WEBHOOK_SECRET:}
# Header value, not a URL segment. Bump here, in one place.
cashfree.api-version=${CASHFREE_API_VERSION:2025-01-01}
# This app's own public URL + the webhook path. Must match what is
# configured in the Cashfree dashboard.
cashfree.notify-url=${CASHFREE_NOTIFY_URL:}
cashfree.return-url=${CASHFREE_RETURN_URL:}
cashfree.timeout-seconds=${CASHFREE_TIMEOUT_SECONDS:10}
