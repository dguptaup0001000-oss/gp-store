spring.application.name=backend

# API versioning: every endpoint is now under /v1/... (e.g. /v1/api/products).
# This is the cheapest possible way to version a Spring Boot API - context-path
# is stripped before routing/security matching, so every existing controller
# and every SecurityConfig rule needs ZERO changes. Doing this now, before
# Flutter integration starts, means nothing has to migrate later - once a
# real client depends on these paths, changing them becomes expensive.
server.servlet.context-path=/v1

# Same pattern as JWT secret below: real deployments MUST set these env vars.
# The hardcoded fallbacks here are for local dev only, matching your original
# local Postgres setup - they were never meant to be production values.
#
# Migrated off Railway PostgreSQL - production now runs on Supabase
# PostgreSQL. When setting the real DB_URL env var for Supabase, append
# ?sslmode=require to the end of it, e.g.:
#   jdbc:postgresql://db.<project-ref>.supabase.co:5432/postgres?sslmode=require
# Supabase's direct connection expects SSL; sslmode=require enforces an
# encrypted connection without requiring you to import Supabase's CA cert
# (unlike sslmode=verify-full, which would). The localhost fallback below is
# unaffected - local dev Postgres doesn't need or support this.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gpstore}
spring.datasource.username=${DB_USERNAME:u0_a470}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Force UTC for every DB session, regardless of what timezone the host JVM
# (laptop, Termux/Android, Docker, whatever) happens to be running in. Without
# this, the Postgres JDBC driver sends the JVM's default timezone on connect,
# which silently becomes the session timezone Postgres uses for timestamp
# conversions - causing bugs that only show up depending on which machine
# deployed the app.
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
# Supabase's connection pooler closes idle connections on its own schedule,
# independent of anything this app controls. HikariCP's default max-lifetime
# (30 min) is far longer than that, so during any quiet period - between
# manual test runs, low-traffic hours, etc. - the pool ends up holding
# connections Supabase already closed server-side. The pool doesn't know,
# hands one out anyway, and the request fails with "This connection has
# been closed" (visible in the app logs as repeated HikariCP housekeeper
# warnings even with zero traffic). Keeping max-lifetime short and pairing
# it with a keepalive probe means the pool retires connections on ITS OWN
# terms, before Supabase ever gets the chance to sever them first.
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:270000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_MS:120000}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# ddl-auto is dev-only. Once you have a stable schema, generate a real Flyway
# baseline (see backend/src/main/resources/db/migration/README.md) and switch
# this to "validate" for anything beyond local development.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# Verbose SQL logging - useful for local dev, noisy and log-cost-inflating in
# production. Set SHOW_SQL=false in Render once you've confirmed migrations
# and queries look correct.
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:true}

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true

server.port=${PORT:8081}
spring.devtools.restart.enabled=false

# Store's fixed location - used to compute distance-based delivery estimates.
# Replace with your actual shop's coordinates.
store.latitude=${STORE_LATITUDE:28.6139}
store.longitude=${STORE_LONGITUDE:77.2090}

# Business rule: you're one kirana store, not a dark-store network - orders
# past this distance aren't realistically servable by one delivery partner on
# a bike/scooter. Checkout blocks past this radius instead of silently
# promising delivery you can't actually make. Tune this to your real range.
store.max-delivery-radius-km=${STORE_MAX_DELIVERY_RADIUS_KM:8}

# Delivery pricing rule: ₹15 covers the first 2 km, then ₹3/km beyond that.
delivery.base-charge=${DELIVERY_BASE_CHARGE:15}
delivery.base-distance-km=${DELIVERY_BASE_DISTANCE_KM:2}
delivery.per-km-charge=${DELIVERY_PER_KM_CHARGE:3}

# Free-delivery rule: only waive the delivery fee if this order's gross profit
# is at least K times the delivery fee (K = this factor). K=3 means at most
# ~1/3 of profit goes toward covering delivery, the rest stays with the
# business for rent/salaries/damage/taxes. Tune K without touching the code.
delivery.free-delivery-profit-factor=${DELIVERY_FREE_PROFIT_FACTOR:3}

# Routing rule: orders with this many total items or more go to a "PICKUP"
# vehicle-type partner (more capacity per trip) instead of "BIKE". Tune this to
# your actual bike carrying capacity - this is a starting assumption, not a
# measured number.
delivery.bulk-order-item-threshold=${DELIVERY_BULK_ITEM_THRESHOLD:15}

# JWT - override JWT_SECRET env var in every real environment. This default is for local dev only.
jwt.secret=${JWT_SECRET:dev-only-change-me-GPSTORESECRETKEY123456789012345678901234567890}
# Access token is now short-lived on purpose - refresh tokens (below) are what
# keep the customer logged in without re-entering credentials every 15 minutes.
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

refresh.token.expiration-ms=${REFRESH_TOKEN_EXPIRATION_MS:2592000000}

# Monitoring: /actuator/health is public (needed for load balancers/uptime
# checks to work without auth); everything else (metrics, env, etc.) is
# admin-only (see SecurityConfig) since it can leak internal details.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized

# Caching: in-memory (ConcurrentMapCacheManager) for now - genuinely safe,
# needs no external service, and gives real speedup on read-heavy endpoints
# (product listing, categories). Swapping to real Redis later is a config
# change, not a code change: add spring-boot-starter-data-redis, then set
# spring.cache.type=redis plus spring.data.redis.host/port. Not done yet
# because that needs an actual Redis instance to connect to, which nobody
# has provisioned - forcing it now risks the app failing to start.
spring.cache.type=simple

# Comma-separated list of origins allowed to call this API from a browser
# (Flutter web build, an admin dashboard, etc.). Native mobile apps aren't
# affected by CORS and don't need this. Update once you have real domains -
# the localhost default is for local frontend dev only.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Only set true once you've confirmed you're actually behind a real proxy/load
# balancer that overwrites X-Forwarded-For - otherwise a client can spoof it
# and bypass the login/register rate limit entirely.
rate-limit.trust-forwarded-for=${RATE_LIMIT_TRUST_FORWARDED_FOR:false}

# Your shop's UPI ID (VPA) - customers pay directly to this via any UPI app
# (GPay, PhonePe, Paytm, etc). Direct UPI has NO transaction fee, unlike a
# payment gateway (Razorpay/Cashfree) which takes a cut of every order - the
# tradeoff is you (or staff) manually confirm each payment arrived, since
# there's no gateway webhook to auto-verify it. Replace with your real VPA.
store.upi-id=${STORE_UPI_ID:yourstorename@upi}
store.upi-payee-name=${STORE_UPI_PAYEE_NAME:GP Store}

# Real contact details shown on the app's "Contact Us" screen - replace
# these placeholders with your actual numbers before going live. Configured
# here (not hardcoded in the Flutter app) so changing your support number
# never requires an app rebuild/re-release.
store.support-phone=${STORE_SUPPORT_PHONE:+91XXXXXXXXXX}
store.support-whatsapp=${STORE_SUPPORT_WHATSAPP:+91XXXXXXXXXX}
store.support-email=${STORE_SUPPORT_EMAIL:support@example.com}

# A UPI payment sitting PENDING (never confirmed) past this many minutes is
# auto-expired to FAILED - stops a customer's cart/stock from being tied up
# indefinitely by an abandoned or never-actually-paid order.
payment.upi-timeout-minutes=${PAYMENT_UPI_TIMEOUT_MINUTES:30}

# OTP login via MSG91 (India's standard OTP/SMS provider - see cost discussion:
# ~Rs 0.15/OTP). Requires YOUR real MSG91 auth key and a DLT-registered
# template ID once you've completed that registration - neither can be
# fabricated here.
otp.msg91-auth-key=${MSG91_AUTH_KEY:}
otp.msg91-template-id=${MSG91_TEMPLATE_ID:}
otp.msg91-sender-id=${MSG91_SENDER_ID:GPSTOR}

# When false (the default), OTPs are logged to the console instead of
# actually sent via MSG91 - lets you test the whole login flow locally
# without spending real money or needing MSG91/DLT set up yet. MUST be true
# in any real deployment, or customers never actually receive their OTP.
otp.sms-sending-enabled=${OTP_SMS_SENDING_ENABLED:false}

otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
otp.max-verify-attempts=${OTP_MAX_VERIFY_ATTEMPTS:5}
# Rate limit: at most this many OTP sends per phone number per window -
# stops one number being SMS-bombed (each send costs real money).
otp.max-sends-per-window=${OTP_MAX_SENDS_PER_WINDOW:3}
otp.send-window-minutes=${OTP_SEND_WINDOW_MINUTES:10}

# Push notifications via Firebase Cloud Messaging (order status updates to
# customers, new-assignment alerts to delivery partners). Same pattern as
# otp.sms-sending-enabled above: OFF by default so the app runs fine with
# zero Firebase setup; only turn this on once you've created a Firebase
# project and set FIREBASE_CREDENTIALS_BASE64.
#
# To get that value: Firebase Console -> Project Settings -> Service
# Accounts -> Generate new private key (downloads a JSON file) -> base64
# encode the WHOLE file content and paste the result as this env var.
#   Termux/Linux/Mac: base64 -w0 serviceAccountKey.json
#   Windows PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("serviceAccountKey.json"))
# Never commit the raw JSON file itself to git.
firebase.credentials-base64=${FIREBASE_CREDENTIALS_BASE64:}
firebase.push-enabled=${FIREBASE_PUSH_ENABLED:false}
