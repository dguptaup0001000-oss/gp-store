# Activated with SPRING_PROFILES_ACTIVE=prod (see backend/docker-compose.yml).
# Secrets still come from the environment. This profile only tightens defaults
# that must never ship as local-dev values.
app.production=true
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
# Traefik terminates TLS and sets X-Forwarded-*. Without this, generated
# URLs and scheme checks see http://backend:8081 instead of
# https://api.gpstore.co.in.
server.forward-headers-strategy=framework
# Traefik already access-logs the request. Hibernate bind traces and
# Spring cache DEBUG would steal CPU under a browse flood.
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework.web=WARN
