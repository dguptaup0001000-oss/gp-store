# Test-only overlays. This file lives in classpath:/config/ so it MERGES
# with src/main/resources/application.properties instead of replacing it.
# A same-named file in src/test/resources/ would shadow the datasource URL
# and every other production default.
store.upi-id=gpstore-test@upi
store.support-phone=+919876543210
store.support-email=test-support@gpstore.co.in

# Flyway owns schema under verify. Hibernate update is only for the tagged
# empty-database bootstrap (see EmptyDatabaseBootstrapTest). CI sets these
# env vars explicitly; the defaults here stop a local ./mvnw test from
# silently accepting Hibernate-inferred columns that production never has.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.flyway.enabled=${FLYWAY_ENABLED:true}

# THE AUTH LIMITER, RAISED FOR TESTS ONLY AND IN ONE PLACE.
#
# Production keeps its real limit: application.properties still reads
# RATE_LIMIT_AUTH_PER_MINUTE with a default of 20, and nothing here changes
# that. TheProductionRateLimiterIsUntouchedTest asserts it.
#
# WHY IT HAS TO BE RAISED HERE. The limiter counts per client address, and
# under MockMvc every test in the suite shares one address and one Redis
# counter. Twenty auth calls per minute is a budget the whole suite competes
# for, so on a runner fast enough to compress the run, whichever class happens
# to be registering when the window fills gets a 429 and fails for a reason
# that has nothing to do with what it tests. That is not hypothetical: it took
# out DeactivatedCustomerJwtTest and then AdminAuthorizationIntegrationTest on
# consecutive CI runs, and six classes had already been patched one at a time.
# Per-class patching is whack-a-mole - the next fast runner finds a seventh.
#
# A TEST THAT WANTS THE LIMITER TO BITE STILL GETS IT. @SpringBootTest(
# properties = ...) is an inlined TestPropertySource, which outranks this
# file, so any test can set its own low value locally. RateLimitFilterTest -
# the one that actually tests the limiter - does not even need that: it
# constructs RateLimitFilter directly with explicit numbers and never reads
# Spring configuration at all.
rate-limit.auth-per-minute=100000
