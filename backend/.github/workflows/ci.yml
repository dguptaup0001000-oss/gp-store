# GitHub Actions only runs workflows from the MONOREPO root `.github/workflows/`.
#
# Do not run CI from here. A previous copy of this workflow had no Redis
# service, no schema-migrate job, and the wrong Docker build context if
# someone copied backend/ as its own repo and treated this as canonical.
#
# Authoritative backend CI:
#   ../../.github/workflows/ci.yml

name: Stale backend workflow (disabled)

on:
  workflow_dispatch:

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Point at the canonical workflow
        run: |
          echo "Do not run backend CI from backend/.github/workflows."
          echo "Use the repository-root .github/workflows/ci.yml"
          exit 1
