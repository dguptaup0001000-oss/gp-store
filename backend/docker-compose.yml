# Hostinger production Compose.
# Traefik owns 80/443. Spring Boot stays on 8081 inside the Docker network.
# PostgreSQL and Redis are not published to the host.
#
# Laptop development (published 5432/8081) is docker-compose.dev.yml.
#
# Copy .env.example to .env and fill real values before `docker compose up`.

name: gpstore

services:
  # Traefik only needs to list containers/networks. Writes (start/stop) are
  # denied. The raw Docker socket is never mounted on Traefik itself.
  dockerproxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      INFO: "1"
      VERSION: "1"
      EVENTS: "1"
      PING: "1"
      POST: "0"
      DELETE: "0"
      BUILD: "0"
      EXEC: "0"
      IMAGES: "0"
      VOLUMES: "0"
      AUTH: "0"
      SECRETS: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    cpus: "0.20"
    security_opt:
      - no-new-privileges:true
    networks:
      - gpstore_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  traefik:
    # v3.6.1+ negotiates Docker API with Engine 29 (min API 1.40).
    # v3.3 spoke API 1.24 and could not read container labels, so ACME never ran.
    image: traefik:v3.6.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://dockerproxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=gpstore_net
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # Cloudflare orange-cloud (Full strict) is the public hop. Without
      # trustedIPs Traefik replaces X-Forwarded-For with the edge IP and
      # AUTH rate limits collapse onto a handful of anycast addresses.
      # Ranges from https://www.cloudflare.com/ips/ (2026-08-29). Do not
      # set forwardedHeaders.insecure — that trusts the whole internet.
      - "--entrypoints.web.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
      - "--entrypoints.websecure.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
      # HTTP/2 is the Traefik TLS default. Raise the stream cap so one
      # browser/app connection is not artificially limited to 128.
      - --entrypoints.websecure.http2.maxConcurrentStreams=512
      # Bound how long a client can occupy a TLS slot after Traefik has
      # accepted the handshake. Unbounded idle was fine at tens of users
      # and expensive at thousands of keep-alive VUs.
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=60s
      - --entrypoints.websecure.transport.respondingTimeouts.writeTimeout=60s
      - --entrypoints.websecure.transport.respondingTimeouts.idleTimeout=90s
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      # Pool HTTP/1.1 connections to Tomcat. Default Go http.Transport is
      # 2 idle conns per host, which forces extra handshakes under browse
      # load. 256 matches a busy keep-alive set without opening 10k.
      - --serversTransport.maxIdleConnsPerHost=512
      - --serversTransport.forwardingTimeouts.dialTimeout=5s
      - --serversTransport.forwardingTimeouts.responseHeaderTimeout=60s
      - --serversTransport.forwardingTimeouts.idleConnTimeout=90s
      # Internal /ping for Docker HEALTHCHECK. Do not publish 8080.
      - --ping=true
      # Dashboard / API not enabled. Do not add --api.insecure.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_letsencrypt:/letsencrypt
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Traefik talks to a socket proxy, not the raw Docker socket.
    depends_on:
      dockerproxy:
        condition: service_started
    logging: &default_logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # TLS termination was the 2,000-VU bottleneck (http_req_blocked p95
    # 1s, max 8s) while the backend heap and Hikari stayed idle. 1.00 lets
    # Traefik use a full core for handshakes; these are limits, not
    # reservations, so Postgres can still burst when catalog misses.
    mem_limit: 384m
    cpus: "1.00"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    security_opt:
      - no-new-privileges:true
    networks:
      - gpstore_net

  postgres:
    # PostgreSQL 17: production dump is from Supabase 17.6. A 16 data
    # directory cannot start 17; an empty volume must be recreated once.
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - gpstore_pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    # 1.5 GB container on an 8 GB host. shared_buffers 256 MB is ~17% of
    # the container, not of the host. Do not set work_mem high: 20 Hikari
    # backends × a large work_mem OOMs this sidecar under sort-heavy search.
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - random_page_cost=1.1
      - -c
      - idle_in_transaction_session_timeout=30000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    # Intentionally no `ports:` — Postgres is Docker-network only.
    mem_limit: 1536m
    cpus: "1.0"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    networks:
      - gpstore_net

  redis:
    # Required by spring.cache.type=redis and RateLimitFilter. Not optional.
    # Password comes from a Docker secret file, not container Env, so
    # `docker inspect` does not show REDIS_PASSWORD or requirepass argv.
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets:
      - redis_password
    volumes:
      - gpstore_redis_data:/data
      - ./docker/redis/docker-entrypoint.sh:/redis-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/redis-entrypoint.sh"]
    # Root only long enough to chown /data and gosu redis. cap_drop ALL
    # removes CHOWN/SETUID/DAC_OVERRIDE, which made dump.rdb unreadable
    # when the process stayed root (EACCES) after #96.
    user: "0:0"
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$(tr -d ''\r\n'' < /run/secrets/redis_password)" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10
    # Intentionally no `ports:` — Redis is Docker-network only.
    mem_limit: 640m
    cpus: "0.50"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - gpstore_net

  backend:
    image: gp-store-backend:${BACKEND_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        APP_VERSION: ${APP_VERSION:-0.0.1-SNAPSHOT}
    restart: unless-stopped
    environment:
      PORT: "8081"
      SPRING_PROFILES_ACTIVE: prod
      APP_PRODUCTION: "true"
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      APP_VERSION: ${APP_VERSION:-0.0.1-SNAPSHOT}
      FLYWAY_ENABLED: "true"
      # Default validate. SchemaSafetyGuard refuses update/create/drop when
      # APP_PRODUCTION=true, so a mistyped .env cannot silently mutate schema.
      DDL_AUTO: ${DDL_AUTO:-validate}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      RATE_LIMIT_TRUST_FORWARDED_FOR: "true"
      STORE_LATITUDE: ${STORE_LATITUDE:-27.162310}
      STORE_LONGITUDE: ${STORE_LONGITUDE:-83.940468}
      # Contact Us. `:-` keeps placeholders if the VPS .env keys are empty.
      STORE_SUPPORT_PHONE: ${STORE_SUPPORT_PHONE:-}
      STORE_SUPPORT_WHATSAPP: ${STORE_SUPPORT_WHATSAPP:-}
      STORE_SUPPORT_EMAIL: ${STORE_SUPPORT_EMAIL:-}
      STORE_SUPPORT_URL: ${STORE_SUPPORT_URL:-}
      CASHFREE_ENVIRONMENT: ${CASHFREE_ENVIRONMENT:-production}
      CASHFREE_APP_ID: ${CASHFREE_APP_ID:-}
      CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY:-}
      CASHFREE_WEBHOOK_SECRET: ${CASHFREE_WEBHOOK_SECRET:-}
      CASHFREE_NOTIFY_URL: ${CASHFREE_NOTIFY_URL:-}
      CASHFREE_RETURN_URL: ${CASHFREE_RETURN_URL:-}
      MSG91_ENABLED: ${MSG91_ENABLED:-false}
      OTP_SMS_SENDING_ENABLED: ${OTP_SMS_SENDING_ENABLED:-false}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_OTP_TEMPLATE_ID: ${MSG91_OTP_TEMPLATE_ID:-}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID:-GPSTOR}
      FIREBASE_PUSH_ENABLED: ${FIREBASE_PUSH_ENABLED:-false}
      FIREBASE_CREDENTIALS_BASE64: ${FIREBASE_CREDENTIALS_BASE64:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      # Interpolated from backend/.env in this directory. Do NOT add
      # env_file: /opt/gpstore/env-production — these ${R2_*:-} lines
      # would still override it with empty values from the compose .env.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_IMAGE_WORKER_BASE_URL: ${R2_IMAGE_WORKER_BASE_URL:-}
      OPS_BACKUP_VOLUME_PATH: /backups
      JVM_ACTIVE_PROCESSORS: "2"
      JVM_GC: "-XX:+UseG1GC -XX:MaxGCPauseMillis=50"
      # 35% of 2560m ≈ 896 MB heap. Direct buffers raised with maxConnections.
      JVM_MAX_RAM_PERCENT: "35"
      JVM_MAX_DIRECT: "64m"
      TOMCAT_LIVE_PORT: "8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    secrets:
      - redis_password
    volumes:
      # Read-only so /api/admin/ops/status can report backup-volume disk.
      - gpstore_pg_backups:/backups:ro
    healthcheck:
      # Live connector, not the 80-thread catalog pool. Actuator/health on
      # 8081 still exists; Docker must not queue behind catalog GETs.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/v1/api/health/live"]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 90s
    labels:
      - traefik.enable=true
      - traefik.http.routers.gpstore.rule=Host(`${API_DOMAIN:-api.gpstore.co.in}`)
      - traefik.http.routers.gpstore.entrypoints=websecure
      - traefik.http.routers.gpstore.tls.certresolver=le
      - traefik.http.routers.gpstore.priority=10
      - traefik.http.routers.gpstore.middlewares=gpstore-compress
      # Two services on one container: every router MUST set .service.
      # Without this, Traefik drops the gpstore router ("cannot create a
      # router ... too many services") and only PathPrefix live works.
      # Seen on 2444870: in-container SHA matched, /health/live was 200,
      # /version /health /ready were Traefik 404, then rollback to f229fd9.
      - traefik.http.routers.gpstore.service=gpstore
      - traefik.http.middlewares.gpstore-compress.compress=true
      - traefik.http.services.gpstore.loadbalancer.server.port=8081
      - traefik.http.services.gpstore.loadbalancer.server.scheme=http
      # Liveness on the dedicated connector. Higher priority than the
      # catch-all Host rule. No compress middleware: the body is tiny.
      - traefik.http.routers.gpstore-live.rule=Host(`${API_DOMAIN:-api.gpstore.co.in}`) && PathPrefix(`/v1/api/health/live`)
      - traefik.http.routers.gpstore-live.entrypoints=websecure
      - traefik.http.routers.gpstore-live.tls.certresolver=le
      - traefik.http.routers.gpstore-live.service=gpstore-live
      - traefik.http.routers.gpstore-live.priority=100
      - traefik.http.services.gpstore-live.loadbalancer.server.port=8082
      - traefik.http.services.gpstore-live.loadbalancer.server.scheme=http
    stop_grace_period: 40s
    # Host is 2 vCPU / 8 GB. Limits (not reservations) so idle sidecars do
    # not steal quota. 1.70 lets the JVM use the cores Postgres is not
    # using during cached catalog hits; 2560m gives G1 ~900 MB heap.
    # Remaining RAM: Postgres 1536m + Redis 640m + Traefik 384m + OS.
    mem_limit: 2560m
    cpus: "1.70"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - gpstore_net
    # Intentionally no host `ports:` — Traefik reaches 8081 on the Docker network.

  backup:
    image: postgres:17
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${DB_USERNAME}
      PGDATABASE: ${DB_NAME}
      PGPASSWORD: ${DB_PASSWORD}
      DB_USERNAME: ${DB_USERNAME}
      DB_NAME: ${DB_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      BACKUP_HEALTH_MAX_MINUTES: ${BACKUP_HEALTH_MAX_MINUTES:-1560}
    volumes:
      - gpstore_pg_backups:/backups
      - ./docker/backup/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh", "daemon"]
    healthcheck:
      test: ["CMD-SHELL", "/bin/sh /backup.sh health"]
      interval: 2m
      timeout: 10s
      retries: 2
      start_period: 15m
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    cpus: "0.25"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - gpstore_net

volumes:
  gpstore_pg_data:
  gpstore_redis_data:
  gpstore_pg_backups:
  traefik_letsencrypt:

secrets:
  redis_password:
    file: .secrets/redis_password

networks:
  gpstore_net:
    name: gpstore_net
