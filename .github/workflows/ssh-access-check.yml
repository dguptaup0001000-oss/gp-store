# Harmless SSH probe. Does not deploy, restore, or change production.
# Uses existing secret PROD_SSH_PRIVATE_KEY. Never prints the private key.
name: SSH access check

on:
  workflow_dispatch:
  # Push to main is a no-op when the merger is GITHUB_TOKEN. Automerge
  # dispatches this workflow explicitly after merge.
  push:
    branches: [main]

concurrency:
  group: gpstore-prod-ssh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Identify deploy key and probe SSH
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Same convention as the money evaluator: a retry whose logic was
      # never exercised is a retry nobody should trust with a verdict about
      # production. Runs in about a second - the delay is zeroed in the
      # self-test, not slept through.
      - name: Prove the retry logic first
        run: |
          set -Eeuo pipefail
          SSH_RETRY_SELFTEST=1 bash deploy/production/ssh_retry.sh

      - name: Require VPS SSH secrets
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          missing=0
          for v in PROD_HOST PROD_USER PROD_SSH_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set"
              missing=1
            fi
          done
          exit "$missing"

      - name: Identify deploy public key
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          chmod +x .github/scripts/identify_deploy_pubkey.sh
          .github/scripts/identify_deploy_pubkey.sh

      - name: Log this runner's egress address
        run: |
          chmod +x .github/scripts/log_runner_egress.sh
          ./.github/scripts/log_runner_egress.sh

      - name: Probe SSH without deploying
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
        run: |
          set -Eeuo pipefail
          umask 077
          KEY="$(mktemp)"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$KEY"
          chmod 600 "$KEY"
          # Retried on a connection failure, like the deploy already is. A
          # single GitHub runner whose egress address cannot reach the box
          # used to fail this probe and report "SSH access is broken" while
          # the deploy, on another runner minutes later, worked fine.
          # RUN VIA bash, NOT chmod+exec. See the note in
          # deploy-production.yml: a chmod on a repository file has killed
          # this kind of step before, and the retry must not be able to
          # break the thing it exists to make reliable.
          bash deploy/production/ssh_retry.sh \
            -- ssh -i "$KEY" \
              -p "${PROD_PORT:-22}" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              -o PreferredAuthentications=publickey \
              -o PasswordAuthentication=no \
              -o StrictHostKeyChecking=accept-new \
              "${PROD_USER}@${PROD_HOST}" \
              'echo SSH_OK; id; hostname; pwd; test -d /opt/gp-store/.git && echo CHECKOUT_OK; test -f /opt/gp-store/backend/.env && echo ENV_OK'
          echo "SSH probe succeeded. This workflow did not deploy."
