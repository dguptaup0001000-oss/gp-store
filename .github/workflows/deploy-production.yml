# Automatic production deploy: GitHub main → Hostinger VPS.
#
# Push to main starts this after backend CI is green. workflow_dispatch is
# an emergency redeploy of a specific SHA (must be origin/main unless you
# temporarily set REQUIRE_ORIGIN_MAIN=0 on the VPS, which is not recommended).
#
# Secrets (repo Settings → Secrets → Actions):
#   PROD_HOST, PROD_USER, PROD_SSH_PRIVATE_KEY
#   optional: PROD_PORT (default 22), PROD_APP_DIR (default /opt/gp-store)
#
# This workflow does not receive database, JWT, MSG91, or Cashfree secrets.
# Those stay in backend/.env on the VPS.

name: Deploy Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full 40-character git SHA to deploy (empty = this commit / current main)'
        required: false
        default: ''
      skip_ci_gate:
        description: 'Skip waiting for the CI workflow (emergency only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-syntax-pr-{0}', github.event.number) || 'production-deployment' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

# WORKFLOW-LEVEL so both deploy attempts - which run as SEPARATE JOBS on
# separate runners - execute the identical script. See the deploy job for why
# the retry needs a different machine rather than a longer wait.
env:
  REMOTE_DEPLOY: |
    set -Eeuo pipefail
    DEPLOY_ROOT="${DEPLOY_ROOT:-/opt/gp-store}"
    if [ -z "${TARGET_SHA:-}" ]; then
      echo "TARGET_SHA is empty"
      exit 1
    fi
    if [ ! -d "$DEPLOY_ROOT/.git" ]; then
      echo "No checkout at $DEPLOY_ROOT. Run deploy/production/prepare-vps.sh once."
      exit 1
    fi
    cd "$DEPLOY_ROOT"
    git fetch origin --prune
    if git show-ref --verify --quiet refs/heads/main; then
      git checkout main
    else
      git checkout -b main origin/main
    fi
    git reset --hard origin/main
    HEAD_SHA="$(git rev-parse HEAD)"
    if [ "$HEAD_SHA" != "$TARGET_SHA" ]; then
      echo "VPS HEAD $HEAD_SHA != GITHUB_SHA $TARGET_SHA. Refusing to deploy."
      exit 1
    fi
    chmod +x deploy/production/deploy.sh deploy/production/prepare-vps.sh
    exec ./deploy/production/deploy.sh "$TARGET_SHA"

jobs:
  syntax:
    name: Check deploy scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: |
          bash -n deploy/production/deploy.sh
          bash -n deploy/production/prepare-vps.sh
          bash -n deploy/production/harden-ssh.sh
          bash -n deploy/production/disk-guard.sh
          bash -n deploy/production/prune-backend-images.sh
          chmod +x deploy/production/test_harden_ssh.sh deploy/production/test_disk_guard.sh deploy/production/test_prune_backend_images.sh
          deploy/production/test_harden_ssh.sh
          deploy/production/test_disk_guard.sh
          deploy/production/test_prune_backend_images.sh
          bash -n deploy/production/backup-offbox-sync.sh
          bash -n deploy/production/offbox-pull-from-vps.sh
          bash -n deploy/production/offbox-decrypt-restore.sh
          bash -n deploy/production/offbox-gpg-roundtrip.sh
          bash -n deploy/production/evaluate-backup-status.sh
          bash -n deploy/production/evaluate-offbox-result.sh
          bash -n deploy/production/backup-restore-drill.sh
          sh -n backend/docker/backup/backup.sh
          python3 -m py_compile .github/scripts/wait_for_ci.py
          python3 -m py_compile .github/scripts/automerge_eligible_pr.py
          python3 -m py_compile .github/scripts/resolve_api_base_url.py
          python3 -m py_compile .github/scripts/check_deploy_job_has_no_identify.py
          python3 .github/scripts/resolve_api_base_url.py --self-test
          python3 -m py_compile backend/docker/redis/materialize-password-file.py
          sh -n backend/docker/redis/docker-entrypoint.sh
          sh -n backend/docker-entrypoint.sh
          python3 backend/docker/redis/test_materialize_password_file.py
          bash -n .github/scripts/identify_deploy_pubkey.sh
          bash -n deploy/production/merge-r2-env.sh
          chmod +x .github/scripts/identify_deploy_pubkey.sh deploy/production/merge-r2-env.sh
          IDENTIFY_DEPLOY_PUBKEY_SELFTEST=1 .github/scripts/identify_deploy_pubkey.sh
          MERGE_R2_ENV_SELFTEST=1 deploy/production/merge-r2-env.sh
          test -x deploy/production/deploy.sh || chmod +x deploy/production/deploy.sh
          grep -F 'set -Eeuo pipefail' deploy/production/deploy.sh
          grep -F 'verify_traefik_sha' deploy/production/deploy.sh
          grep -F 'not rolling back' deploy/production/deploy.sh
          grep -F 'set_or_unset R2_ACCESS_KEY_ID' deploy/production/deploy.sh
          grep -F 'set_or_unset R2_SECRET_ACCESS_KEY' deploy/production/deploy.sh
          # Deploy must not run the public-key identify script.
          python3 .github/scripts/check_deploy_job_has_no_identify.py
          grep -F 'traefik.http.routers.gpstore.service=gpstore' backend/docker-compose.yml
          grep -F 'traefik.http.routers.gpstore-live.service=gpstore-live' backend/docker-compose.yml
          python3 -m py_compile .github/scripts/check_compose_host_ports.py
          python3 .github/scripts/check_compose_host_ports.py backend/docker-compose.yml
          python3 -m py_compile .github/scripts/check_compose_published_ports.py
          python3 .github/scripts/test_check_compose_published_ports.py
          python3 .github/scripts/check_compose_published_ports.py .
          if grep -vE '^[[:space:]]*#' deploy/production/deploy.sh | grep -E 'compose[[:space:]]+down[[:space:]]+(-v|--volumes)'; then
            echo "deploy.sh must never destroy Compose volumes" >&2
            exit 1
          fi

      # The script that actually runs on production lives inline in this
      # workflow (top-level env.REMOTE_DEPLOY - workflow scope, because BOTH
      # the deploy job and the fresh-runner fallback use it), so `bash -n`
      # over deploy/production/*.sh does not see it. It was unchecked before
      # too; now that it is one named value it can be checked, so it is.
      - name: bash -n the inline remote deploy script
        run: |
          set -Eeuo pipefail
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - > /tmp/remote_deploy.sh <<'EXTRACT'
          import yaml
          wf = yaml.safe_load(open('.github/workflows/deploy-production.yml'))
          print(wf['env']['REMOTE_DEPLOY'])
          EXTRACT
          bash -n /tmp/remote_deploy.sh
          # It must still be the script that deploys, not an empty string that
          # would connect, do nothing, and report success.
          grep -q 'deploy/production/deploy.sh' /tmp/remote_deploy.sh

  wait-for-ci:
    name: Wait for backend CI
    needs: [syntax]
    # No job-level if. A false if while syntax is still queued aborts the
    # workflow as startup_failure (seen on #94 and on this PR).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wait until workflow CI succeeds for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}
          SKIP_CI_GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_ci_gate || false }}
        run: |
          set -Eeuo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "PR run is syntax-only; not waiting for CI and not deploying"
            exit 0
          fi
          if [ "$SKIP_CI_GATE" = "true" ]; then
            echo "skip_ci_gate=true; not waiting for CI (emergency dispatch)"
            exit 0
          fi
          python3 .github/scripts/wait_for_ci.py

  deploy:
    name: Deploy backend to VPS
    needs: [syntax, wait-for-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # PRs only syntax-check; they must not sit in the production environment.
    environment: ${{ github.event_name == 'pull_request' && 'pr-syntax' || 'production' }}
    # THE VPS TAKES ONE SSH CALLER AT A TIME. Backup alert, off-box backup and
    # the SSH access check already share this group; the deploy - by far the
    # heaviest and the one that restarts the backend - was the only VPS SSH
    # workflow outside it. A scheduled backup (cron 20 1,7,13,19) landing on
    # top of a deploy is a collision nobody would enjoy debugging.
    #
    # JOB-LEVEL, not workflow-level, on purpose: the workflow's own group also
    # covers PR syntax runs, which touch no server and must not queue behind a
    # production backup. Only this job takes the lock.
    #
    # No deadlock with the backup this workflow dispatches afterwards: the
    # dispatch is fire-and-forget in a later job, so the backup simply waits
    # for this lock to clear instead of blocking on us.
    concurrency:
      group: gpstore-prod-ssh
      cancel-in-progress: false
    steps:
      - name: Skip deploy on pull requests
        if: github.event_name == 'pull_request'
        run: echo "PR run is syntax-only; not deploying."

      - name: Resolve target SHA
        if: github.event_name != 'pull_request'
        id: sha
        env:
          DISPATCH_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || '' }}
        run: |
          set -Eeuo pipefail
          if [ -n "${DISPATCH_SHA}" ]; then
            echo "sha=${DISPATCH_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Require VPS SSH secrets
        if: github.event_name != 'pull_request'
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          missing=0
          for v in PROD_HOST PROD_USER PROD_SSH_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set. Add it in repo Settings → Secrets and variables → Actions. See deploy/production/README.md"
              missing=1
            fi
          done
          exit "$missing"

      # Public-key identify lives in ssh-access-check.yml (and backup-alert).
      # Do not run it here: deploy does not use that output, and a missing
      # runner checkout aborted SSH (run 33237217036).

      # WHY THE RETRY IS A SEPARATE JOB AND NOT MORE STEPS.
      #
      # On 31 Aug 2026 this deploy lost the release for #141: both attempts hit
      # `dial tcp: i/o timeout`. An inspection of the VPS (PR #143) established
      # where the packets went, and it is not this machine's doing:
      #
      #   - `journalctl -u ssh` has NO sshd line for 07:12-07:16. The SYNs
      #     never arrived. sshd sat at "0 of 10-100 startups".
      #   - ufw ACCEPTs SSH (it is not a `limit` rule), and fail2ban is not
      #     installed at all - harden-ssh.sh has never been run on that box.
      #   - No reboot, no OOM, disk 35% and inodes 2%.
      #
      # So the drop is OFF-BOX - the provider edge or the path - and it tracks
      # the SOURCE, not the clock. The runner regions line up exactly:
      #
      #   06:06  westus ........... timed out
      #   07:03  westcentralus .... success
      #   07:07  westcentralus .... success
      #   07:12  centralus ........ timed out  <- deploy #141, twice
      #   11:58  westcentralus .... success in 82s
      #
      # EVERY STEP IN A JOB SHARES ONE RUNNER, AND SO ONE SOURCE IP. Waiting
      # longer between steps therefore re-dials from the address that is being
      # dropped: #141's two attempts both failed from centralus, and a longer
      # ladder in the same job would only have failed more times, more slowly.
      # An earlier version of this change did exactly that; the VPS evidence
      # is what corrected it.
      #
      # So: two quick attempts here for a genuinely transient blip, then the
      # `deploy-fallback` job below, which GitHub schedules on a NEW runner -
      # a different VM and usually a different address and region. That is a
      # better draw in the lottery, not a guarantee, and it is the only lever
      # this repository has over the source address.
      #
      # Both jobs run env.REMOTE_DEPLOY, and it is idempotent - it resets to
      # origin/main and re-runs deploy.sh - so a partially-connected earlier
      # attempt costs the next one nothing.
      # THIS CHECKOUT IS LOAD-BEARING, and its absence broke every deploy
      # from #149 to #154 inclusive.
      #
      # These two jobs are otherwise pure SSH: the whole deploy is the
      # env.REMOTE_DEPLOY script, which runs ON THE VPS, so nothing here ever
      # needed the repository on the runner. #149 then added the egress-address
      # step below, which reads a file OUT OF THE REPOSITORY - and the first
      # line of that step is `chmod +x`, which fails, and the job is dead
      # before it dials:
      #
      #   chmod: cannot access '.github/scripts/log_runner_egress.sh'
      #
      # Six consecutive releases failed on that line. The diagnostic added to
      # investigate why deploys sometimes cannot reach the VPS became the
      # reason they never reached it at all.
      #
      # persist-credentials: false because nothing here pushes, and the SSH
      # payload is taken from env, not from this checkout.
      - name: Check out (needed by the egress script below)
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log this runner's egress address
        if: github.event_name != 'pull_request'
        run: |
          chmod +x .github/scripts/log_runner_egress.sh
          ./.github/scripts/log_runner_egress.sh

      - name: SSH deploy (attempt 1)
        id: ssh1
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET_SHA: ${{ steps.sha.outputs.sha }}
          DEPLOY_ROOT: ${{ secrets.PROD_APP_DIR }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_PORT != '' && secrets.PROD_PORT || 22 }}
          # Dial timeout only - NOT the command window. Default 30s missed
          # this VPS twice (PR #107, #108).
          timeout: 2m
          script_stop: true
          command_timeout: 40m
          envs: TARGET_SHA,DEPLOY_ROOT
          script: ${{ env.REMOTE_DEPLOY }}

      - name: Wait 60s before attempt 2
        if: github.event_name != 'pull_request' && steps.ssh1.outcome == 'failure'
        run: sleep 60

      - name: SSH deploy (attempt 2)
        id: ssh2
        if: github.event_name != 'pull_request' && steps.ssh1.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET_SHA: ${{ steps.sha.outputs.sha }}
          DEPLOY_ROOT: ${{ secrets.PROD_APP_DIR }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_PORT != '' && secrets.PROD_PORT || 22 }}
          # Dial timeout only - NOT the command window. Default 30s missed
          # this VPS twice (PR #107, #108).
          timeout: 2m
          script_stop: true
          command_timeout: 40m
          envs: TARGET_SHA,DEPLOY_ROOT
          script: ${{ env.REMOTE_DEPLOY }}

  # A SECOND ROLL OF THE DICE, FROM A DIFFERENT MACHINE.
  #
  # Runs only when the deploy job actually failed. GitHub gives each job its
  # own runner, so this one dials from a different source address - the single
  # variable that correlated with success or failure in the #141 incident.
  #
  # It repeats the same two attempts. If both jobs fail, four connections from
  # two distinct addresses could not reach the box, which is a real outage
  # worth a red run rather than more retrying.
  deploy-fallback:
    name: Deploy backend to VPS (fresh runner)
    needs: deploy
    if: failure() && needs.deploy.result == 'failure' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    concurrency:
      group: gpstore-prod-ssh
      cancel-in-progress: false
    steps:
      - name: Resolve target SHA
        id: sha
        env:
          DISPATCH_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || '' }}
        run: |
          set -Eeuo pipefail
          if [ -n "${DISPATCH_SHA}" ]; then
            echo "sha=${DISPATCH_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Note why this job is running
        run: |
          echo "::warning::The first deploy runner could not reach the VPS. Retrying from a different runner; see PR #143 for the source-address correlation."

      # THIS CHECKOUT IS LOAD-BEARING, and its absence broke every deploy
      # from #149 to #154 inclusive.
      #
      # These two jobs are otherwise pure SSH: the whole deploy is the
      # env.REMOTE_DEPLOY script, which runs ON THE VPS, so nothing here ever
      # needed the repository on the runner. #149 then added the egress-address
      # step below, which reads a file OUT OF THE REPOSITORY - and the first
      # line of that step is `chmod +x`, which fails, and the job is dead
      # before it dials:
      #
      #   chmod: cannot access '.github/scripts/log_runner_egress.sh'
      #
      # Six consecutive releases failed on that line. The diagnostic added to
      # investigate why deploys sometimes cannot reach the VPS became the
      # reason they never reached it at all.
      #
      # persist-credentials: false because nothing here pushes, and the SSH
      # payload is taken from env, not from this checkout.
      - name: Check out (needed by the egress script below)
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log this runner's egress address
        if: github.event_name != 'pull_request'
        run: |
          chmod +x .github/scripts/log_runner_egress.sh
          ./.github/scripts/log_runner_egress.sh

      - name: SSH deploy (fallback attempt 1)
        id: ssh1
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET_SHA: ${{ steps.sha.outputs.sha }}
          DEPLOY_ROOT: ${{ secrets.PROD_APP_DIR }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_PORT != '' && secrets.PROD_PORT || 22 }}
          # Dial timeout only - NOT the command window. Default 30s missed
          # this VPS twice (PR #107, #108).
          timeout: 2m
          script_stop: true
          command_timeout: 40m
          envs: TARGET_SHA,DEPLOY_ROOT
          script: ${{ env.REMOTE_DEPLOY }}

      - name: Wait 60s before fallback attempt 2
        if: github.event_name != 'pull_request' && steps.ssh1.outcome == 'failure'
        run: sleep 60

      - name: SSH deploy (fallback attempt 2)
        id: ssh2
        if: github.event_name != 'pull_request' && steps.ssh1.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET_SHA: ${{ steps.sha.outputs.sha }}
          DEPLOY_ROOT: ${{ secrets.PROD_APP_DIR }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_PORT != '' && secrets.PROD_PORT || 22 }}
          # Dial timeout only - NOT the command window. Default 30s missed
          # this VPS twice (PR #107, #108).
          timeout: 2m
          script_stop: true
          command_timeout: 40m
          envs: TARGET_SHA,DEPLOY_ROOT
          script: ${{ env.REMOTE_DEPLOY }}


  start-offbox:
    name: Start off-box backup
    needs: [deploy, deploy-fallback]
    # EITHER deploy path counts, and `always()` is required because the
    # fallback is SKIPPED on the happy path - without it, a skipped dependency
    # would silently take the backup with it and production would quietly stop
    # being backed up after every successful deploy.
    if: >-
      always()
      && github.event_name != 'pull_request'
      && (needs.deploy.result == 'success' || needs['deploy-fallback'].result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch Off-box backup on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh workflow run offbox-backup.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched Off-box backup on main."
