name: Load Test (distributed, manual)

# Sharded load generation across several GitHub runners.
#
# WHY THIS EXISTS SEPARATELY FROM load-test.yml: a single ubuntu-latest
# runner is 2-4 vCPUs. k6 is efficient, but each virtual user still costs a
# goroutine, a connection, and JSON parsing per iteration - realistically
# that runner tops out somewhere around 1,000-3,000 VUs for THIS script
# before the generator itself becomes the bottleneck. Past that point the
# numbers stop describing the backend and start describing the runner, which
# is the single easiest way to produce a load-test result that is confidently
# wrong.
#
# So high VU counts are reached by running N runners at once, each carrying
# total_vus / shards, rather than by asking one runner for a number it cannot
# honestly produce.
#
# READ THIS BEFORE RAISING THE NUMBERS:
#
# 1. Each shard is a separate machine with its own IP. That is what makes
#    sharding work for AUTH endpoints, which are rate-limited per IP
#    (rate-limit.auth-per-minute, default 20). It also means per-IP limits
#    scale with shard count, so a sharded run is NOT equivalent to the same
#    VU count from one address - that is a deliberate property, not a bug.
#
# 2. Authenticated scenarios need seeded accounts, and seeding is
#    deliberately slow (paced against the auth rate limit). Seeding
#    thousands of accounts takes hours. High-VU runs are therefore
#    browse-heavy by design; cart/checkout stay modest.
#
# 3. Point this at a target you are allowed to saturate. Against a small
#    instance the result of a very large run is "everything timed out",
#    which measures the instance, not the code.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Backend base URL (include /v1). No default: localhost cannot work across shards. Production requires confirm_production and is browse-only.'
        required: true
      total_browse_vus:
        description: 'TOTAL concurrent browse VUs across all shards'
        required: true
        default: '2000'
      total_cart_vus:
        description: 'TOTAL concurrent cart VUs across all shards (needs seeded accounts)'
        required: true
        default: '100'
      shards:
        description: 'How many runners to split the load across (1-20)'
        required: true
        default: '4'
      duration:
        description: 'Hold duration at peak (k6 time string)'
        required: true
        default: '3m'
      ramp_time:
        description: 'Ramp up/down duration (k6 time string)'
        required: true
        default: '1m'
      accounts_per_shard:
        description: 'Test accounts each shard seeds (0 to skip seeding and run browse-only)'
        required: true
        default: '0'
      confirm_production:
        description: 'To load test the LIVE shop, type its hostname exactly (e.g. api.gpstore.co.in). Leave empty otherwise. A confirmed production run is still browse-only: total_cart_vus and accounts_per_shard must both be 0.'
        required: false
        default: ''

jobs:
  # REFUSES PRODUCTION BEFORE A SINGLE RUNNER STARTS.
  #
  # load-test.yml and run-concurrent-orders.sh both refuse the live shop -
  # this workflow did not, and it is the dangerous one: browse-cart-checkout.js
  # places real orders and seeds real accounts, and the default here is 2000
  # VUs across four machines. A dispatcher who typed the live hostname into a
  # free-text box would have done that to the real database from four IPs at
  # once.
  #
  # Its own job so it fails in seconds, before the plan, before any shard has
  # started, and before seed-accounts.js has created anything anywhere.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse production and credential-bearing URLs
        env:
          BASE_URL: ${{ inputs.base_url }}
          CONFIRM: ${{ inputs.confirm_production }}
          CART_VUS: ${{ inputs.total_cart_vus }}
          ACCOUNTS: ${{ inputs.accounts_per_shard }}
        run: |
          set -Eeuo pipefail
          echo "target : ${BASE_URL}"

          # WHAT THE ORIGINAL REFUSAL WAS ACTUALLY ABOUT. It cited
          # run-concurrent-orders.sh, which has refused the live shop since a
          # 5,005-VU run produced 502s and a bill - and the harm in that run
          # was REAL ORDERS AND REAL ACCOUNTS, not the GETs. So the refusal is
          # kept, but it now separates the two:
          #
          #   - Writes against production stay refused outright. There is no
          #     opt-in for them, because a load test that creates real orders
          #     in a real shop is not a thing anyone should be one checkbox
          #     away from.
          #   - A browse-only run is heavy, not destructive. It is allowed,
          #     but only when the dispatcher types the live hostname out in
          #     full, which a fumbled paste into the base_url box cannot do
          #     by accident. That was the whole point of the original guard.
          #
          # browse-cart-checkout.js honours this: CART_VUS=0 disables the cart
          # scenario, and CHECKOUT_RATE defaults to 0 whenever CART_VUS is 0,
          # so the two write scenarios are not constructed at all. With
          # accounts_per_shard=0 the seeding step is skipped as well. What
          # runs is catalogue GETs.
          case "${BASE_URL}" in
            *gpstore.co.in*)
              if [ -z "${CONFIRM}" ] || ! printf '%s' "${BASE_URL}" | grep -qF -- "${CONFIRM}"; then
                echo "::error::Refusing to load test production. This is the live shop. To do it deliberately, set confirm_production to its hostname exactly as it appears in base_url - and note that a confirmed run is browse-only."
                exit 1
              fi
              if [ "${CART_VUS}" != "0" ] || [ "${ACCOUNTS}" != "0" ]; then
                echo "::error::Refusing: a production run must be browse-only. total_cart_vus=${CART_VUS} and accounts_per_shard=${ACCOUNTS} must both be 0. Cart and checkout place REAL ORDERS and seeding creates REAL ACCOUNTS in the live database - that is what the 5,005-VU run did, and there is no opt-in for it."
                exit 1
              fi
              echo "PRODUCTION RUN CONFIRMED - browse-only (cart VUs 0, accounts 0)."
              echo "Real customers share this backend for the duration of the run." ;;
          esac
          case "${BASE_URL}" in
            *127.0.0.1*|*localhost*)
              echo "::error::A loopback address cannot work here. Every shard is a separate runner, so 127.0.0.1 is each shard's own empty machine. Use load-test.yml (target=ci-ephemeral) for a self-contained run, or name a host all shards can reach."
              exit 1 ;;
          esac
          case "${BASE_URL}" in
            *[Tt][Oo][Kk][Ee][Nn]=*|*[Pp][Aa][Ss][Ss]*=*|*[Kk][Ee][Yy]=*)
              echo "::error::base_url appears to contain a credential. Pass secrets as secrets, never in the URL."
              exit 1 ;;
          esac
          echo "guard OK"

  # Computes the per-shard VU split once, so every shard agrees on it and the
  # arithmetic is visible in the run log rather than hidden in an expression.
  plan:
    # Gated: nothing is planned or dispatched until the target is allowed.
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      browse_per_shard: ${{ steps.plan.outputs.browse_per_shard }}
      cart_per_shard: ${{ steps.plan.outputs.cart_per_shard }}
      start_at: ${{ steps.plan.outputs.start_at }}
    steps:
      - name: Compute shard plan
        id: plan
        run: |
          SHARDS="${{ inputs.shards }}"
          if [ "$SHARDS" -lt 1 ] || [ "$SHARDS" -gt 20 ]; then
            echo "shards must be between 1 and 20 (GitHub's concurrent job limit)" >&2
            exit 1
          fi

          BROWSE_PER=$(( ${{ inputs.total_browse_vus }} / SHARDS ))
          CART_PER=$(( ${{ inputs.total_cart_vus }} / SHARDS ))

          # A shard carrying 0 VUs would still spin up a runner and report
          # meaningless output, so fail loudly instead.
          if [ "$BROWSE_PER" -lt 1 ]; then
            echo "total_browse_vus / shards is less than 1 - use fewer shards" >&2
            exit 1
          fi

          # Synchronized start. Runners are scheduled independently and can
          # begin up to tens of seconds apart; without a common start time the
          # shards ramp at different moments and the peak is lower and
          # flatter than the requested figure - the run then under-reports
          # what the backend actually withstood.
          START_AT=$(( $(date +%s) + 150 ))

          echo "matrix=$(seq -s, 1 "$SHARDS" | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"
          echo "browse_per_shard=$BROWSE_PER" >> "$GITHUB_OUTPUT"
          echo "cart_per_shard=$CART_PER" >> "$GITHUB_OUTPUT"
          echo "start_at=$START_AT" >> "$GITHUB_OUTPUT"

          echo "### Load plan" >> "$GITHUB_STEP_SUMMARY"
          echo "- Shards: $SHARDS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Browse VUs: ${{ inputs.total_browse_vus }} total -> $BROWSE_PER per shard" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cart VUs: ${{ inputs.total_cart_vus }} total -> $CART_PER per shard" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: ${{ inputs.base_url }}" >> "$GITHUB_STEP_SUMMARY"

  load:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # fail-fast off: one shard dying must not cancel the others, or a
      # single flaky runner destroys the whole measurement.
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # PER SHARD, because reachability is per runner. The combined report is
      # summed across shards, so one shard that cannot reach the target does
      # not fail loudly - it quietly contributes zeroes and drags the average
      # down, which reads as the backend being slow. This is the same
      # diagnostic load-test.yml gained after a run reported 3/3 failures and
      # 0 B transferred as though it were a backend result.
      - name: Preflight - can this shard reach the target?
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          set -uo pipefail
          echo "shard ${{ matrix.shard }} -> ${BASE_URL}"

          # rc must be captured from curl itself. `if ! curl ...; then rc=$?`
          # reads the status of the NEGATED compound, which is always 0 when
          # curl fails - so this step used to print "curl exit 0" next to a
          # timeout and name the wrong cause in the legend below. Observed on
          # a real production run: curl exited 28, the log said 0.
          curl -sS -o /dev/null --max-time 20 \
               -w 'http_status=%{http_code} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s remote=%{remote_ip}\n' \
               "${BASE_URL}/api/health"
          rc=$?
          if [ "${rc}" -ne 0 ]; then
            echo "::error::shard ${{ matrix.shard }} cannot reach ${BASE_URL} (curl exit ${rc}). It would measure nothing and drag the combined result down."
            echo "curl exit 6 = DNS, 7 = connection refused/unreachable, 28 = timeout, 35/60 = TLS."
            echo "A timeout with dns>0 but connect=0 and an empty remote= means the TCP handshake got no answer:"
            echo "this runner's source address is being dropped (firewall, fail2ban, or edge rate limiting), not the host being down."
            exit 1
          fi
          status="$(curl -sS -o /dev/null --max-time 20 -w '%{http_code}' "${BASE_URL}/api/health" || echo 000)"
          if [ "${status}" != "200" ]; then
            echo "::error::${BASE_URL}/api/health answered ${status}, not 200, from shard ${{ matrix.shard }}."
            exit 1
          fi
          echo "shard ${{ matrix.shard }} preflight OK"

      - name: Seed test accounts for this shard
        if: ${{ inputs.accounts_per_shard != '0' }}
        working-directory: load-tests
        # Each shard seeds its OWN accounts from its OWN IP, which is what
        # keeps seeding inside the per-IP auth rate limit while still scaling
        # with shard count.
        run: BASE_URL="${{ inputs.base_url }}" COUNT="${{ inputs.accounts_per_shard }}" node seed-accounts.js

      - uses: grafana/setup-k6-action@v1

      - name: Wait for synchronized start
        run: |
          TARGET=${{ needs.plan.outputs.start_at }}
          NOW=$(date +%s)
          WAIT=$(( TARGET - NOW ))
          if [ "$WAIT" -gt 0 ]; then
            echo "Shard ${{ matrix.shard }} waiting ${WAIT}s so all shards ramp together"
            sleep "$WAIT"
          else
            echo "Shard ${{ matrix.shard }} is ${WAIT#-}s late (setup took longer than the window)."
            echo "Its peak will overlap the others' but the combined peak may be below target."
          fi

      - name: Run k6 shard
        working-directory: load-tests
        env:
          BASE_URL: ${{ inputs.base_url }}
          BROWSE_VUS: ${{ needs.plan.outputs.browse_per_shard }}
          CART_VUS: ${{ needs.plan.outputs.cart_per_shard }}
          RAMP_TIME: ${{ inputs.ramp_time }}
          HOLD_TIME: ${{ inputs.duration }}
        # --summary-export writes machine-readable results so the shards can
        # be added up afterwards; the console summary alone cannot be
        # aggregated across runners.
        run: k6 run --summary-export=summary-shard-${{ matrix.shard }}.json browse-cart-checkout.js

      - name: Upload shard summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary-shard-${{ matrix.shard }}
          path: load-tests/summary-shard-*.json

  aggregate:
    needs: [plan, load]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: k6-summary-shard-*
          merge-multiple: true
          path: summaries

      - name: Combine shard results
        run: |
          python3 - <<'PY'
          import glob, json, os

          files = sorted(glob.glob("summaries/*.json"))
          if not files:
              print("No shard summaries found - every shard failed before k6 ran.")
              raise SystemExit(0)

          total_reqs = 0
          total_failed = 0
          p95s = []
          ok_p95s = []
          dropped = 0
          outcomes = {}
          shards = 0

          for path in files:
              with open(path) as handle:
                  data = json.load(handle)
              metrics = data.get("metrics", {})
              reqs = metrics.get("http_reqs", {})
              failed = metrics.get("http_req_failed", {})
              duration = metrics.get("http_req_duration", {})

              count = reqs.get("count", 0)
              total_reqs += count

              # http_req_failed is a RATE metric, and its JSON shape differs
              # by k6 version. k6 v1.x exports {"passes","fails","value"} with
              # NO "rate" key at all; older builds used "rate". Reading only
              # "rate" with a default of 0 is what made a run where 99.98% of
              # requests failed report an overall error rate of 0.00% - the
              # single worst thing a load-test harness can do, because the
              # result looks like a pass.
              #
              # So: try every known shape, and if none of them yields a
              # number, ABORT rather than assume zero. An unreadable summary
              # is a broken measurement, not a clean one.
              rate = None
              if "value" in failed:
                  rate = failed["value"]
              elif "rate" in failed:
                  rate = failed["rate"]
              elif "passes" in failed and "fails" in failed:
                  denom = failed["passes"] + failed["fails"]
                  rate = (failed["passes"] / denom) if denom else 0.0

              if rate is None and count:
                  raise SystemExit(
                      "Cannot read http_req_failed from %s (keys: %s). Refusing to "
                      "report a failure rate this run cannot substantiate." % (path, sorted(failed)))

              total_failed += (rate or 0.0) * count

              if "p(95)" in duration:
                  p95s.append(duration["p(95)"])

              # p95 over SUCCESSFUL responses only. The headline p95 mixes in
              # failures, and failures are typically fast (a refused
              # connection returns far quicker than real work), so a saturated
              # backend can post a flattering overall p95 while every request
              # that actually completed took ten seconds. This submetric is
              # the number that describes the user's experience.
              ok = metrics.get("http_req_duration{expected_response:true}", {})
              if "p(95)" in ok:
                  ok_p95s.append(ok["p(95)"])

              # Generator health. If the runner could not keep up, the shard
              # is describing itself rather than the target.
              dropped += metrics.get("dropped_iterations", {}).get("count", 0)

              # Outcome census by status class. This is the line that turns
              # "99.89% failed" into an actionable diagnosis: a wall of 429s
              # means the app rejected the load on purpose, 502/503 means the
              # app was unreachable, 5xx means it was broken, and status_0
              # means no response arrived at all. The 10k run could not
              # distinguish these and was therefore undiagnosable from its
              # own output.
              for key in ("status_2xx", "status_3xx", "status_4xx", "status_429",
                          "status_5xx", "status_502", "status_503", "status_504",
                          "status_network_error"):
                  outcomes[key] = outcomes.get(key, 0) + metrics.get(key, {}).get("count", 0)

              shards += 1

          lines = []
          lines.append("### Combined result across %d shard(s)" % shards)
          lines.append("")
          lines.append("| Metric | Value |")
          lines.append("| --- | --- |")
          lines.append("| Total HTTP requests | %d |" % total_reqs)
          lines.append("| Overall error rate | %.2f%% |" %
                       ((total_failed / total_reqs * 100) if total_reqs else 0))
          if p95s:
              # Deliberately reported as a RANGE, not averaged: averaging
              # percentiles across shards is statistically meaningless, and
              # the worst shard is the number that matters.
              lines.append("| p95 latency, all requests (best shard) | %.0f ms |" % min(p95s))
              lines.append("| p95 latency, all requests (WORST shard) | %.0f ms |" % max(p95s))
          if ok_p95s:
              lines.append("| p95 latency, SUCCESSFUL responses (best shard) | %.0f ms |" % min(ok_p95s))
              lines.append("| p95 latency, SUCCESSFUL responses (WORST shard) | %.0f ms |" % max(ok_p95s))
          # Only arrival-rate executors emit dropped_iterations at all, so this
          # reads 0 for a ramping-vus run whether or not the generator coped -
          # absence of the metric is not evidence of a healthy generator. Say
          # so, rather than letting a structural 0 read as a clean result.
          lines.append("| Dropped iterations | %s |" % (
              dropped if dropped else "0 (not emitted by ramping-vus; check 'interrupted iterations' per shard)"))
          lines.append("")

          # Census first - it is the diagnosis, the rates below are the symptom.
          if any(outcomes.values()):
              lines.append("#### Outcome census")
              lines.append("")
              lines.append("| Outcome | Count | Share |")
              lines.append("| --- | --- | --- |")
              labelled = [
                  ("2xx success", "status_2xx"),
                  ("3xx", "status_3xx"),
                  ("4xx total", "status_4xx"),
                  ("  of which 429 (rate limited)", "status_429"),
                  ("5xx total", "status_5xx"),
                  ("  of which 502 (bad gateway)", "status_502"),
                  ("  of which 503 (unavailable)", "status_503"),
                  ("  of which 504 (gateway timeout)", "status_504"),
                  ("No response (timeout/reset/refused)", "status_network_error"),
              ]
              census_total = sum(outcomes.get(k, 0) for _, k in labelled
                                 if k not in ("status_429", "status_502", "status_503", "status_504"))
              for label, key in labelled:
                  n = outcomes.get(key, 0)
                  share = ("%.2f%%" % (n / census_total * 100)) if census_total else "-"
                  lines.append("| %s | %d | %s |" % (label, n, share))
              lines.append("")
          else:
              lines.append("_No outcome census in these summaries - the shards ran a build of "
                           "the script from before status-code instrumentation was added._")
              lines.append("")

          error_pct = (total_failed / total_reqs * 100) if total_reqs else 0
          if error_pct >= 5:
              lines.append("**This run did not measure capacity - it measured saturation.** At this "
                           "error rate the latency figures describe mostly-failed requests and cannot "
                           "be read as response times. Reduce VUs until the error rate is low, then "
                           "raise it until it climbs - that boundary is the actual capacity number.")
              lines.append("")
          if dropped:
              lines.append("**Dropped iterations are non-zero**, so at least one generator was the "
                           "bottleneck. Those shards describe the runner, not the target. Use more "
                           "shards with fewer VUs each.")
              lines.append("")
          lines.append("Per-shard percentiles are a range, not an average - averaging "
                       "percentiles across generators is not meaningful. Judge the run "
                       "by the worst shard.")
          lines.append("")
          lines.append("Cross-check against the target's own metrics (VPS CPU/memory, "
                       "Supabase connection count, /v1/actuator/prometheus) for the same "
                       "window. Without that, a clean result may only mean the load never "
                       "actually arrived.")

          out = "\\n".join(lines)
          print(out)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write(out + "\\n")
          PY
