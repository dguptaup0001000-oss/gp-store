# NOTE: this file assumes the repo root IS the frontend/ folder (matching
# the structure of the zips this project has been shipped in). If your
# actual GitHub repo has frontend/ as a subfolder instead, move this
# .github/ folder to the true repo root and add `working-directory: frontend`
# to every run/step below that doesn't already have one.
#
# What this gives you, with ZERO extra accounts beyond GitHub itself:
# - An APK you can download directly from the Actions run's "Artifacts"
#   section after every push - install it on an Android phone to test.
# - A live, clickable web URL at https://<your-username>.github.io/<repo>/,
#   rebuilt automatically on every push to main.
#
# One-time setup after you push this to GitHub:
# 1. Go to your repo's Settings -> Pages -> Source -> select "GitHub Actions".
#    (Without this one click, the deploy step below has nothing to deploy to.)
# 2. Push to main - the first run creates the live site; every push after
#    that updates it automatically.

name: Build APK and Deploy Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you manually re-trigger a build from the Actions tab without
  # needing a new commit - handy the first time, or after just flipping on
  # the Pages setting above.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned, NOT 'stable' - this project's freezed/json_serializable
          # pins (see pubspec.yaml) transitively cap the `analyzer` package
          # below what current Flutter stable's Dart SDK needs (newer Dart
          # syntax the pinned analyzer's AST visitor has no implementation
          # for - "Missing implementation of visitDotShorthandPropertyAccess"
          # was the actual build_runner failure this caused once Flutter
          # stable moved to Dart 3.13). freezed's 2.x line hard-caps analyzer
          # at <8.0.0 and is unmaintained past 2.5.8, so there is no version
          # of freezed 2.x compatible with a newer Dart SDK - only upgrading
          # to freezed 3.x (a breaking rewrite of every @freezed model in
          # this app) would allow un-pinning this. 3.35.7 is the newest
          # stable release still on Dart 3.9.x, matching what this pinned
          # analyzer chain actually supports. Bump this deliberately, together
          # with a freezed 3.x migration, not by itself.
          flutter-version: '3.35.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate freezed/json_serializable code
        # Required - this project's models rely on generated .freezed.dart
        # and .g.dart part files (see every domain model importing them).
        # The build fails without this step running first.
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        # Static analysis, before the tests. Catches the class of mistake a
        # test suite never sees - an unused import, a dead null-check, an
        # await that was forgotten - and does it in seconds.
        #
        # The payments branch supplied the sharpest example of why it runs
        # BEFORE the APK: checkout_screen.dart used a class it never
        # imported, `flutter test` stayed green because the tests import the
        # service and nothing imports the screen, and the mistake only
        # surfaced ~4 minutes into `assembleRelease` - after an NDK install -
        # as a kernel_snapshot failure. Dart compiles only what a test
        # reaches; the analyzer compiles every library in lib/.
        #
        # Not --fatal-infos: the project carries informational lints that are
        # style opinions rather than defects, and failing the build on those
        # trains everyone to ignore the step.
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        # Before the APK, not after: a red test should stop the build rather
        # than ship an artifact and report the failure alongside it. These are
        # pure Dart unit tests (no device, no emulator), so they cost seconds.
        run: flutter test

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Build Delivery Worker APK
        # A SECOND APK FROM THE SAME PROJECT, via a second entrypoint
        # (lib/worker_main.dart). Flutter compiles only what the entrypoint
        # reaches, so this carries the worker screens, the HTTP client and the
        # token storage - and none of the storefront, cart, checkout or 3D
        # viewer.
        #
        # BUILT FIRST, and it used to be the case that the order was
        # load-bearing: both builds wrote the same app-release.apk, so
        # building the worker second overwrote the customer APK and the job
        # went green shipping the wrong artifact. Splitting per ABI below
        # changes the worker's output names to app-<abi>-release.apk, so the
        # two no longer collide at all. The order is kept because relying on
        # that is a footgun waiting for the day somebody drops --split-per-abi.
        #
        # This is also the ONLY place the worker entrypoint is ever compiled.
        # `flutter analyze` covers its Dart, but analysis is not codegen: a
        # native plugin that fails to link, or a manifest the merger rejects,
        # shows up here and nowhere earlier.
        #
        # --split-per-abi, AND IT IS THE WHOLE SIZE STORY.
        #
        # The measured worker APK was 31.8 MB against the customer app's
        # 35.6 MB - only 3.8 MB apart, despite the worker entrypoint's entire
        # Dart dependency closure being four packages (dio, secure storage,
        # mobile_scanner, flutter) against the customer app's twenty-five.
        # That gap is the proof that the size is NOT Dart: Flutter tree-shakes
        # Dart, but Gradle links every plugin's native code into the one
        # Android module regardless of which entrypoint compiled, so the worker
        # APK carries Firebase, the Cashfree SDK, a WebView, text-to-speech, a
        # thermal printer driver and a speech recogniser it can never reach.
        #
        # A fat APK also carries THREE copies of all of it - armeabi-v7a,
        # arm64-v8a and x86_64 - and a phone installs exactly one. Splitting
        # is not a trade-off: each output has the same code for its own
        # architecture, and only the two it was never going to run are gone.
        # Ship the arm64-v8a one; armeabi-v7a is there for genuinely old
        # handsets, and x86_64 is emulators.
        run: |
          if [ -n "${{ vars.API_BASE_URL }}" ]; then
            flutter build apk --release --split-per-abi -t lib/worker_main.dart --dart-define=API_BASE_URL="${{ vars.API_BASE_URL }}" --dart-define=BUILD_SHA="${GITHUB_SHA::7}"
          else
            flutter build apk --release --split-per-abi -t lib/worker_main.dart --dart-define=BUILD_SHA="${GITHUB_SHA::7}"
          fi
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [ -f "app-$abi-release.apk" ]; then
              mv "app-$abi-release.apk" "gpstore-worker-$abi-release.apk"
            fi
          done

      # THE NUMBER, PRINTED. Every size claim about this app should be
      # checkable from a build log rather than taken on trust, and an APK that
      # quietly grows back is exactly the regression nobody notices.
      - name: Report Worker APK sizes
        run: |
          echo "### Delivery Worker APK sizes" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| APK | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in build/app/outputs/flutter-apk/gpstore-worker-*.apk; do
            [ -f "$f" ] || continue
            size=$(du -h "$f" | cut -f1)
            echo "| $(basename "$f") | $size |" >> "$GITHUB_STEP_SUMMARY"
            echo "$(basename "$f"): $size"
          done

      - name: Upload Delivery Worker APK
        uses: actions/upload-artifact@v4
        with:
          name: gpstore-worker-apk
          path: frontend/build/app/outputs/flutter-apk/gpstore-worker-*.apk

      - name: Build APK
        # Same reasoning as the web build's API_BASE_URL handling below -
        # the app's coded default (10.0.2.2, the Android EMULATOR's
        # localhost alias) is just as unreachable from a real physical
        # phone as it is from a public website. Set the same repo variable
        # (Settings -> Secrets and variables -> Actions -> Variables,
        # name: API_BASE_URL) to your deployed backend's URL once it
        # exists, or this APK will install and open fine but fail on
        # every login/browse attempt.
        #
        # BUILD_SHA (the commit this APK was built from, shown on the
        # Profile screen) exists because "did you actually install the
        # latest APK, or an old one" has repeatedly been the real cause
        # behind reported bugs that were already fixed - this makes it
        # checkable at a glance instead of guessed at from screenshots.
        # --split-per-abi AND --target-platform without android-x64:
        # phones install one ABI. The previous fat APK packed arm64-v8a,
        # armeabi-v7a and x86_64 (the ~73 MB extracted-size audit). x86_64
        # is emulators; Play's AAB (next step) still contains every ABI and
        # serves one per device. Sideload artifacts are arm only.
        run: |
          if [ -n "${{ vars.API_BASE_URL }}" ]; then
            flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --dart-define=API_BASE_URL="${{ vars.API_BASE_URL }}" --dart-define=BUILD_SHA="${GITHUB_SHA::7}"
          else
            flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --dart-define=BUILD_SHA="${GITHUB_SHA::7}"
          fi

      - name: Report customer APK sizes
        run: |
          echo "### Customer APK sizes (split per ABI)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| APK | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            [ -f "$f" ] || continue
            size=$(du -h "$f" | cut -f1)
            echo "| $(basename "$f") | $size |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Build App Bundle
        # What Google Play actually wants. Play splits an .aab per device, so
        # a phone downloads one ABI instead of all three - the APK above
        # carries arm64, armv7 and x86_64 together because a raw APK cannot
        # be split.
        #
        # Built alongside the APK rather than instead of it: the APK is what
        # gets sideloaded for testing, and losing that would mean no way to
        # try a build without going through Play.
        #
        # This step is also what verifies the R8 configuration. minifyEnabled
        # only runs in release, so a missing ProGuard keep rule cannot fail
        # any debug build - it fails here, or it fails on a customer's phone.
        run: |
          if [ -n "${{ vars.API_BASE_URL }}" ]; then
            flutter build appbundle --release --dart-define=API_BASE_URL="${{ vars.API_BASE_URL }}" --dart-define=BUILD_SHA="${GITHUB_SHA::7}"
          else
            flutter build appbundle --release --dart-define=BUILD_SHA="${GITHUB_SHA::7}"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gpstore-release-apk
          path: frontend/build/app/outputs/flutter-apk/app-*-release.apk

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: gpstore-release-aab
          path: frontend/build/app/outputs/bundle/release/app-release.aab

  build-and-deploy-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    # Only deploy the LIVE site from main - a PR branch's preview build
    # still gets built and tested above, it just doesn't overwrite the
    # real public site.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned - see the build-apk job's Set up Flutter step above for
          # why (analyzer/freezed 2.x version incompatibility with newer
          # Dart SDKs). Keep these two jobs' Flutter versions in sync.
          flutter-version: '3.35.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate freezed/json_serializable code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web
        # --base-href must match the GitHub Pages subpath
        # (https://<user>.github.io/<repo>/) or every asset/route request
        # 404s - GitHub Pages serves this repo under its own name, not at
        # the domain root, unless this repo IS named <user>.github.io.
        #
        # API_BASE_URL points the built app at your real, deployed backend.
        # If you haven't set the repo variable yet (see below), this step
        # deliberately falls back to the app's own coded default rather
        # than passing an empty string, which would be worse - an empty
        # --dart-define value still counts as "provided" and would override
        # that sensible fallback with nothing at all. The app's own
        # default (the Android emulator's localhost alias) is unreachable
        # from a public website either way - the site will load and show
        # its UI, but every API call (login, browsing, everything) will
        # fail until you set this. One-time setup: this repo's Settings ->
        # Secrets and variables -> Actions -> Variables tab, name:
        # API_BASE_URL, value: your deployed backend's URL (e.g. from
        # Render) + /v1.
        run: |
          if [ -n "${{ vars.API_BASE_URL }}" ]; then
            flutter build web --release \
              --base-href "/${{ github.event.repository.name }}/" \
              --dart-define=API_BASE_URL="${{ vars.API_BASE_URL }}"
          else
            flutter build web --release \
              --base-href "/${{ github.event.repository.name }}/"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
