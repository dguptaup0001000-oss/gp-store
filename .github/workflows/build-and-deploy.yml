# Canonical production APK + worker APK workflow for the monorepo.
# GitHub Pages lives in deploy-github-pages.yml (push to main only) so this
# workflow has no job that skips on PRs while build-apk is still queued.
#
# Download: Actions run → Artifacts → gpstore-customer-admin-arm64.apk
# (arm64-v8a customer+admin, APP_ENV=production, API
# https://api.gpstore.co.in/v1). Worker is a separate app:
# gpstore-worker-arm64.apk and gpstore-worker-armv7.apk.
# GitHub UI zip size is not the APK size; the job summary prints
# actual bytes, MiB, ABI, and SHA-256.
#
# GITHUB_TOKEN merges do not start `on: push` workflows. After a merge,
# automerge_eligible_pr.py dispatches this workflow on main, and
# workflow_run also starts it when Deploy Production completes successfully.
#
# WHY RUN #420 WAS SKIPPED. build-apk had:
#   github.event_name != 'workflow_run'
#   || (head_branch == 'main' && event != 'pull_request')
# Deploy Production #55 was a pull_request syntax check (28s, success).
# That fired this workflow_run. The job if saw event == pull_request and
# skipped in 0s. The Actions UI still showed main@addea27 because a
# workflow_run listener always runs from the default branch — that is not
# github.ref of the source deploy and must not be used as a filter.
# The job now runs for every successful Deploy Production and packages
# github.event.workflow_run.head_sha. Failed deploys still skip.

# What this gives you, with ZERO extra accounts beyond GitHub itself:
# - An APK you can download directly from the Actions run's "Artifacts"
#   section after every push - install it on an Android phone to test.
# - A live, clickable web URL at https://<your-username>.github.io/<repo>/,
#   rebuilt automatically on every push to main.
#
# Production builds always pass --dart-define=APP_ENV=production.
# Customer applicationId: com.gpstore.app
# Worker applicationId:   com.gpstore.worker
#
# Play upload keystore: CI never invents a keystore and never commits one.
# Pull-request APKs may still be Android Debug signed so sideload artifacts
# stay green. Builds of main (push, workflow_dispatch, or workflow_run whose
# source branch is main) fail closed if ANDROID_KEYSTORE_* is missing — a
# main APK named like production must not be CN=Android Debug. Play AAB
# artifacts are produced only when ANDROID_KEYSTORE_* is set.
# Customer/admin and worker APKs always use explicit per-ABI names.
#
# One-time setup after you push this to GitHub:
# 1. Go to your repo's Settings -> Pages -> Source -> select "GitHub Actions".
#    (Without this one click, the deploy step below has nothing to deploy to.)
# 2. Push to main - the first run creates the live site; every push after
#    that updates it automatically.

name: Build APK and Deploy Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-and-deploy.yml'
      - '.github/scripts/automerge_eligible_pr.py'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full 40-character git SHA to package (empty = this ref / current main)'
        required: false
        default: ''
  # GITHUB_TOKEN merges do not start push workflows. Deploy Production is
  # dispatched after merge; this watches that so every successful deploy
  # still gets a downloadable APK. Do not filter on github.ref here:
  # workflow_run always executes this file from the default branch.
  workflow_run:
    workflows: ["Deploy Production"]
    types: [completed]

concurrency:
  group: gpstore-apk-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    # Push, pull_request, and workflow_dispatch always run.
    # workflow_run runs when the source Deploy Production succeeded.
    # Do not use github.ref. Do not skip solely because the event is
    # workflow_run — that is what skipped #420.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Record workflow_run source
        if: github.event_name == 'workflow_run'
        working-directory: .
        run: |
          set -Eeuo pipefail
          echo "source_event=${{ github.event.workflow_run.event }}"
          echo "source_branch=${{ github.event.workflow_run.head_branch }}"
          echo "source_sha=${{ github.event.workflow_run.head_sha }}"
          echo "source_conclusion=${{ github.event.workflow_run.conclusion }}"

      - name: Resolve commit to package
        id: src
        working-directory: .
        run: |
          set -Eeuo pipefail
          echo "event_name=${GITHUB_EVENT_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${{ inputs.sha }}" ]; then
            SHA="${{ inputs.sha }}"
          else
            SHA="${GITHUB_SHA}"
          fi
          if [ "${#SHA}" -lt 7 ]; then
            echo "::error::Could not resolve a git SHA to package"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Packaging $SHA"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.src.outputs.sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned, NOT 'stable' - this project's freezed/json_serializable
          # pins (see pubspec.yaml) transitively cap the `analyzer` package
          # below what current Flutter stable's Dart SDK needs (newer Dart
          # syntax the pinned analyzer's AST visitor has no implementation
          # for - "Missing implementation of visitDotShorthandPropertyAccess"
          # was the actual build_runner failure this caused once Flutter
          # stable moved to Dart 3.13). freezed's 2.x line hard-caps analyzer
          # at <8.0.0 and is unmaintained past 2.5.8, so there is no version
          # of freezed 2.x compatible with a newer Dart SDK - only upgrading
          # to freezed 3.x (a breaking rewrite of every @freezed model in
          # this app) would allow un-pinning this. 3.35.7 is the newest
          # stable release still on Dart 3.9.x, matching what this pinned
          # analyzer chain actually supports. Bump this deliberately, together
          # with a freezed 3.x migration, not by itself.
          flutter-version: '3.35.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate freezed/json_serializable code
        # Required - this project's models rely on generated .freezed.dart
        # and .g.dart part files (see every domain model importing them).
        # The build fails without this step running first.
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        # Static analysis, before the tests. Catches the class of mistake a
        # test suite never sees - an unused import, a dead null-check, an
        # await that was forgotten - and does it in seconds.
        #
        # The payments branch supplied the sharpest example of why it runs
        # BEFORE the APK: checkout_screen.dart used a class it never
        # imported, `flutter test` stayed green because the tests import the
        # service and nothing imports the screen, and the mistake only
        # surfaced ~4 minutes into `assembleRelease` - after an NDK install -
        # as a kernel_snapshot failure. Dart compiles only what a test
        # reaches; the analyzer compiles every library in lib/.
        #
        # Not --fatal-infos: the project carries informational lints that are
        # style opinions rather than defects, and failing the build on those
        # trains everyone to ignore the step.
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        # Before the APK, not after: a red test should stop the build rather
        # than ship an artifact and report the failure alongside it. These are
        # pure Dart unit tests (no device, no emulator), so they cost seconds.
        run: flutter test

      - name: Verify APK permission policy (no device)
        run: |
          python3 tool/verify_apk_release.py --self-test
          python3 tool/report_apk_artifacts.py --self-test
          python3 ../.github/scripts/resolve_api_base_url.py --self-test

      - name: Resolve production API URL
        # vars.API_BASE_URL is still the retired Render host. Using it as
        # --dart-define makes every login HTTP 404. Always write the Hostinger
        # URL to GITHUB_ENV unless the var is already the canonical /v1 host.
        working-directory: .
        env:
          CANDIDATE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: python3 .github/scripts/resolve_api_base_url.py --github-env

      - name: Detect Play upload keystore
        # There is no keystore in git and CI must not invent one. Pull-request
        # sideload APKs may still be Android Debug signed. A build of main
        # must fail instead of publishing a production-named debug APK.
        # workflow_run always has github.ref = the default branch, so the
        # source branch is workflow_run.head_branch, not GITHUB_REF.
        id: play_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          require_release=0
          if [ "$EVENT_NAME" = "pull_request" ]; then
            require_release=0
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$WORKFLOW_HEAD_BRANCH" = "main" ]; then
              require_release=1
            fi
          elif [ "$GIT_REF" = "refs/heads/main" ]; then
            require_release=1
          fi
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ "$require_release" = "1" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is required for main APK builds. Debug-signed APKs (CN=Android Debug) are not a production artifact. Set repo secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, and ANDROID_KEY_ALIAS. CI will not generate a keystore."
              {
                echo "### Android signing"
                echo ""
                echo "Play upload keystore is **missing** and this is a main build. The job failed closed so a production-named APK is not Android Debug signed."
                echo "Add repo secrets \`ANDROID_KEYSTORE_BASE64\`, \`ANDROID_KEYSTORE_PASSWORD\`, \`ANDROID_KEY_PASSWORD\`, and \`ANDROID_KEY_ALIAS\`."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "::warning::ANDROID_KEYSTORE_BASE64 is unset. Analyze/tests still run. Play-signed APK/AAB artifacts are skipped; sideload APKs will be Android Debug signed."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Android signing"
              echo ""
              echo "Play upload keystore is **not** configured. This pull-request job stays green on analyze, tests, and debug-signed sideload APKs."
              echo "Set repo secrets \`ANDROID_KEYSTORE_BASE64\`, \`ANDROID_KEYSTORE_PASSWORD\`, \`ANDROID_KEY_PASSWORD\`, and \`ANDROID_KEY_ALIAS\` before a main APK can be Play-signed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          missing=0
          for v in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is required when ANDROID_KEYSTORE_BASE64 is set"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Android signing"
            echo ""
            echo "Play upload keystore is configured. Release APK/AAB artifacts must not be Android Debug signed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          PLAY_SIGNING: ${{ steps.play_signing.outputs.enabled }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
            python3 tool/verify_google_services.py android/app/google-services.json
          elif [ "$PLAY_SIGNING" = "true" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 is required for Play-signed artifacts. Do not ship the placeholder google-services.json to Play."
            exit 1
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 unset; using the committed placeholder (push/Crashlytics will not work). Sideload APKs still compile."
            cp android/app/google-services.placeholder.json android/app/google-services.json
          fi

      - name: Install Play upload keystore if configured
        # When ANDROID_KEYSTORE_BASE64 is set, password + alias were already
        # required above. When it is unset, APKs are Android Debug signed and
        # must not be uploaded under Play-ready artifact names.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 unset; APKs will be Android Debug signed."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          umask 077
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" \
            > android/key.properties

      - name: Build Delivery Worker APK
        env:
          ALLOW_DEBUG_RELEASE_SIGNING: ${{ steps.play_signing.outputs.enabled == 'true' && '0' || '1' }}
        # A SECOND APK FROM THE SAME PROJECT, via a second entrypoint
        # (lib/worker_main.dart). Dart tree-shaking drops unused screens, but
        # Gradle still links every plugin in pubspec.yaml. CI therefore builds
        # this target through tool/with_worker_pubspec.sh (pubspec.worker.yaml)
        # so Cashfree/Firebase/WebView/TTS/BLE/speech native code is not
        # packaged. Barcode scanning stays (mobile_scanner, unbundled ML Kit
        # via Play Services). Location stays (geolocator).
        #
        # BUILT FIRST so a later customer assembleRelease cannot overwrite
        # worker artifacts if someone drops --split-per-abi.
        #
        # --split-per-abi --target-platform android-arm,android-arm64: phones
        # install one ABI. x86_64 is emulator-only and is not a Play-delivered
        # worker artifact; build it locally with android-x64 if needed.
        run: |
          chmod +x tool/with_worker_pubspec.sh
          if [ -z "${API_BASE_URL:-}" ] || [[ "$API_BASE_URL" == *onrender.com* ]]; then
            echo "::error::API_BASE_URL must be https://api.gpstore.co.in/v1 (got '${API_BASE_URL:-}')"
            exit 1
          fi
          ./tool/with_worker_pubspec.sh flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            -t lib/worker_main.dart \
            --dart-define=APP_ENV=production \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=BUILD_SHA="${{ steps.src.outputs.short }}"
          cd build/app/outputs/flutter-apk
          if [ ! -f app-arm64-v8a-release.apk ] || [ ! -f app-armeabi-v7a-release.apk ]; then
            echo "::error::Worker --split-per-abi did not emit both ARM APKs."
            ls -la . || true
            exit 1
          fi
          mv -f app-arm64-v8a-release.apk gpstore-worker-arm64.apk
          mv -f app-armeabi-v7a-release.apk gpstore-worker-armv7.apk

      - name: Build Delivery Worker App Bundle
        # Play-only. Skipped when the upload keystore is missing so this job
        # cannot publish a debug-signed AAB under a release name.
        if: steps.play_signing.outputs.enabled == 'true'
        # Play serves one ABI from an AAB. Worker applicationId is
        # com.gpstore.worker (see android/app/build.gradle when
        # GPSTORE_WORKER_SLIM=1). It must not share com.gpstore.app with the
        # customer APK or installing one replaces the other.
        run: |
          chmod +x tool/with_worker_pubspec.sh
          if [ -z "${API_BASE_URL:-}" ] || [[ "$API_BASE_URL" == *onrender.com* ]]; then
            echo "::error::API_BASE_URL must be https://api.gpstore.co.in/v1 (got '${API_BASE_URL:-}')"
            exit 1
          fi
          ./tool/with_worker_pubspec.sh flutter build appbundle --release \
            --target-platform android-arm,android-arm64 \
            -t lib/worker_main.dart \
            --dart-define=APP_ENV=production \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=BUILD_SHA="${{ steps.src.outputs.short }}"
          mkdir -p build/app/outputs/bundle/worker
          mv build/app/outputs/bundle/release/app-release.aab \
            build/app/outputs/bundle/worker/gpstore-worker-release.aab
          echo "### Delivery Worker AAB" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          aab=build/app/outputs/bundle/worker/gpstore-worker-release.aab
          echo "| $(basename "$aab") | $(du -h "$aab" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Delivery Worker App Bundle
        if: steps.play_signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gpstore-worker-aab
          path: frontend/build/app/outputs/bundle/worker/gpstore-worker-release.aab

      - name: Build APK
        env:
          ALLOW_DEBUG_RELEASE_SIGNING: ${{ steps.play_signing.outputs.enabled == 'true' && '0' || '1' }}
        # Same reasoning as the web build's API_BASE_URL handling below -
        # the app's coded default (10.0.2.2, the Android EMULATOR's
        # localhost alias) is just as unreachable from a real physical
        # phone as it is from a public website. Set the same repo variable
        # (Settings -> Secrets and variables -> Actions -> Variables,
        # name: API_BASE_URL) to your deployed backend's URL once it
        # exists, or this APK will install and open fine but fail on
        # every login/browse attempt.
        #
        # BUILD_SHA (the commit this APK was built from, shown on the
        # Profile screen) exists because "did you actually install the
        # latest APK, or an old one" has repeatedly been the real cause
        # behind reported bugs that were already fixed - this makes it
        # checkable at a glance instead of guessed at from screenshots.
        # --split-per-abi AND --target-platform without android-x64:
        # phones install one ABI. The previous fat APK packed arm64-v8a,
        # armeabi-v7a and x86_64 (the ~73 MB extracted-size audit). x86_64
        # is emulators; Play's AAB (next step) still contains every ABI and
        # serves one per device. Sideload artifacts are arm only.
        run: |
          if [ -z "${API_BASE_URL:-}" ] || [[ "$API_BASE_URL" == *onrender.com* ]]; then
            echo "::error::API_BASE_URL must be https://api.gpstore.co.in/v1 (got '${API_BASE_URL:-}')"
            exit 1
          fi
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 \
            --dart-define=APP_ENV=production \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=BUILD_SHA="${{ steps.src.outputs.short }}"

      - name: Name customer APKs and report actual sizes
        # arm64-v8a is the production phone APK. armeabi-v7a is legacy 32-bit
        # only, uploaded under its own name so it is not mistaken for a bundle.
        # Do not copy the same file to a second name for upload.
        env:
          PACKAGE_SHA: ${{ steps.src.outputs.sha }}
          PACKAGE_SHORT: ${{ steps.src.outputs.short }}
        run: |
          set -Eeuo pipefail
          OUT=build/app/outputs/flutter-apk
          if [ ! -f "$OUT/app-arm64-v8a-release.apk" ] || [ ! -f "$OUT/app-armeabi-v7a-release.apk" ]; then
            echo "::error::Customer --split-per-abi did not emit both ARM APKs."
            ls -la "$OUT" || true
            exit 1
          fi
          mv -f "$OUT/app-arm64-v8a-release.apk" "$OUT/gpstore-customer-admin-arm64.apk"
          mv -f "$OUT/app-armeabi-v7a-release.apk" "$OUT/gpstore-customer-admin-armv7.apk"
          VERSION="$(python3 -c "import pathlib,re; t=pathlib.Path('pubspec.yaml').read_text(); m=re.search(r'^version:\\s*(\\S+)', t, re.M); print(m.group(1) if m else 'unknown')")"
          python3 tool/report_apk_artifacts.py "$OUT" "$PACKAGE_SHA" "$PACKAGE_SHORT" "$VERSION"

      - name: Verify APK signatures and zip alignment
        # assembleRelease already signs (debug key unless key.properties exists)
        # and zip-aligns. This step fails the job if an artifact is actually
        # unsigned or unaligned. It does not re-sign. When a Play keystore is
        # configured, a debug signer is a hard failure so Play-bound artifacts
        # cannot ship unsigned-for-Play. Without a keystore, debug signing is
        # expected for sideload-only APKs.
        env:
          REQUIRE_RELEASE_SIGNING: ${{ steps.play_signing.outputs.enabled == 'true' && '1' || '0' }}
        run: |
          chmod +x tool/verify_apk_release.py
          python3 tool/verify_apk_release.py \
            build/app/outputs/flutter-apk/gpstore-worker-arm64.apk \
            build/app/outputs/flutter-apk/gpstore-worker-armv7.apk \
            build/app/outputs/flutter-apk/gpstore-customer-admin-arm64.apk \
            build/app/outputs/flutter-apk/gpstore-customer-admin-armv7.apk

      - name: Build App Bundle
        if: steps.play_signing.outputs.enabled == 'true'
        # What Google Play actually wants. Play splits an .aab per device, so
        # a phone downloads one ABI instead of all three - the APK above
        # carries arm64, armv7 and x86_64 together because a raw APK cannot
        # be split.
        #
        # Built alongside the APK rather than instead of it: the APK is what
        # gets sideloaded for testing, and losing that would mean no way to
        # try a build without going through Play.
        #
        # This step is also what verifies the R8 configuration. minifyEnabled
        # only runs in release, so a missing ProGuard keep rule cannot fail
        # any debug build - it fails here, or it fails on a customer's phone.
        # Skipped when the upload keystore is missing so CI cannot upload a
        # debug-signed AAB as gpstore-release-aab.
        run: |
          if [ -z "${API_BASE_URL:-}" ] || [[ "$API_BASE_URL" == *onrender.com* ]]; then
            echo "::error::API_BASE_URL must be https://api.gpstore.co.in/v1 (got '${API_BASE_URL:-}')"
            exit 1
          fi
          flutter build appbundle --release \
            --dart-define=APP_ENV=production \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=BUILD_SHA="${{ steps.src.outputs.short }}"

      - name: Upload customer+admin ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: gpstore-customer-admin-arm64.apk
          path: |
            frontend/build/app/outputs/flutter-apk/gpstore-customer-admin-arm64.apk
            frontend/build/app/outputs/flutter-apk/gpstore-customer-admin-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload customer+admin ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: gpstore-customer-admin-armv7.apk
          path: |
            frontend/build/app/outputs/flutter-apk/gpstore-customer-admin-armv7.apk
            frontend/build/app/outputs/flutter-apk/gpstore-customer-admin-armv7.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload worker ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: gpstore-worker-arm64.apk
          path: |
            frontend/build/app/outputs/flutter-apk/gpstore-worker-arm64.apk
            frontend/build/app/outputs/flutter-apk/gpstore-worker-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload worker ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: gpstore-worker-armv7.apk
          path: |
            frontend/build/app/outputs/flutter-apk/gpstore-worker-armv7.apk
            frontend/build/app/outputs/flutter-apk/gpstore-worker-armv7.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload App Bundle
        if: steps.play_signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gpstore-release-aab
          path: frontend/build/app/outputs/bundle/release/app-release.aab

