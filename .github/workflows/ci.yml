# Canonical backend CI for this monorepo. Job run steps use
# working-directory: backend. Artifact paths are repo-relative
# (backend/target/...). Do not copy this file into backend/.github.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A REAL Postgres, provided by GitHub Actions - this is exactly what
    # Termux couldn't give us, and it's why BackendApplicationTests.contextLoads
    # can finally pass here even though it couldn't run locally on-device.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gpstore_test
          POSTGRES_USER: gpstore
          POSTGRES_PASSWORD: gpstore_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # spring.cache.type=redis and the rate limiter (config.RateLimitFilter)
      # both need a real Redis to connect to - the Spring context itself
      # would likely still boot without one (Lettuce connects lazily), but a
      # real instance here means the same test run actually exercises the
      # real Redis-backed code path instead of relying on that assumption.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Refuse tracked secret files
        working-directory: .
        run: |
          set -Eeuo pipefail
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::A .env file is tracked. Secrets must stay out of git."
            exit 1
          fi
          if git ls-files | grep -Ei '(^|/)google-services\.json$|(^|/).+\.p12$|(^|/).+\.jks$|serviceAccountKey.*\.json$'; then
            echo "::error::A credential file is tracked."
            exit 1
          fi
          echo "No tracked .env or credential files."

      - name: Refuse non-loopback Compose publishes of 5432/6379/8081
        working-directory: .
        run: |
          set -Eeuo pipefail
          python3 -m py_compile .github/scripts/check_compose_published_ports.py
          python3 .github/scripts/test_check_compose_published_ports.py
          python3 .github/scripts/check_compose_published_ports.py .

      - name: Check Redis secret scripts
        run: |
          sh -n docker/redis/docker-entrypoint.sh
          sh -n docker-entrypoint.sh
          python3 docker/redis/test_materialize_password_file.py
          sh -n docker/backup/backup.sh
          bash -n ../deploy/production/backup-offbox-sync.sh
          bash -n ../deploy/production/offbox-pull-from-vps.sh
          bash -n ../deploy/production/offbox-decrypt-restore.sh
          bash -n ../deploy/production/offbox-gpg-roundtrip.sh
          bash -n ../deploy/production/evaluate-backup-status.sh
          bash -n ../deploy/production/evaluate-offbox-result.sh
          bash -n ../deploy/production/backup-restore-drill.sh
          bash -n ../deploy/production/harden-ssh.sh
          bash -n ../deploy/production/disk-guard.sh
          bash -n ../deploy/production/prune-backend-images.sh
          chmod +x ../deploy/production/test_harden_ssh.sh ../deploy/production/test_disk_guard.sh ../deploy/production/test_prune_backend_images.sh
          ../deploy/production/test_harden_ssh.sh
          ../deploy/production/test_disk_guard.sh
          ../deploy/production/test_prune_backend_images.sh
          python3 ../deploy/cloudflare/test_r2_image_worker.py
          chmod +x docker/backup/test_backup_health.sh
          ./docker/backup/test_backup_health.sh

      # Schema comes from Flyway, not Hibernate auto-DDL. Wipe, bootstrap
      # (Hibernate creates domain tables V2+ assume exist, then Flyway),
      # then verify with ddl-auto=validate so CI cannot accept a column
      # Hibernate invented that production (validate) does not have.
      - name: Wipe public schema so verify starts from Flyway
        run: |
          docker run --rm --network=host -e PGPASSWORD=gpstore_test_password postgres:17 \
            psql -h localhost -U gpstore -d gpstore_test -c \
            "DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public; GRANT ALL ON SCHEMA public TO gpstore;"

      - name: Bootstrap schema with Flyway
        env:
          DB_URL: jdbc:postgresql://localhost:5432/gpstore_test
          DB_USERNAME: gpstore
          DB_PASSWORD: gpstore_test_password
          JWT_SECRET: ci-test-secret-not-for-real-use-1234567890123456789012345
          DDL_AUTO: update
          FLYWAY_ENABLED: 'true'
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: ./mvnw -B test -Pschema-bootstrap -Dtest=EmptyDatabaseBootstrapTest -DexcludedGroups=

      - name: Build and run tests
        env:
          DB_URL: jdbc:postgresql://localhost:5432/gpstore_test
          DB_USERNAME: gpstore
          DB_PASSWORD: gpstore_test_password
          JWT_SECRET: ci-test-secret-not-for-real-use-1234567890123456789012345
          DDL_AUTO: validate
          FLYWAY_ENABLED: 'true'
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: ./mvnw -B clean verify

      # WHAT ACTUALLY FAILED, at the end of the log where it can be found.
      #
      # Postgres and Redis service-container logs are dumped at job teardown,
      # and they are thousands of lines. They bury Maven's own summary so
      # completely that reading the tail of a failed run shows only database
      # chatter - which is how a red build ends up diagnosed by guesswork.
      # Surefire has already written the answer to XML; this prints it last.
      - name: Name the failing tests
        if: failure()
        working-directory: backend
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          bad = []
          for path in glob.glob("target/surefire-reports/*.xml"):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter("testcase"):
                  for kind in ("failure", "error"):
                      node = case.find(kind)
                      if node is None:
                          continue
                      message = (node.get("message") or "").strip().splitlines()
                      bad.append(
                          f"{kind.upper()}  {case.get('classname')}.{case.get('name')}\n"
                          f"        {message[0] if message else node.get('type') or ''}"
                      )
          print("=" * 70)
          if bad:
              print(f"{len(bad)} failing test(s):")
              for line in bad:
                  print(line)
          else:
              print("No failing testcase in surefire XML - the failure is not a")
              print("test body. Look at the Maven step itself (compile, enforcer,")
              print("a plugin, or the JVM crashing).")
          print("=" * 70)
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

      - name: Upload HTTP concurrent load report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-concurrent-load-report
          path: backend/target/http-concurrent-load-report.json
          if-no-files-found: ignore

  # Flyway against a CLEAN database. The job above deliberately sets
  # FLYWAY_ENABLED=false and builds the schema with ddl-auto=update, so it
  # never executes db/migration/V*.sql. This job is the proof those files
  # still apply: empty Postgres, Hibernate creates domain tables, Flyway
  # runs V2 through current, then a second boot with ddl-auto=validate.
  #
  # There is no V1 file (baseline-on-migrate). Do not add one — production
  # history already starts at V2.
  #
  # Does not change production environment variables.
  schema-migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gpstore_schema_bootstrap
          POSTGRES_USER: gpstore
          POSTGRES_PASSWORD: gpstore_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history and every branch ref. The migration rehearsal below
          # needs the merge base with main to know which migrations are new,
          # and needs origin/main itself to build the schema production is
          # running today. A shallow checkout has neither.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Wipe public schema so this job always starts empty
        run: |
          docker run --rm --network=host -e PGPASSWORD=gpstore_test_password postgres:17 \
            psql -h localhost -U gpstore -d gpstore_schema_bootstrap -c \
            "DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public; GRANT ALL ON SCHEMA public TO gpstore;"

      - name: Bootstrap empty database (ddl-auto=update, Flyway on)
        env:
          DB_URL: jdbc:postgresql://localhost:5432/gpstore_schema_bootstrap
          DB_USERNAME: gpstore
          DB_PASSWORD: gpstore_test_password
          JWT_SECRET: ci-test-secret-not-for-real-use-1234567890123456789012345
          DDL_AUTO: update
          FLYWAY_ENABLED: 'true'
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: ./mvnw -B test -Pschema-bootstrap -Dtest=EmptyDatabaseBootstrapTest -DexcludedGroups=

      - name: Validate Hibernate schema against migrated database
        env:
          DB_URL: jdbc:postgresql://localhost:5432/gpstore_schema_bootstrap
          DB_USERNAME: gpstore
          DB_PASSWORD: gpstore_test_password
          JWT_SECRET: ci-test-secret-not-for-real-use-1234567890123456789012345
          DDL_AUTO: validate
          FLYWAY_ENABLED: 'true'
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: ./mvnw -B test -Pschema-bootstrap -Dtest=ProductionSchemaValidateTest -DexcludedGroups=

      # ------------------------------------------------------------------
      # THE REHEARSAL THE SHOP DOES NOT OTHERWISE GET.
      #
      # Everything above proves migrations APPLY: from empty, in order, with
      # Hibernate validating the result. What it cannot prove is that a
      # migration survives meeting DATA - a NOT NULL with no default on a
      # table that already has rows, a unique index over a column that already
      # has duplicates, a narrowed type existing values do not fit. All of
      # those pass against an empty database and fail against the shop's.
      #
      # There is no staging environment, so production is otherwise the first
      # place a migration ever meets a real row. This builds the schema as it
      # is DEPLOYED TODAY (from origin/main), puts a customer, an order, a
      # payment and a worker in it, and only then applies the migrations this
      # branch adds - which is exactly what the next deploy will do.
      #
      # Skips itself when a branch adds no migrations, so it costs nothing on
      # the majority of changes.
      # ------------------------------------------------------------------
      - name: Are there new migrations to rehearse?
        id: newmig
        # The job's default working directory is backend/, but a git pathspec
        # resolves relative to the working directory - so this has to run from
        # the repository root or it would match nothing and skip forever.
        working-directory: .
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          NEW="$(git diff --name-only origin/main...HEAD -- \
            backend/src/main/resources/db/migration/ | grep '\.sql$' || true)"
          if [ -z "$NEW" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No new migrations on this branch - nothing to rehearse."
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "New migrations to rehearse against existing rows:"
            echo "$NEW"
          fi

      - name: Build the schema as production has it today
        if: steps.newmig.outputs.found == 'true'
        working-directory: .
        env:
          DB_URL: jdbc:postgresql://localhost:5432/gpstore_rehearsal
          DB_USERNAME: gpstore
          DB_PASSWORD: gpstore_test_password
          JWT_SECRET: ci-test-secret-not-for-real-use-1234567890123456789012345
          DDL_AUTO: update
          FLYWAY_ENABLED: 'true'
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          set -Eeuo pipefail
          docker run --rm --network=host -e PGPASSWORD=gpstore_test_password postgres:17 \
            psql -h localhost -U gpstore -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS gpstore_rehearsal;" -c "CREATE DATABASE gpstore_rehearsal;"
          # A worktree of origin/main, built and bootstrapped on its own. The
          # entities matter as much as the scripts: ddl-auto=update creates
          # tables from THIS branch's entities, so bootstrapping here rather
          # than in the worktree would hand the new migration a schema that
          # already had its columns - and rehearse nothing.
          git worktree add /tmp/prev-release origin/main
          cd /tmp/prev-release/backend
          ./mvnw -B test -Pschema-bootstrap -Dtest=EmptyDatabaseBootstrapTest -DexcludedGroups=

      - name: Put a shop's worth of rows in it
        if: steps.newmig.outputs.found == 'true'
        # Repo root: the -v mount below is resolved from $PWD.
        working-directory: .
        run: |
          set -Eeuo pipefail
          chmod +x deploy/production/seed-rehearsal-rows.sh
          docker run --rm --network=host -e PGPASSWORD=gpstore_test_password \
            -v "$PWD/deploy/production/seed-rehearsal-rows.sh:/seed.sh:ro" \
            postgres:17 /bin/sh /seed.sh localhost 5432 gpstore gpstore_rehearsal

      - name: Apply this branch's migrations to it
        if: steps.newmig.outputs.found == 'true'
        env:
          DB_URL: jdbc:postgresql://localhost:5432/gpstore_rehearsal
          DB_USERNAME: gpstore
          DB_PASSWORD: gpstore_test_password
          JWT_SECRET: ci-test-secret-not-for-real-use-1234567890123456789012345
          # validate, exactly as production runs. If the new migration leaves
          # the schema disagreeing with the entities, this fails here instead
          # of on the shop.
          DDL_AUTO: validate
          FLYWAY_ENABLED: 'true'
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: ./mvnw -B test -Pschema-bootstrap -Dtest=ProductionSchemaValidateTest -DexcludedGroups=

      - name: The rows must still be there
        if: steps.newmig.outputs.found == 'true'
        run: |
          set -Eeuo pipefail
          # A migration that applies cleanly but blanks existing data is worse
          # than one that fails: the deploy goes green and the shop finds out
          # later.
          docker run --rm --network=host -e PGPASSWORD=gpstore_test_password postgres:17 \
            psql -h localhost -U gpstore -d gpstore_rehearsal -v ON_ERROR_STOP=1 -Atc "
              SELECT CASE WHEN
                (SELECT COUNT(*) FROM customers WHERE email = 'rehearsal@example.com') = 1
                AND (SELECT COUNT(*) FROM orders WHERE order_number LIKE 'REHEARSAL-%') = 2
                AND (SELECT COUNT(*) FROM delivery_partners
                     WHERE mobile IN ('9000000002', '9000000003')) = 2
                AND (SELECT p.amount FROM payments p JOIN orders o ON o.id = p.order_id
                     WHERE o.order_number = 'REHEARSAL-1') = 499.00
                AND (SELECT p.payment_status FROM payments p JOIN orders o ON o.id = p.order_id
                     WHERE o.order_number = 'REHEARSAL-2') = 'COD_PENDING'
              THEN 'rows survived' ELSE 'DATA LOST' END;" | tee /tmp/rehearsal.txt
          grep -q 'rows survived' /tmp/rehearsal.txt

      - name: Backup and restore drill
        run: |
          set -Eeuo pipefail
          chmod +x docker/backup/backup.sh ../deploy/production/backup-restore-drill.sh
          mkdir -p /tmp/gp-backups
          docker run --rm --network=host \
            -e PGHOST=localhost -e PGPORT=5432 \
            -e PGUSER=gpstore -e PGDATABASE=gpstore_schema_bootstrap \
            -e PGPASSWORD=gpstore_test_password \
            -e BACKUP_DIR=/backups \
            -v /tmp/gp-backups:/backups \
            -v "$PWD/docker/backup/backup.sh:/backup.sh:ro" \
            postgres:17 \
            /bin/sh /backup.sh once
          # Do not `ls gpstore-*.dump gpstore-*.sql.gz`: GNU ls exits 2 when
          # the sql.gz glob matches nothing, and pipefail aborts before restore.
          DUMP="$(find /tmp/gp-backups -maxdepth 1 \( -name 'gpstore-*.dump' -o -name 'gpstore-*.sql.gz' \) -type f -printf '%T@ %p\n' | sort -nr | awk '{print $2; exit}')"
          test -n "$DUMP"
          echo "Restore drill using $DUMP"
          docker run --rm --network=host \
            -e PGPASSWORD=gpstore_test_password \
            -v /tmp/gp-backups:/backups \
            -v "$PWD/../deploy/production/backup-restore-drill.sh:/drill.sh:ro" \
            postgres:17 \
            /bin/sh /drill.sh "/backups/$(basename "$DUMP")" localhost 5432 gpstore gpstore_restore_probe gpstore_test_password

      - name: Encrypted off-box roundtrip restore
        run: |
          set -Eeuo pipefail
          chmod +x ../deploy/production/offbox-gpg-roundtrip.sh \
            ../deploy/production/offbox-decrypt-restore.sh \
            ../deploy/production/evaluate-offbox-result.sh \
            ../deploy/production/backup-restore-drill.sh
          DUMP="$(find /tmp/gp-backups -maxdepth 1 \( -name 'gpstore-*.dump' -o -name 'gpstore-*.sql.gz' \) -type f -printf '%T@ %p\n' | sort -nr | awk '{print $2; exit}')"
          test -n "$DUMP"
          ROUND="/tmp/gp-backups/roundtrip"
          mkdir -p "$ROUND"
          ../deploy/production/offbox-gpg-roundtrip.sh "$DUMP" "$ROUND/decrypted.dump" "$ROUND/encrypted.dump.gpg"
          test -s "$ROUND/encrypted.dump.gpg"
          test -s "$ROUND/decrypted.dump"
          # Prove decrypt-restore.sh with a job-ephemeral passphrase (not the
          # production secret, which this job must not possess).
          PASSFILE="$(mktemp)"
          openssl rand -base64 32 > "$PASSFILE"
          chmod 600 "$PASSFILE"
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase-file "$PASSFILE" \
            -o "$ROUND/ci.dump.gpg" "$DUMP"
          cp "${DUMP}.sha256" "$ROUND/ci.dump.sha256"
          RESULT_FILE=/tmp/gp-backups/offbox-result.txt
          BACKUP_GPG_PASSPHRASE="$(cat "$PASSFILE")" RESULT_FILE="$RESULT_FILE" \
            ../deploy/production/offbox-decrypt-restore.sh \
            "$ROUND/ci.dump.gpg" localhost 5432 gpstore gpstore_offbox_probe gpstore_test_password
          rm -f "$PASSFILE"
          bash ../deploy/production/evaluate-offbox-result.sh "$RESULT_FILE"
          echo "CI encrypted off-box isolate-restore passed."

      # ------------------------------------------------------------------
      # THE PATH NOBODY REHEARSES, REHEARSED.
      #
      # Everything above proves a backup can be restored into an ISOLATED
      # database - which is the drill, and is right to refuse production.
      # The consequence was that the one path that matters when the server is
      # actually gone, restoring into the real database on a replacement box,
      # had no script and no test: eight manual steps out of
      # DISASTER_RECOVERY.md, performed once, at whatever hour the box died.
      #
      # This runs recover-onto-new-vps.sh the way an operator would, against a
      # database seeded with a shop's worth of rows, and checks the rows came
      # back. It also checks the two guards HOLD, because a recovery script
      # that will overwrite a live shop is worse than no script at all.
      # ------------------------------------------------------------------
      - name: Recovery onto a replacement server
        working-directory: .
        run: |
          set -Eeuo pipefail
          chmod +x deploy/production/recover-onto-new-vps.sh \
                   deploy/production/seed-rehearsal-rows.sh

          # The guards first, with no database in reach at all.
          RECOVER_SELFTEST=1 deploy/production/recover-onto-new-vps.sh

          # MATCHING CLIENT TOOLS, and this is the point rather than a
          # workaround. The runner ships postgresql-client-16; the database is
          # postgres:17, so the dump is written by pg_dump 17 and the runner's
          # pg_restore 16 cannot read it - it reports "unsupported version in
          # file header", which reads like a corrupt backup and is not.
          #
          # That is exactly what a replacement VPS looks like: a fresh Ubuntu
          # installs whatever client its release ships, a major version behind
          # the server the shop runs. So the drill installs the matching
          # client the way a real recovery has to, and the script now names
          # the mismatch instead of letting pg_restore be cryptic about it.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          PGDG_KEY=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          PGDG_LINE="deb [signed-by=$PGDG_KEY] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main"
          echo "$PGDG_LINE" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # Named up front so any future failure in this step explains itself
          # rather than needing the postgres container's log to diagnose.
          echo "pg_restore: $(pg_restore --version)"
          echo "pg_dump:    $(pg_dump --version)"

          export PGPASSWORD=gpstore_test_password
          PSQL=(docker run --rm --network=host -e PGPASSWORD=gpstore_test_password postgres:17)

          "${PSQL[@]}" psql -h localhost -U gpstore -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS gpstore_dr_scratch;" -c "CREATE DATABASE gpstore_dr_scratch;" \
            -c "DROP DATABASE IF EXISTS gpstore_dr_replacement;" -c "CREATE DATABASE gpstore_dr_replacement;"

          # A source database with the real schema and a shop's worth of rows.
          #
          # WITH DATA, not pg_dump -s. A schema-only copy leaves
          # flyway_schema_history EMPTY, and the recovery script rejects a
          # restore whose schema history is missing - correctly, because that
          # is what a half-restored database looks like. Verified rather than
          # assumed: a -s dump of a live database reports schema version
          # "none", which is exactly the guard's failure condition.
          "${PSQL[@]}" pg_dump -h localhost -U gpstore -d gpstore_schema_bootstrap \
            > /tmp/dr-schema.sql
          docker run --rm --network=host -e PGPASSWORD=gpstore_test_password \
            -v /tmp/dr-schema.sql:/schema.sql:ro postgres:17 \
            psql -h localhost -U gpstore -d gpstore_dr_scratch -v ON_ERROR_STOP=1 -q -f /schema.sql
          docker run --rm --network=host -e PGPASSWORD=gpstore_test_password \
            -v "$PWD/deploy/production/seed-rehearsal-rows.sh:/seed.sh:ro" postgres:17 \
            /bin/sh /seed.sh localhost 5432 gpstore gpstore_dr_scratch

          # The encrypted off-box artifact, with a job-ephemeral passphrase -
          # this job must never possess the production one.
          mkdir -p /tmp/dr
          docker run --rm --network=host -e PGPASSWORD=gpstore_test_password \
            -v /tmp/dr:/out postgres:17 \
            pg_dump -h localhost -U gpstore -Fc -d gpstore_dr_scratch -f /out/gpstore-drill.dump
          ( cd /tmp/dr && sha256sum gpstore-drill.dump > gpstore-drill.dump.sha256 )
          PASSFILE="$(mktemp)"; chmod 600 "$PASSFILE"
          openssl rand -base64 32 > "$PASSFILE"
          gpg --batch --yes --quiet --symmetric --cipher-algo AES256 \
            --pinentry-mode loopback --passphrase-file "$PASSFILE" \
            -o /tmp/dr/gpstore-drill.dump.gpg /tmp/dr/gpstore-drill.dump
          rm -f /tmp/dr/gpstore-drill.dump

          # An .env with the shape the script checks for. No real secret:
          # the script confirms keys are PRESENT and never reads their values.
          printf 'DB_NAME=gpstore\nDB_USERNAME=gpstore\nDB_PASSWORD=gpstore_test_password\nJWT_SECRET=ci-not-a-real-secret\n' \
            > /tmp/dr/env

          # GUARD 1: it must refuse without the acknowledgement.
          if BACKEND_ENV_FILE=/tmp/dr/env BACKUP_GPG_PASSPHRASE_FILE="$PASSFILE" \
               deploy/production/recover-onto-new-vps.sh /tmp/dr/gpstore-drill.dump.gpg \
               localhost 5432 gpstore gpstore_dr_replacement; then
            echo "::error::recovery ran without the acknowledgement"; exit 1
          fi

          # The real thing.
          I_HAVE_LOST_THE_PRODUCTION_SERVER=yes \
          BACKEND_ENV_FILE=/tmp/dr/env BACKUP_GPG_PASSPHRASE_FILE="$PASSFILE" \
            deploy/production/recover-onto-new-vps.sh /tmp/dr/gpstore-drill.dump.gpg \
            localhost 5432 gpstore gpstore_dr_replacement

          # GUARD 2: the target now holds orders, so a second run must refuse.
          if I_HAVE_LOST_THE_PRODUCTION_SERVER=yes \
             BACKEND_ENV_FILE=/tmp/dr/env BACKUP_GPG_PASSPHRASE_FILE="$PASSFILE" \
               deploy/production/recover-onto-new-vps.sh /tmp/dr/gpstore-drill.dump.gpg \
               localhost 5432 gpstore gpstore_dr_replacement; then
            echo "::error::recovery overwrote a database that had orders in it"; exit 1
          fi

          rm -f "$PASSFILE"

          # The shop's rows have to actually be there. A restore that exits 0
          # over an empty schema looks like success everywhere except the data.
          "${PSQL[@]}" psql -h localhost -U gpstore -d gpstore_dr_replacement \
            -v ON_ERROR_STOP=1 -Atc "
              SELECT CASE WHEN
                (SELECT COUNT(*) FROM customers WHERE email = 'rehearsal@example.com') = 1
                AND (SELECT COUNT(*) FROM orders WHERE order_number LIKE 'REHEARSAL-%') = 2
                AND (SELECT COUNT(*) FROM payments p JOIN orders o ON o.id = p.order_id
                     WHERE o.order_number LIKE 'REHEARSAL-%') = 2
                AND (SELECT COUNT(*) FROM delivery_partners
                     WHERE mobile IN ('9000000002', '9000000003')) = 2
                AND (SELECT COUNT(*) FROM flyway_schema_history) > 0
              THEN 'shop recovered' ELSE 'DATA MISSING' END;" | tee /tmp/dr/verdict.txt
          grep -q 'shop recovered' /tmp/dr/verdict.txt

          # No plaintext copy of the shop may survive the drill.
          if find /tmp/dr -name '*.dump' -not -name '*.gpg' | grep -q .; then
            echo "::error::a plaintext dump was left behind"; exit 1
          fi
          echo "Recovery onto a replacement server: verified end to end."

      - name: Upload schema-migrate test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-migrate-surefire-reports
          path: backend/target/surefire-reports/

  # THE ONLY JOB THAT COMPILES DART BEFORE A MERGE.
  #
  # It exists because of a specific failure. build-apk runs analyze, the
  # Flutter tests AND three release builds, and auto-merge deliberately
  # IGNORES it - a missing Play keystore must not block a backend fix. The
  # side effect nobody noticed is that ignoring build-apk ignored the only
  # check that compiles the app at all, so no Dart was gated by anything:
  # PR #153 merged with a failing Flutter test, and main carried a leaked
  # timer until #154.
  #
  # Requiring build-apk instead would have fixed that and broken the original
  # rule - and cost every merge sixteen minutes, which is what three signed
  # release builds take. So the two concerns are separated here rather than
  # traded off: correctness of the code (fast, hermetic, no secrets) is
  # required; producing the release artifact (slow, needs a keystore) stays
  # ignored.
  #
  # Deliberately duplicates build-apk's Flutter setup instead of sharing it.
  # The alternative is making the packaging job depend on this one, which
  # serialises sixteen minutes behind two and delays the artifact for no
  # correctness gain - these run in parallel, and the duplication is four
  # lines with a pinned version that a test asserts stays in step.
  flutter-checks:
    name: flutter-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Must match build-and-deploy.yml. See the long comment there for
          # why this is pinned rather than 'stable' (freezed 2.x caps the
          # analyzer below what current stable's Dart needs).
          flutter-version: '3.35.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate freezed/json_serializable code
        # Every domain model is a .freezed.dart/.g.dart part file, and those
        # are gitignored - without this, analyze fails on the whole app
        # rather than on anything a person wrote.
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        # Catches what a test suite never sees: an unused import, a dead
        # null-check, a class used but never imported. The analyzer compiles
        # every library in lib/; `flutter test` compiles only what a test
        # reaches.
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

  build-and-push-image:
    needs: [build-and-test, schema-migrate]
    runs-on: ubuntu-latest
    # Do not put github.ref in this if: GitHub treats it as statically false
    # on PRs and skips immediately while build-and-test is still queued,
    # which aborts the whole workflow as startup_failure.
    if: |
      always() &&
      needs.build-and-test.result == 'success' &&
      needs.schema-migrate.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Skip GHCR publish on pull requests
        if: github.ref != 'refs/heads/main'
        run: echo "Not publishing GHCR images from a pull request."

      - name: Checkout code
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        if: github.ref == 'refs/heads/main'
        id: image
        run: echo "name=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

  automerge:
    name: Auto-merge eligible PR
    # flutter-checks is here because auto-merge previously waited only for the
    # two backend jobs and merged while the app's own tests were still
    # running - #153 merged 27 seconds before its Flutter failure was
    # reported. Waiting for it costs about two minutes and is the difference
    # between gating the Dart in this repository and not gating it at all.
    needs: [build-and-test, schema-migrate, flutter-checks]
    # Job if must not mention pull_request vs push: a statically false if
    # skips immediately and aborts sibling jobs that are still queued.
    #
    # needs['flutter-checks'], NOT needs.flutter-checks: a hyphen inside a
    # property path is parsed as SUBTRACTION by the expression language, so
    # the dotted form evaluates to a number and the condition silently stops
    # gating anything. Index syntax is the only correct way to reference a
    # hyphenated job id.
    if: |
      always() &&
      needs.build-and-test.result == 'success' &&
      needs.schema-migrate.result == 'success' &&
      needs['flutter-checks'].result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Enable native auto-merge or merge after CI
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          python3 -m py_compile .github/scripts/automerge_eligible_pr.py
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull_request event; nothing to merge."
            exit 0
          fi
          python3 .github/scripts/automerge_eligible_pr.py --pr "${{ github.event.pull_request.number }}" --ci-already-green --wait-seconds 60
