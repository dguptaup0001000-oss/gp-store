# NOTE: this file assumes the repo root IS the backend/ folder (matching the
# structure of the zip this came in). If your actual GitHub repo has backend/
# as a subfolder instead, move this .github/ folder to the true repo root
# and add `working-directory: backend` to the run steps below.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A REAL Postgres, provided by GitHub Actions - this is exactly what
    # Termux couldn't give us, and it's why BackendApplicationTests.contextLoads
    # can finally pass here even though it couldn't run locally on-device.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gpstore_test
          POSTGRES_USER: gpstore
          POSTGRES_PASSWORD: gpstore_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # spring.cache.type=redis and the rate limiter (config.RateLimitFilter)
      # both need a real Redis to connect to - the Spring context itself
      # would likely still boot without one (Lettuce connects lazily), but a
      # real instance here means the same test run actually exercises the
      # real Redis-backed code path instead of relying on that assumption.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      # FLYWAY_ENABLED is false below (schema comes from DDL_AUTO=update
      # instead, see that env var's own comment) - so none of the
      # hand-written SQL migrations (db/migration/V*.sql) ever run here.
      # ddl-auto only creates schema for things a JPA @Entity maps to, so
      # anything migration-only has to be created by hand for CI: pg_trgm
      # (V5), the order-number sequence (V6 - OrderService.placeOrder calls
      # nextval() on this directly, so any test that actually places a real
      # order fails without it), and the shedlock table (V3 - ShedLock's own
      # required layout, not a domain table, so it was never going to come
      # from ddl-auto either).
      - name: Create schema objects Flyway would normally own
        run: |
          PGPASSWORD=gpstore_test_password psql -h localhost -U gpstore -d gpstore_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          PGPASSWORD=gpstore_test_password psql -h localhost -U gpstore -d gpstore_test -c "CREATE SEQUENCE IF NOT EXISTS order_number_seq START WITH 1 INCREMENT BY 1;"
          PGPASSWORD=gpstore_test_password psql -h localhost -U gpstore -d gpstore_test -c "CREATE TABLE IF NOT EXISTS shedlock (name VARCHAR(64) NOT NULL, lock_until TIMESTAMP NOT NULL, locked_at TIMESTAMP NOT NULL, locked_by VARCHAR(255) NOT NULL, PRIMARY KEY (name));"

      - name: Build and run tests
        env:
          DB_URL: jdbc:postgresql://localhost:5432/gpstore_test
          DB_USERNAME: gpstore
          DB_PASSWORD: gpstore_test_password
          JWT_SECRET: ci-test-secret-not-for-real-use-1234567890123456789012345
          DDL_AUTO: update
          FLYWAY_ENABLED: 'false'
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: ./mvnw -B clean verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  build-and-push-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Only publish an image from main - a PR branch shouldn't produce a
    # "real" versioned image until it's actually merged.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is provided automatically by GitHub Actions - no
          # separate secret to create or manage.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        run: echo "name=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
