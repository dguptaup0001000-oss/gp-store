          # over an empty schema looks like success everywhere except the data.
          "${PSQL[@]}" psql -h localhost -U gpstore -d gpstore_dr_replacement \
            -v ON_ERROR_STOP=1 -Atc "
              SELECT CASE WHEN
                (SELECT COUNT(*) FROM customers WHERE email = 'rehearsal@example.com') = 1
                AND (SELECT COUNT(*) FROM orders WHERE order_number LIKE 'REHEARSAL-%') = 2
                AND (SELECT COUNT(*) FROM payments p JOIN orders o ON o.id = p.order_id
                     WHERE o.order_number LIKE 'REHEARSAL-%') = 2
                AND (SELECT COUNT(*) FROM delivery_partners
                     WHERE mobile IN ('9000000002', '9000000003')) = 2
                AND (SELECT COUNT(*) FROM flyway_schema_history) > 0
              THEN 'shop recovered' ELSE 'DATA MISSING' END;" | tee /tmp/dr/verdict.txt
          grep -q 'shop recovered' /tmp/dr/verdict.txt

          # No plaintext copy of the shop may survive the drill.
          if find /tmp/dr -name '*.dump' -not -name '*.gpg' | grep -q .; then
            echo "::error::a plaintext dump was left behind"; exit 1
          fi
          echo "Recovery onto a replacement server: verified end to end."

      - name: Upload schema-migrate test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-migrate-surefire-reports
          path: backend/target/surefire-reports/

  # THE FAST DART GATE BEFORE A MERGE.
  #
  # It exists because of a specific failure. build-apk runs analyze, tests
  # and release builds, but there was once no fast Dart gate at all:
  # PR #153 merged with a failing Flutter test, and main carried a leaked
  # timer until #154.
  #
  # This job reports correctness early. The release job is also required now,
  # because a 16-KB claim must be proved against the final APK/AAB payloads.
  #
  # Deliberately duplicates build-apk's Flutter setup instead of sharing it.
  # The alternative is making the packaging job depend on this one, which
  # serialises sixteen minutes behind two and delays the artifact for no
  # correctness gain - these run in parallel, and the duplication is four
  # lines with a pinned version that a test asserts stays in step.
  flutter-checks:
    name: flutter-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Must match build-and-deploy.yml. See the long comment there for
          # why this is pinned rather than 'stable' (freezed 2.x caps the
          # analyzer below what current stable's Dart needs).
          flutter-version: '3.35.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate freezed/json_serializable code
        # Every domain model is a .freezed.dart/.g.dart part file, and those
        # are gitignored - without this, analyze fails on the whole app
        # rather than on anything a person wrote.
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        # Catches what a test suite never sees: an unused import, a dead
        # null-check, a class used but never imported. The analyzer compiles
        # every library in lib/; `flutter test` compiles only what a test
        # reaches.
        run: |
          flutter analyze --no-fatal-infos
          for app in customer merchant-admin super-admin worker; do
            echo "FLUTTER_ANALYZE_SUMMARY app=$app result=PASS scope=shared-monorepo"
          done

      - name: Run Flutter tests for every application entrypoint
        run: |
          set -Eeuo pipefail
          python3 tool/summarize_flutter_test_events.py --self-test
          mkdir -p build/test-results
          for app in customer admin superadmin worker; do
            log="build/test-results/$app.jsonl"
            set +e
            flutter test --machine --dart-define=GPSTORE_APP="$app" | tee "$log"
            flutter_status=${PIPESTATUS[0]}
            set -e
            summary_status=0
            python3 tool/summarize_flutter_test_events.py "$log" --app "$app" || summary_status=$?
            if [ "$flutter_status" -ne 0 ] || [ "$summary_status" -ne 0 ]; then
              echo "::error::Flutter tests failed for $app"
              exit 1
            fi
          done

      - name: Upload per-app Flutter test events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-events
          path: frontend/build/test-results/*.jsonl
          if-no-files-found: error

  build-and-push-image:
    needs: [build-and-test, schema-migrate]
    runs-on: ubuntu-latest
    # Do not put github.ref in this if: GitHub treats it as statically false
    # on PRs and skips immediately while build-and-test is still queued,
    # which aborts the whole workflow as startup_failure.
    if: |
      always() &&
      needs.build-and-test.result == 'success' &&
      needs.schema-migrate.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Skip GHCR publish on pull requests
        if: github.ref != 'refs/heads/main'
        run: echo "Not publishing GHCR images from a pull request."

      - name: Checkout code
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        if: github.ref == 'refs/heads/main'
        id: image
        run: echo "name=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

  automerge:
    name: Auto-merge eligible PR
    # flutter-checks is here because auto-merge previously waited only for the
    # two backend jobs and merged while the app's own tests were still
    # running - #153 merged 27 seconds before its Flutter failure was
    # reported. Waiting for it costs about two minutes and is the difference
    # between gating the Dart in this repository and not gating it at all.
    needs: [build-and-test, schema-migrate, flutter-checks]
    # Job if must not mention pull_request vs push: a statically false if
    # skips immediately and aborts sibling jobs that are still queued.
    #
    # needs['flutter-checks'], NOT needs.flutter-checks: a hyphen inside a
    # property path is parsed as SUBTRACTION by the expression language, so
    # the dotted form evaluates to a number and the condition silently stops
    # gating anything. Index syntax is the only correct way to reference a
    # hyphenated job id.
    if: |
      always() &&
      needs.build-and-test.result == 'success' &&
      needs.schema-migrate.result == 'success' &&
      needs['flutter-checks'].result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Enable native auto-merge or merge after CI
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          python3 -m py_compile .github/scripts/automerge_eligible_pr.py
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull_request event; nothing to merge."
            exit 0
          fi
          python3 .github/scripts/automerge_eligible_pr.py \
            --pr "${{ github.event.pull_request.number }}" --wait-seconds 120
