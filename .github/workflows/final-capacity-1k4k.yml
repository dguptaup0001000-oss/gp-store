name: Verify marketplace hours capacity fix (temporary)

# Temporary, branch-scoped performance run requested before launch.
#
# It never touches production. The job creates a disposable PostgreSQL + Redis,
# builds a 2,000-shop/100-trade marketplace, boots the real Spring Boot jar,
# then runs the repository's existing marketplace-traffic.js at exactly
# 1,000, 2,000, 3,000 and 4,000 VUs. The client and server share one runner,
# so this is a regression/floor measurement, not a claim about Hostinger's
# absolute production capacity.
on:
  push:
    branches:
      - perf/verify-marketplace-hours
    paths:
      - '.github/workflows/final-capacity-1k4k.yml'
      - 'load-tests/sample-resources.py'

permissions:
  contents: read

jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gpstore_loadtest
          POSTGRES_USER: gpstore
          POSTGRES_PASSWORD: gpstore_loadtest_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/gpstore_loadtest
      DB_USERNAME: gpstore
      DB_PASSWORD: gpstore_loadtest_password
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: gpstore
      PGPASSWORD: gpstore_loadtest_password
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_SECRET: final-capacity-ci-secret-not-for-real-use-12345678901234567890
      DDL_AUTO: validate
      FLYWAY_ENABLED: 'true'
      DB_POOL_MAX_SIZE: '20'
      TOMCAT_MAX_THREADS: '80'
      TOMCAT_ACCEPT_COUNT: '1024'

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Bootstrap disposable schema
        working-directory: backend
        env:
          DDL_AUTO: update
          FLYWAY_ENABLED: 'true'
        run: ./mvnw -B test -Pschema-bootstrap -Dtest=EmptyDatabaseBootstrapTest -DexcludedGroups=

      - name: Seed 2,000-shop marketplace
        working-directory: backend
        env:
          DDL_AUTO: validate
          FLYWAY_ENABLED: 'true'
          ALLOW_TEST_DATA: 'true'
        run: |
          ./mvnw -B test \
            -Dtest=SeedLoadTestMarketplace \
            -Dgpstore.seed.loadtest=true \
            -Dgpstore.test-data.allow=true \
            -Dgpstore.seed.shops=2000 \
            -Dgpstore.seed.customers=50000 \
            -Dgpstore.seed.orders=20000 \
            -Dspring.datasource.url="$DB_URL"
          psql -v ON_ERROR_STOP=1 -d gpstore_loadtest -c ANALYZE

      - name: Record dataset size
        run: |
          psql -v ON_ERROR_STOP=1 -d gpstore_loadtest -tA -F',' -c "
            SELECT
              (SELECT count(*) FROM shops),
              (SELECT count(*) FROM products),
              (SELECT count(*) FROM shop_product_variants),
              (SELECT count(*) FROM customers),
              (SELECT count(*) FROM orders);" | tee "$RUNNER_TEMP/dataset.csv"

      - name: Build backend jar
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - name: Boot backend under test
        working-directory: backend
        run: |
          set -Eeuo pipefail
          jar="$(find target -maxdepth 1 -name '*.jar' ! -name '*sources*' | head -n 1)"
          test -n "$jar"
          nohup java -XX:+UseG1GC -Xms2g -Xmx4g -Xlog:gc*:file="$RUNNER_TEMP/gc.log":time,uptime,level,tags \
            -jar "$jar" > "$RUNNER_TEMP/backend.log" 2>&1 &
          pid=$!
          echo "$pid" > "$RUNNER_TEMP/backend.pid"
          echo "APP_PID=$pid" >> "$GITHUB_ENV"

          for i in $(seq 1 90); do
            if curl -fsS --max-time 5 http://127.0.0.1:8081/v1/api/health >/dev/null; then
              echo "backend healthy after ~$((i * 2)) seconds"
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::backend exited during startup"
              tail -n 200 "$RUNNER_TEMP/backend.log"
              exit 1
            fi
            sleep 2
          done

          echo "::error::backend did not become healthy within 180 seconds"
          tail -n 200 "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Prove marketplace is populated
        run: |
          set -Eeuo pipefail
          curl -fsS --max-time 20 "http://127.0.0.1:8081/v1/api/health"
          count="$(curl -fsS --max-time 20 "http://127.0.0.1:8081/v1/api/marketplace/shops?lat=26.80&lng=83.45" \
            | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          echo "shops serving centre probe: $count"
          test "$count" -gt 0

      - uses: grafana/setup-k6-action@v1

      - name: Prove the 1,000 VU regression is fixed first
        id: ladder
        continue-on-error: true
        working-directory: load-tests
        env:
          BASE_URL: http://127.0.0.1:8081/v1
          STAGES: '1000'
          HOLD_TIME: '60s'
          RAMP_TIME: '20s'
          SOAK_VUS: '0'
          SHOPPERS: '0'
          CONTINUE_ON_FAIL: '0'
          OUT_DIR: '${{ runner.temp }}/capacity-run'
        run: |
          chmod +x run-marketplace-capacity.sh
          ./run-marketplace-capacity.sh

      - name: Print compact result table
        if: always()
        run: |
          echo "===== DATASET ====="
          cat "$RUNNER_TEMP/dataset.csv" || true
          echo "===== CAPACITY STAGES ====="
          cat "$RUNNER_TEMP/capacity-run/stages.txt" || true
          echo "===== BACKEND ERROR SUMMARY ====="
          grep -E "ERROR|OutOfMemory|Pool.*exhaust|Connection.*not available|RejectedExecution|Too many" \
            "$RUNNER_TEMP/backend.log" | tail -n 120 || true
          echo "===== GC TAIL ====="
          tail -n 80 "$RUNNER_TEMP/gc.log" || true

      - name: Upload capacity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-hours-capacity-1000
          path: |
            ${{ runner.temp }}/capacity-run/
            ${{ runner.temp }}/dataset.csv
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/gc.log
          retention-days: 7

      - name: Fail when a performance gate broke
        if: always() && steps.ladder.outcome == 'failure'
        run: |
          echo "::error::At least one requested capacity rung broke an existing repository gate. Evidence was uploaded."
          exit 1

      - name: Stop backend
        if: always()
        run: |
          test -f "$RUNNER_TEMP/backend.pid" || exit 0
          kill "$(cat "$RUNNER_TEMP/backend.pid")" 2>/dev/null || true
