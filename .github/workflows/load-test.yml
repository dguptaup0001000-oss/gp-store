name: Load Test (manual)

# Manually-triggered only (workflow_dispatch, gated by repo write access) -
# this fires real, potentially heavy traffic at a real backend, so it should
# never run on a push/PR trigger.
#
# WHY THIS EXISTS INSTEAD OF JUST RUNNING k6 FROM A PHONE: load-tests/
# started out phone-only (via Termux + phone-loadtest.js) because that's all
# that was available. That works fine up to a point, but at ~200 concurrent
# virtual users the phone's own CPU/mobile network started becoming a
# confound - some of what looked like backend errors were plausibly the
# phone's connections timing out under its own strain, not the server
# actually failing. A GitHub-hosted runner is a real (if modest) cloud
# machine with none of those phone-side limits, so it isolates the
# question this is actually trying to answer: where does the BACKEND
# break, not the test device.
#
# THIS WORKFLOW USED TO HAVE NO TARGET IT COULD ACTUALLY RUN AGAINST, and
# that is what every red run was really saying. base_url defaulted to
# http://127.0.0.1:8081/v1 - correct in FORM, since the app really does serve
# /v1 (server.servlet.context-path) - but nothing was listening on the runner,
# so the preflight refused and the run died in 12 seconds. The only other
# address in existence is production, which run-concurrent-orders.sh refuses
# outright because this script places real orders. Accept the defaults: fail.
# Point it at the one live host: forbidden. There was no third option.
#
# So this job now BUILDS ONE. `ci-ephemeral` boots the real backend on the
# runner against a throwaway Postgres and Redis, seeds the catalogue through
# the shop's own admin endpoint, and points the load test at it. Nothing is
# mocked: it is the same jar, the same Flyway schema, the same Redis-backed
# rate limiter. The database is destroyed with the runner.
#
# WHAT THAT MEASURES, STATED HONESTLY. k6 and the JVM share one runner's
# CPU, so the absolute numbers are a FLOOR on the backend's capacity, not a
# measurement of it - the same class of confound the phone had, moved
# in-process. It is still worth running: a regression that doubles a query
# count or adds a lock shows up as a relative change between runs on
# identical hardware, and that is the question this repository actually
# needs answered between releases. For a real capacity figure, dispatch with
# target=custom against a dedicated staging host.
#
# Uses the "real" k6 script (browse-cart-checkout.js), not the phone
# fallback - k6 runs natively here, no Termux/proot workarounds needed.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to aim. ci-ephemeral builds and boots a throwaway backend on this runner.'
        required: true
        type: choice
        default: 'ci-ephemeral'
        options:
          - ci-ephemeral
          - custom
      base_url:
        description: 'Only for target=custom. Must include /v1. Production is refused.'
        required: false
        default: ''
      accounts:
        description: 'Number of test accounts to seed (takes ~6.5s each, paced to respect the login rate limit)'
        required: true
        default: '40'
      browse_vus:
        description: 'Peak concurrent browse virtual users'
        required: true
        default: '300'
      cart_vus:
        description: 'Peak concurrent cart virtual users'
        required: true
        default: '60'
      duration:
        description: 'Load phase hold duration (k6 time string, e.g. 2m)'
        required: true
        default: '2m'
      ramp_time:
        description: 'Ramp up/down duration (k6 time string)'
        required: true
        default: '30s'

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Present for every target. They cost seconds to start and keeping the job
    # shape identical means a custom-target run exercises the same steps.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gpstore_load
          POSTGRES_USER: gpstore
          POSTGRES_PASSWORD: gpstore_load_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # THE GUARD run-concurrent-orders.sh HAS AND THIS WORKFLOW DID NOT.
      #
      # That script refuses production outright - "Refusing to place load-test
      # orders against production." - because browse-cart-checkout.js places
      # real orders and seeds real accounts. The same script driven from here
      # had no such check: a dispatcher who typed the live hostname into a
      # free-text box would have put hundreds of junk orders and forty junk
      # customers into the real shop's database. The safety lived in the
      # wrapper nobody uses rather than the workflow everybody does.
      - name: Resolve the target, and refuse production
        env:
          TARGET: ${{ inputs.target }}
          CUSTOM_URL: ${{ inputs.base_url }}
        run: |
          set -Eeuo pipefail

          if [ "${TARGET}" = "ci-ephemeral" ]; then
            if [ -n "${CUSTOM_URL}" ]; then
              echo "::error::target=ci-ephemeral ignores base_url, but one was given (${CUSTOM_URL}). Choose target=custom, or clear base_url."
              exit 1
            fi
            # Correct because the app serves its own /v1 context path.
            resolved='http://127.0.0.1:8081/v1'
          else
            if [ -z "${CUSTOM_URL}" ]; then
              echo "::error::target=custom needs a base_url."
              exit 1
            fi
            resolved="${CUSTOM_URL}"
          fi

          case "${resolved}" in
            *gpstore.co.in*)
              echo "::error::Refusing to load test production. This script places real orders and seeds real accounts - see load-tests/run-concurrent-orders.sh, which has refused this since the 5,005-VU run that produced 502s and a bill."
              exit 1 ;;
          esac
          case "${resolved}" in
            *[Tt][Oo][Kk][Ee][Nn]=*|*[Pp][Aa][Ss][Ss]*=*|*[Kk][Ee][Yy]=*)
              echo "::error::base_url appears to contain a credential. Pass secrets as secrets, never in the URL."
              exit 1 ;;
          esac

          echo "BASE_URL=${resolved}" >> "$GITHUB_ENV"
          echo "target   : ${TARGET}"
          echo "base_url : ${resolved}"

      - name: Set up JDK 21
        if: inputs.target == 'ci-ephemeral'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build the backend under test
        if: inputs.target == 'ci-ephemeral'
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - name: Boot the backend
        if: inputs.target == 'ci-ephemeral'
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/gpstore_load
          DB_USERNAME: gpstore
          DB_PASSWORD: gpstore_load_password
          # update, not validate, and this is the same choice ci.yml makes in
          # its "Bootstrap schema with Flyway" step. The schema is not fully
          # expressible in Flyway alone - `addresses` and friends predate it
          # and were originally created by ddl-auto, so Flyway only ALTERs
          # them. On an empty database, validate would fail before the app
          # ever listened.
          DDL_AUTO: update
          FLYWAY_ENABLED: 'true'
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: load-test-secret-not-for-real-use-1234567890123456789012345
        run: |
          set -Eeuo pipefail
          jar="$(find target -maxdepth 1 -name '*.jar' ! -name '*sources*' | head -n 1)"
          test -n "$jar"
          echo "booting $jar"
          nohup java -XX:+UseSerialGC -Xmx1g -jar "$jar" > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"

          # Up to three minutes. A Spring context with Flyway on a cold
          # Postgres is not fast, and failing early here would report a
          # timeout as an unreachable backend - the exact confusion this
          # workflow exists to stop making.
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null --max-time 5 http://127.0.0.1:8081/v1/api/health; then
              echo "backend up after ~$((i * 2))s"
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/backend.pid")" 2>/dev/null; then
              echo "::error::the backend exited during startup"
              tail -n 120 "$RUNNER_TEMP/backend.log"
              exit 1
            fi
            sleep 2
          done
          echo "::error::the backend did not answer /v1/api/health within 180s"
          tail -n 120 "$RUNNER_TEMP/backend.log"
          exit 1

      # WITHOUT A CATALOGUE THE SCRIPT REFUSES TO START. setup() in
      # browse-cart-checkout.js throws "No categories returned from
      # /api/categories" on an empty shop, so a fresh database is as unusable
      # a target as no database. Seeded through the shop's own admin endpoint
      # rather than by writing rows directly, so the load test browses a
      # catalogue built the way the real one was.
      - name: Seed the catalogue
        if: inputs.target == 'ci-ephemeral'
        run: |
          set -Eeuo pipefail
          base='http://127.0.0.1:8081/v1'
          email="loadtest-admin@gpstore.invalid"
          # .invalid is reserved by RFC 2606 and can never be a real inbox.
          pass="Load!Test$RANDOM$RANDOM"

          curl -fsS -o /dev/null -X POST "$base/api/auth/register" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"Load Test Admin\",\"email\":\"$email\",\"phone\":\"9000000001\",\"password\":\"$pass\"}"

          # Registration always creates a CUSTOMER - there is deliberately no
          # API that mints an admin, which is the right design and means the
          # only way to get one is a direct write. Safe here and nowhere else:
          # this database exists for the next twenty minutes and is thrown
          # away with the runner.
          PGPASSWORD=gpstore_load_password psql -h localhost -U gpstore -d gpstore_load \
            -v ON_ERROR_STOP=1 -c "UPDATE customers SET role = 'ADMIN' WHERE email = '$email';"

          # JwtFilter re-checks the role against the live row on every
          # request, so the token minted now carries the promoted role.
          token="$(curl -fsS -X POST "$base/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"password\":\"$pass\"}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          test -n "$token"

          # No token is echoed - only the seeder's own counts.
          curl -fsS -X POST "$base/api/admin/catalog/seed" \
            -H "Authorization: Bearer $token"
          echo

          count="$(curl -fsS "$base/api/categories" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          echo "categories now available: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::the catalogue seed produced no categories - the load test would refuse to start"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ANSWERS "CAN THIS MACHINE REACH THE TARGET?" BEFORE ANYTHING MEASURES
      # ANYTHING. On 31 Aug 2026 a run reported 3/3 requests failed, 0 B
      # transferred and every latency 0 ms, then died inside k6 on a null
      # body. Read quickly that looks like a backend collapse; it was a run
      # pointed somewhere it could not reach, measuring nothing. This step
      # makes that distinction the first thing in the log instead of a
      # forensic exercise afterwards.
      #
      # It stays exactly as strict now that the job boots its own backend: if
      # that boot silently produced something that does not answer 200, this
      # is still the step that says so.
      #
      # NO SECRETS ARE PRINTED. base_url must never carry credentials - it is
      # echoed precisely so a failed run says where it was aimed. Response
      # bodies are not printed; only status and timing.
      - name: Preflight - can this runner reach the target?
        run: |
          set -uo pipefail
          echo "base_url : ${BASE_URL}"
          scheme="$(printf '%s' "${BASE_URL}" | sed -E 's#^([a-z]+)://.*#\1#')"
          host="$(printf '%s' "${BASE_URL}" | sed -E 's#^[a-z]+://##; s#[:/].*$##')"
          echo "scheme   : ${scheme}"
          echo "host     : ${host}"

          echo
          echo "--- DNS ---"
          getent hosts "${host}" || echo "no A/AAAA record resolved for ${host}"

          echo
          echo "--- HTTP / TLS: GET <base_url>/api/health ---"
          # -o /dev/null: the body is not printed. Only the numbers.
          if curl -sS -o /dev/null --max-time 20 \
               -w 'http_status=%{http_code}\ndns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s\nremote=%{remote_ip}:%{remote_port}\n' \
               "${BASE_URL}/api/health"; then
            :
          else
            rc=$?
            echo "::error::curl could not complete the request (exit ${rc}). Nothing can be measured from this runner."
            echo "curl exit 6 = DNS, 7 = connection refused/unreachable, 28 = timeout, 35/60 = TLS."
            exit 1
          fi

          status="$(curl -sS -o /dev/null --max-time 20 -w '%{http_code}' "${BASE_URL}/api/health" || echo 000)"
          if [ "${status}" != "200" ]; then
            echo "::error::${BASE_URL}/api/health answered ${status}, not 200. The address is reachable but is not this API."
            exit 1
          fi
          echo
          echo "preflight OK - the API answered 200 from this runner."

      - name: Seed test accounts
        working-directory: load-tests
        run: BASE_URL="${BASE_URL}" COUNT="${{ inputs.accounts }}" node seed-accounts.js

      - uses: grafana/setup-k6-action@v1

      - name: Run k6 load test
        working-directory: load-tests
        env:
          BROWSE_VUS: ${{ inputs.browse_vus }}
          CART_VUS: ${{ inputs.cart_vus }}
          RAMP_TIME: ${{ inputs.ramp_time }}
          HOLD_TIME: ${{ inputs.duration }}
        run: |
          if [ "${{ inputs.target }}" = "ci-ephemeral" ]; then
            echo "::notice::k6 and the backend share this runner's CPU. Treat these"
            echo "::notice::numbers as a FLOOR on capacity and compare them run to run,"
            echo "::notice::not as the backend's ceiling. Use target=custom against a"
            echo "::notice::dedicated host for an absolute figure."
          fi
          k6 run browse-cart-checkout.js

      # The backend's own view of the run. A load test that pushed the server
      # into GC thrash or connection-pool exhaustion says so here and nowhere
      # in k6's output, which can only see latency from the outside.
      - name: Backend log tail
        if: always() && inputs.target == 'ci-ephemeral'
        run: tail -n 300 "$RUNNER_TEMP/backend.log" || true

      - name: Stop the backend
        if: always() && inputs.target == 'ci-ephemeral'
        run: |
          pid_file="$RUNNER_TEMP/backend.pid"
          [ -f "$pid_file" ] || exit 0
          kill "$(cat "$pid_file")" 2>/dev/null || true
