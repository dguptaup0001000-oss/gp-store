# Auto-merge eligible PRs into main, then production deploy follows.
#
# After required CI is green this workflow:
#   1. Enables GitHub-native auto-merge when the repo setting is on.
#   2. Otherwise merges the PR itself (only after CI is green).
# It never merges drafts, forks, conflicted PRs, failing checks, or PRs that
# still require review. It does not approve reviews or bypass protection.
#
# This token cannot change repository settings (Allow auto-merge, Actions
# write, secrets, rulesets). If merge returns 403, the job fails with the
# exact Settings path that an admin must enable.

name: Auto-merge eligible PRs

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [main]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: enable-automerge-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write

jobs:
  automerge:
    name: Auto-merge eligible PR
    if: |
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) || (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch != 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enable auto-merge if required CI is already green
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          python3 -m py_compile .github/scripts/automerge_eligible_pr.py
          # Do not hold a runner waiting for CI. That deadlocked this repo:
          # auto-merge occupied the runner, CI never started, merge never happened.
          # The CI workflow merges after build-and-test and schema-migrate succeed.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 .github/scripts/automerge_eligible_pr.py --pr "$PR_NUMBER" --wait-seconds 30
          else
            python3 .github/scripts/automerge_eligible_pr.py --sha "$HEAD_SHA" --ci-already-green --wait-seconds 60
          fi
