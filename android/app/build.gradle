plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after Android/Kotlin.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0.0"

// Real release signing - see key.properties.example for the one-time setup.
// This file is deliberately gitignored (it holds a path + two passwords) and
// is NOT generated by anything in this project - you create it yourself,
// once, after generating your own real keystore locally (see
// key.properties.example for the exact command). Falls back cleanly to
// debug signing if it doesn't exist yet, so `flutter build apk` still
// works for local testing before you've set this up.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasRealSigningConfig = keystorePropertiesFile.exists()
if (hasRealSigningConfig) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.gpstore.app"

    // Delegated to whatever the installed Flutter SDK recommends, rather
    // than a hardcoded number that goes stale - this is the modern,
    // future-proof pattern `flutter create` itself uses.
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        applicationId "com.gpstore.app"
        // geolocator, flutter_secure_storage, and url_launcher all work
        // comfortably at Flutter's own recommended minSdk - no need to
        // raise it further for anything this app uses.
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (hasRealSigningConfig) {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            // Uses your real key once key.properties exists (see
            // key.properties.example) - Google Play will reject an upload
            // signed with the debug fallback, so this MUST be real before
            // you actually submit, not just before you test locally.
            signingConfig hasRealSigningConfig ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}
