# Nginx reverse proxy for GP-STORE.
#
# Public: 80 (redirect) and 443 (HTTPS).
# Upstream: Spring Boot on 127.0.0.1:8081 (context-path /v1).
# Redis and Postgres (Supabase) are never proxied here.
#
# Before the first certificate exists, use the HTTP-only server block in
# HOSTINGER_DEPLOYMENT.md, obtain the cert with certbot, then enable this file.
#
# Replace server_name if DNS uses a different hostname than api.gpstore.co.in.
# The Flutter APK must then be rebuilt with matching --dart-define=API_BASE_URL.

limit_req_zone $binary_remote_addr zone=gpstore_general:10m rate=30r/s;

upstream gpstore_backend {
    server 127.0.0.1:8081 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.gpstore.co.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.gpstore.co.in;

    ssl_certificate     /etc/letsencrypt/live/api.gpstore.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gpstore.co.in/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/plain text/css;

    # Cheap liveness for uptime monitors. Spring already implements this
    # at GET /v1/api/health (context-path /v1). Do not point monitors at
    # /v1/api/health/ready — that may borrow a DB connection.
    location = /v1/api/health {
        proxy_pass http://gpstore_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 5s;
        access_log off;
    }

    location / {
        limit_req zone=gpstore_general burst=60 nodelay;

        proxy_pass http://gpstore_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # No WebSockets in this application; keepalive is still useful for HTTP/1.1.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # Catalog JSON can be large; buffering is fine. Cashfree webhooks are small.
        proxy_buffering on;
        proxy_request_buffering on;
    }
}
